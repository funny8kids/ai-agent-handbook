<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="多智能体 Supervisor-Worker 协作图">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <linearGradient id="gSup" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FB7185"/><stop offset="100%" stop-color="#E11D48"/></linearGradient>
    <linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <filter id="sh4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#94A3B8"/>
    </marker>
    <marker id="arr4b" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#bg4)"/>
  <text x="48" y="60" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0F172A">Supervisor–Worker：中心调度 + 并行子 Agent</text>
  <text x="48" y="88" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#64748B">Lead Agent 拆解任务、分派给子 Agent，回收结果后汇总；子 Agent 各自独立上下文</text>

  <!-- 用户 -->
  <g filter="url(#sh4)"><rect x="48" y="220" width="120" height="76" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <text x="108" y="254" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#334155">用户目标</text>
  <text x="108" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Goal</text>

  <!-- Supervisor -->
  <path d="M172 258 L 246 258" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr4)"/>
  <g filter="url(#sh4)"><rect x="250" y="196" width="200" height="124" rx="18" fill="url(#gSup)"/></g>
  <text x="350" y="238" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Supervisor</text>
  <text x="350" y="264" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#FFE4E6">拆解 / 分派 / 汇总</text>
  <text x="350" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#FECDD3">plan · route · merge</text>

  <!-- Workers -->
  <path d="M450 232 C 520 232, 520 172, 596 172" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr4)"/>
  <path d="M450 258 L 596 258" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr4)"/>
  <path d="M450 284 C 520 284, 520 344, 596 344" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr4)"/>

  <g filter="url(#sh4)">
    <rect x="600" y="142" width="290" height="62" rx="14" fill="url(#gW)"/>
    <rect x="600" y="228" width="290" height="62" rx="14" fill="url(#gW)"/>
    <rect x="600" y="314" width="290" height="62" rx="14" fill="url(#gW)"/>
  </g>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#FFFFFF">
    <text x="622" y="169" font-size="15" font-weight="700">Worker A · 搜索</text>
    <text x="622" y="190" font-size="11.5" opacity="0.9">独立上下文 + 独立工具集</text>
    <text x="622" y="255" font-size="15" font-weight="700">Worker B · 分析</text>
    <text x="622" y="276" font-size="11.5" opacity="0.9">独立上下文 + 独立工具集</text>
    <text x="622" y="341" font-size="15" font-weight="700">Worker C · 校验</text>
    <text x="622" y="362" font-size="11.5" opacity="0.9">独立上下文 + 独立工具集</text>
  </g>

  <!-- 结果回传 -->
  <path d="M596 190 C 540 190, 540 250, 456 252" fill="none" stroke="#0EA5E9" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arr4b)"/>
  <path d="M596 276 L 456 266" stroke="#0EA5E9" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arr4b)"/>
  <path d="M596 362 C 540 362, 540 292, 456 280" fill="none" stroke="#0EA5E9" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arr4b)"/>
  <text x="524" y="410" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0369A1">只回传「产出 + 引用」，不回传完整对话</text>

  <!-- 共享事件流 -->
  <g filter="url(#sh4)"><rect x="250" y="440" width="640" height="62" rx="14" fill="#0F172A"/></g>
  <text x="278" y="476" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">共享事件流（append-only）</text>
  <text x="560" y="476" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94A3B8">每一步分派、工具调用、产出与失败全部留痕 → 可回放、可审计、可恢复</text>
</svg>
