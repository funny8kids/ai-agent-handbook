<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img" aria-label="AI Agent 手册学习路线图">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="stage1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="stage2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="stage3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="stage4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FB923C"/><stop offset="100%" stop-color="#EA580C"/></linearGradient>
    <filter id="sh7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="960" height="556" rx="20" fill="url(#bg7)"/>
  <text x="48" y="60" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0F172A">学习路线：四个阶段</text>
  <text x="48" y="90" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">基础 → Agent 核心 → 工程与安全 → 应用与资源；按目标选路线，不必顺序精读</text>

  <!-- 阶段一 -->
  <g filter="url(#sh7)"><rect x="30" y="126" width="212" height="330" rx="16" fill="#FFFFFF"/></g>
  <rect x="30" y="126" width="212" height="8" rx="4" fill="url(#stage1)"/>
  <text x="136" y="170" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#065F46">① 基础</text>
  <text x="136" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748B">2–4 周</text>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#334155">
    <text x="46" y="236">01 AI 基础</text>
    <text x="46" y="270">02 Agent 基础</text>
    <text x="46" y="304">03 LLM 基础</text>
    <text x="46" y="338">04 Prompt 与推理</text>
  </g>
  <text x="46" y="400" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#047857">检验：讲清 Agent 与</text>
  <text x="46" y="424" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#047857">Chatbot 的区别</text>

  <!-- 阶段二 -->
  <g filter="url(#sh7)"><rect x="260" y="126" width="212" height="330" rx="16" fill="#FFFFFF"/></g>
  <rect x="260" y="126" width="212" height="8" rx="4" fill="url(#stage2)"/>
  <text x="366" y="170" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#1D4ED8">② Agent 核心</text>
  <text x="366" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748B">动手阶段</text>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#334155">
    <text x="276" y="236">05 工具与协议</text>
    <text x="276" y="270">06 记忆与 RAG</text>
    <text x="276" y="304">07 规划与执行</text>
    <text x="276" y="338">08 多智能体</text>
  </g>
  <text x="276" y="400" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#2563EB">检验：写一个会调工具</text>
  <text x="276" y="424" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#2563EB">并能恢复错误的 Agent</text>

  <!-- 阶段三 -->
  <g filter="url(#sh7)"><rect x="490" y="126" width="212" height="330" rx="16" fill="#FFFFFF"/></g>
  <rect x="490" y="126" width="212" height="8" rx="4" fill="url(#stage3)"/>
  <text x="596" y="170" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#6D28D9">③ 工程与安全</text>
  <text x="596" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748B">生产化阶段</text>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#334155">
    <text x="506" y="236">09 框架与生态</text>
    <text x="506" y="270">10 评估与安全</text>
    <text x="506" y="304">11 工程化</text>
  </g>
  <text x="506" y="400" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#7C3AED">检验：能评估、能观测、</text>
  <text x="506" y="424" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#7C3AED">能控制成本与权限</text>

  <!-- 阶段四 -->
  <g filter="url(#sh7)"><rect x="720" y="126" width="212" height="330" rx="16" fill="#FFFFFF"/></g>
  <rect x="720" y="126" width="212" height="8" rx="4" fill="url(#stage4)"/>
  <text x="826" y="170" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#C2410C">④ 应用与资源</text>
  <text x="826" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748B">持续查阅</text>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#334155">
    <text x="736" y="236">12 应用案例</text>
    <text x="736" y="270">13 资源库</text>
    <text x="736" y="304">14 模板</text>
    <text x="736" y="338">15 术语表</text>
  </g>
  <text x="736" y="400" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#C2410C">按需查阅，配合论文</text>
  <text x="736" y="424" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#C2410C">与源码深入</text>

  <!-- 底部路线 -->
  <path d="M136 492 L 826 492" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="136" cy="492" r="7" fill="#059669"/>
  <circle cx="366" cy="492" r="7" fill="#2563EB"/>
  <circle cx="596" cy="492" r="7" fill="#7C3AED"/>
  <circle cx="826" cy="492" r="7" fill="#EA580C"/>
  <text x="480" y="528" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#475569">手册是用来「扫」的：先建地图，再按目标深入某一阶段</text>
</svg>
