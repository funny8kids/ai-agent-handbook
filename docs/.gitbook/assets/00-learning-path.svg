<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="AI Agent 手册学习路线图">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="stage1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="stage2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="stage3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="stage4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FB923C"/><stop offset="100%" stop-color="#EA580C"/></linearGradient>
    <filter id="sh7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#bg7)"/>
  <text x="48" y="60" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0F172A">学习路线：四个阶段</text>
  <text x="48" y="88" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#64748B">基础 → Agent 核心 → 工程与安全 → 应用与资源；按目标选路线，不必顺序精读</text>

  <!-- 阶段一 -->
  <g filter="url(#sh7)"><rect x="48" y="126" width="204" height="330" rx="16" fill="#FFFFFF"/></g>
  <rect x="48" y="126" width="204" height="8" rx="4" fill="url(#stage1)"/>
  <text x="150" y="168" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#065F46">① 基础</text>
  <text x="150" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">2–4 周</text>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    <text x="72" y="232">01 AI 基础</text>
    <text x="72" y="266">02 Agent 基础</text>
    <text x="72" y="300">03 LLM 基础</text>
    <text x="72" y="334">04 Prompt 与推理</text>
  </g>
  <text x="72" y="398" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#059669">检验：讲清 Agent 与</text>
  <text x="72" y="416" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#059669">Chatbot 的区别</text>

  <!-- 阶段二 -->
  <g filter="url(#sh7)"><rect x="268" y="126" width="204" height="330" rx="16" fill="#FFFFFF"/></g>
  <rect x="268" y="126" width="204" height="8" rx="4" fill="url(#stage2)"/>
  <text x="370" y="168" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">② Agent 核心</text>
  <text x="370" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">动手阶段</text>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    <text x="292" y="232">05 工具与协议</text>
    <text x="292" y="266">06 记忆与 RAG</text>
    <text x="292" y="300">07 规划与执行</text>
    <text x="292" y="334">08 多智能体</text>
  </g>
  <text x="292" y="398" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#2563EB">检验：写一个会调工具</text>
  <text x="292" y="416" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#2563EB">并能恢复错误的 Agent</text>

  <!-- 阶段三 -->
  <g filter="url(#sh7)"><rect x="488" y="126" width="204" height="330" rx="16" fill="#FFFFFF"/></g>
  <rect x="488" y="126" width="204" height="8" rx="4" fill="url(#stage3)"/>
  <text x="590" y="168" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#6D28D9">③ 工程与安全</text>
  <text x="590" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">生产化阶段</text>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    <text x="512" y="232">09 框架与生态</text>
    <text x="512" y="266">10 评估与安全</text>
    <text x="512" y="300">11 工程化</text>
  </g>
  <text x="512" y="398" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#7C3AED">检验：能评估、能观测、</text>
  <text x="512" y="416" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#7C3AED">能控制成本与权限</text>

  <!-- 阶段四 -->
  <g filter="url(#sh7)"><rect x="708" y="126" width="204" height="330" rx="16" fill="#FFFFFF"/></g>
  <rect x="708" y="126" width="204" height="8" rx="4" fill="url(#stage4)"/>
  <text x="810" y="168" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C2410C">④ 应用与资源</text>
  <text x="810" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">持续查阅</text>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">
    <text x="732" y="232">12 应用案例</text>
    <text x="732" y="266">13 资源库</text>
    <text x="732" y="300">14 模板</text>
    <text x="732" y="334">15 术语表</text>
  </g>
  <text x="732" y="398" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#EA580C">按需查阅，配合论文</text>
  <text x="732" y="416" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#EA580C">与源码深入</text>

  <!-- 底部路线 -->
  <path d="M150 480 L 810 480" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="150" cy="480" r="7" fill="#059669"/>
  <circle cx="370" cy="480" r="7" fill="#2563EB"/>
  <circle cx="590" cy="480" r="7" fill="#7C3AED"/>
  <circle cx="810" cy="480" r="7" fill="#EA580C"/>
  <text x="480" y="514" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#64748B">手册是用来「扫」的：先建地图，再按目标深入某一阶段</text>
</svg>
