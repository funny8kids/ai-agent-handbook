<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="ReAct 闭环示意图：LLM 居中，Thought、Action、Observation 三节点顺时针循环并带流动动画；右侧示例轨迹卡（查游戏公司财报），左侧灰色对比卡说明纯 CoT 只有思考链接触不到世界；底部说明停止条件是输出 final answer 或触顶 MAX_STEPS">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f2f9fe"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0284c7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="gTh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gAc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gOb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <filter id="sh2s" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrSky" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#0284c7"/>
    </marker>
    <marker id="arrGy" markerWidth="9" markerHeight="9" refX="6.4" refY="3" orient="auto">
      <path d="M0,0 L6.4,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== background: gradient + grid + loop glow (second layer) ===== -->
  <rect width="960" height="540" rx="18" fill="url(#bg2)"/>
  <rect width="960" height="540" rx="18" fill="url(#grid2)"/>
  <ellipse cx="470" cy="272" rx="268" ry="212" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="18" fill="none" stroke="#cbd5e1"/>

  <!-- ===== title row ===== -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#0f172a">ReAct 闭环：Thought → Action → Observation</text>
  <text x="40" y="66" font-size="13" fill="#475569">想一步、做一步、看一步：每轮用真实观测校准下一步，而不是靠参数记忆硬编到底</text>
  <g filter="url(#sh2s)">
    <rect x="744" y="24" width="176" height="26" rx="13" fill="#e0f2fe" stroke="#7dd3fc"/>
  </g>
  <text x="832" y="41" text-anchor="middle" font-size="11.5" font-weight="700" fill="#075985">第 4 章 · 推理与行动</text>

  <!-- ===== left card: pure CoT (muted, broken reach) ===== -->
  <g filter="url(#sh2s)">
    <rect x="36" y="104" width="252" height="300" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  </g>
  <text x="52" y="128" font-size="12.5" font-weight="700" fill="#475569">对照：纯 CoT（只有思考）</text>
  <text x="52" y="145" font-size="10.5" fill="#94a3b8">整条链只有 thinking token</text>

  <rect x="52" y="156" width="220" height="26" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="162" y="173" text-anchor="middle" font-size="10.5" fill="#64748b">Thought 1：先假设是任天堂</text>
  <path d="M162 182v6" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrGy)"/>
  <rect x="52" y="188" width="220" height="26" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="162" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">Thought 2：再猜索尼、EA</text>
  <path d="M162 214v6" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrGy)"/>
  <rect x="52" y="220" width="220" height="26" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="162" y="237" text-anchor="middle" font-size="10.5" fill="#64748b">Thought 3：可数字我并不知道</text>

  <!-- broken arrow: no action, so no observation -->
  <path d="M162 248v14" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 4"/>
  <g stroke="#ef4444" stroke-width="2" stroke-linecap="round">
    <path d="M156 268 L168 280"/><path d="M168 268 L156 280"/>
  </g>
  <text x="176" y="279" font-size="9.5" fill="#b91c1c">断开</text>
  <rect x="52" y="288" width="220" height="42" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="162" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">需要的外部事实</text>
  <text x="162" y="322" text-anchor="middle" font-size="10.5" fill="#94a3b8">2026 各季度财报数字</text>

  <rect x="52" y="342" width="220" height="48" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="64" y="361" font-size="11" font-weight="700" fill="#475569">链再长也接触不到世界</text>
  <text x="64" y="378" font-size="10.5" fill="#64748b">只能靠记忆：过期、编造、无出处</text>

  <!-- ===== centre: the ReAct loop ===== -->
  <circle cx="470" cy="282" r="112" fill="none" stroke="#bae6fd" stroke-width="1.4" stroke-dasharray="2 6"/>
  <g stroke="#bae6fd" stroke-width="1.4" stroke-dasharray="4 4">
    <path d="M470 228v-30"/>
    <path d="M518 310l26 15"/>
    <path d="M422 310l-26 15"/>
  </g>

  <!-- flowing arrows: one step per turn, clockwise -->
  <g fill="none" stroke="#0ea5e9" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#arrSky)">
    <path d="M558.3 213.2 A112 112 0 0 1 581.7 274.2">
      <animate attributeName="stroke-dashoffset" values="0;-51" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M522.6 380.9 A112 112 0 0 1 417.4 380.9">
      <animate attributeName="stroke-dashoffset" values="0;-51" dur="2.6s" begin="-0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M359.1 266.4 A112 112 0 0 1 395.1 199">
      <animate attributeName="stroke-dashoffset" values="0;-51" dur="2.6s" begin="-1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- the step travelling around the loop -->
  <circle r="4.5" fill="#0284c7" fill-opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite" path="M470 170 A112 112 0 0 1 567 338 A112 112 0 0 1 373 338 A112 112 0 0 1 470 170"/>
  </circle>

  <!-- exit -->
  <path d="M470 141v-14" stroke="#0891b2" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrSky)"/>
  <rect x="386" y="94" width="168" height="28" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="470" y="113" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0e7490">输出 final answer → 退出</text>
  <text x="566" y="113" font-size="10.5" fill="#64748b">或触顶 MAX_STEPS</text>

  <!-- nodes -->
  <g filter="url(#sh2)">
    <rect x="402" y="143" width="136" height="54" rx="14" fill="url(#gTh)"/>
    <rect x="499" y="311" width="136" height="54" rx="14" fill="url(#gAc)"/>
    <rect x="305" y="311" width="136" height="54" rx="14" fill="url(#gOb)"/>
  </g>
  <g text-anchor="middle" font-weight="700">
    <text x="470" y="166" font-size="13" fill="#ffffff">Thought 思考</text>
    <text x="470" y="184" font-size="10.5" fill="#e0f2fe">还缺什么？要不要调工具</text>
    <text x="567" y="334" font-size="13" fill="#ffffff">Action 行动</text>
    <text x="567" y="352" font-size="10.5" fill="#fff7ed">生成并发起一次工具调用</text>
    <text x="373" y="332" font-size="12.5" fill="#ffffff">Observation 观察</text>
    <text x="373" y="352" font-size="10.5" fill="#d1fae5">真实世界返回的结果</text>
  </g>
  <g filter="url(#sh2s)">
    <circle cx="402" cy="143" r="11" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
    <circle cx="499" cy="311" r="11" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
    <circle cx="305" cy="311" r="11" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="700">
    <text x="402" y="147" fill="#0284c7">1</text>
    <text x="499" y="315" fill="#d97706">2</text>
    <text x="305" y="315" fill="#059669">3</text>
  </g>

  <!-- hub -->
  <circle cx="470" cy="282" r="54" fill="#ffffff" stroke="#0284c7" stroke-width="2.4" filter="url(#sh2)"/>
  <text x="470" y="277" text-anchor="middle" font-size="18" font-weight="700" fill="#0c4a6a">LLM</text>
  <text x="470" y="296" text-anchor="middle" font-size="10.5" fill="#475569">同一条链上想与做</text>
  <text x="470" y="311" text-anchor="middle" font-size="10.5" fill="#94a3b8">一次生成 = 一个节点</text>

  <!-- arc captions -->
  <text x="602" y="240" font-size="10.5" fill="#075985" stroke="#f8fafc" stroke-width="3" paint-order="stroke">决定调用</text>
  <text x="470" y="378" text-anchor="middle" font-size="10.5" fill="#92400e" stroke="#f8fafc" stroke-width="3" paint-order="stroke">沙箱执行 → 返回观测</text>
  <text x="352" y="224" font-size="10.5" fill="#065f46" stroke="#f8fafc" stroke-width="3" paint-order="stroke">结果写回上下文</text>

  <!-- ===== right card: a real trace ===== -->
  <g filter="url(#sh2)">
    <rect x="656" y="104" width="264" height="300" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#7dd3fc"/>
  </g>
  <text x="670" y="128" font-size="13" font-weight="700" fill="#0f172a">示例：一条 ReAct 轨迹</text>
  <text x="670" y="145" font-size="10.5" fill="#475569">问题「哪家游戏公司增长最快？」</text>

  <rect x="670" y="152" width="236" height="52" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
  <rect x="670" y="152" width="4" height="52" rx="2" fill="#0284c7"/>
  <text x="684" y="170" font-size="11" font-weight="700" fill="#0284c7">Thought · 「得先有公司名单」</text>
  <text x="684" y="187" font-size="10" fill="#475569">缺口是事实不是推理 → 去查</text>

  <rect x="670" y="210" width="236" height="52" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="670" y="210" width="4" height="52" rx="2" fill="#d97706"/>
  <text x="684" y="228" font-size="11" font-weight="700" fill="#b45309">Action · search("游戏公司 财报")</text>
  <text x="684" y="245" font-size="10" fill="#475569">参数由模型写，harness 去执行</text>

  <rect x="670" y="268" width="236" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="670" y="268" width="4" height="52" rx="2" fill="#059669"/>
  <text x="684" y="286" font-size="11" font-weight="700" fill="#047857">Observation · 返回 3 条摘要</text>
  <text x="684" y="303" font-size="10" fill="#475569">带来源链接，追加进上下文 +1.2k</text>

  <rect x="670" y="326" width="236" height="26" rx="13" fill="#e0f2fe" stroke="#7dd3fc"/>
  <path d="M684 336 a6 6 0 1 1 2 8" fill="none" stroke="#0284c7" stroke-width="1.6"/>
  <path d="M682 332 L687 336 L682 340" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/>
  <text x="702" y="343" font-size="10" fill="#075985">不够就回到 Thought，step 2、3…</text>

  <rect x="670" y="358" width="236" height="42" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="684" y="376" font-size="11" font-weight="700" fill="#065f46">Final Answer · 3 家 + 增速 + 出处</text>
  <text x="684" y="392" font-size="10" fill="#047857">停止条件命中 → 退出循环</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sh2s)">
    <rect x="36" y="416" width="884" height="80" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
  </g>
  <text x="56" y="440" font-size="12.5" font-weight="700" fill="#0c4a6a">停止条件</text>
  <text x="126" y="440" font-size="12.5" fill="#075985">：模型输出 final answer，或触顶 MAX_STEPS（步数 / token / 墙钟时间），任一命中就退出并把控制权交还调用方。</text>
  <text x="56" y="462" font-size="12" fill="#475569">两种失败都要防：不收敛（一直转圈，靠 MAX_STEPS 兜底并告警）· 过早收敛（还没查就答，靠评测与 trace 抓回来）。</text>
  <text x="56" y="481" font-size="10.5" fill="#94a3b8">每轮观测都追加在上下文尾部：稳定前缀一字不改，缓存才留得住（见第 16 章前缀缓存）。</text>
</svg>
