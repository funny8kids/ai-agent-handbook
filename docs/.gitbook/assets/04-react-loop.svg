<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" role="img" aria-label="ReAct 闭环示意图：LLM 居中，Thought、Action、Observation 三节点顺时针循环并带流动动画；右侧示例轨迹卡（查游戏公司财报），左侧灰色对比卡说明纯 CoT 只有思考链接触不到世界；底部说明停止条件是输出 final answer 或触顶 MAX_STEPS">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f2f9fe"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0284c7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="gTh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gAc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gOb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <filter id="sh2s" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrSky" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#0284c7"/>
    </marker>
    <marker id="arrGy" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== background: gradient + grid + loop glow (second layer) ===== -->
  <rect width="960" height="700" rx="18" fill="url(#bg2)"/>
  <rect width="960" height="700" rx="18" fill="url(#grid2)"/>
  <ellipse cx="476" cy="300" rx="250" ry="230" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="959" height="699" rx="18" fill="none" stroke="#cbd5e1"/>

  <!-- ===== title row ===== -->
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">ReAct 闭环：Thought → Action → Observation</text>
  <text x="40" y="74" font-size="16" fill="#475569">想一步、做一步、看一步：每轮用真实观测校准下一步，而不是靠参数记忆硬编到底</text>
  <g filter="url(#sh2s)">
    <rect x="728" y="26" width="192" height="30" rx="15" fill="#e0f2fe" stroke="#7dd3fc"/>
  </g>
  <text x="824" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">第 4 章 · 推理与行动</text>

  <!-- ===== left card: pure CoT (muted, broken reach) ===== -->
  <g filter="url(#sh2s)">
    <rect x="28" y="104" width="240" height="452" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  </g>
  <text x="42" y="130" font-size="16" font-weight="700" fill="#475569">对照：纯 CoT（只有思考）</text>
  <text x="42" y="152" font-size="15" fill="#94a3b8">整条链只有 thinking token</text>

  <rect x="42" y="166" width="212" height="32" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="148" y="187" text-anchor="middle" font-size="15" fill="#64748b">Thought 1：先假设是任天堂</text>
  <path d="M148 198v8" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrGy)"/>
  <rect x="42" y="208" width="212" height="32" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="148" y="229" text-anchor="middle" font-size="15" fill="#64748b">Thought 2：再猜索尼、EA</text>
  <path d="M148 240v8" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrGy)"/>
  <rect x="42" y="250" width="212" height="32" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="148" y="271" text-anchor="middle" font-size="15" fill="#64748b">Thought 3：数字我还不知道</text>

  <!-- broken arrow: no action, so no observation -->
  <path d="M148 284v12" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 4"/>
  <g stroke="#ef4444" stroke-width="2.2" stroke-linecap="round">
    <path d="M141 302 L155 316"/><path d="M155 302 L141 316"/>
  </g>
  <text x="164" y="317" font-size="15" fill="#b91c1c">断开</text>
  <rect x="42" y="326" width="212" height="52" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="148" y="348" text-anchor="middle" font-size="15" fill="#64748b">需要的外部事实</text>
  <text x="148" y="368" text-anchor="middle" font-size="15" fill="#94a3b8">2026 各季度财报数字</text>

  <rect x="42" y="392" width="212" height="86" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="54" y="416" font-size="16" font-weight="700" fill="#475569">链再长也接触不到世界</text>
  <text x="54" y="442" font-size="15" fill="#64748b">只能靠记忆：</text>
  <text x="54" y="464" font-size="15" fill="#64748b">过期、编造、无出处</text>

  <!-- ===== centre: the ReAct loop (center 476,300 / ring 126 / hub 46) ===== -->
  <circle cx="476" cy="300" r="126" fill="none" stroke="#bae6fd" stroke-width="1.4" stroke-dasharray="2 6"/>

  <!-- flowing arrows: one step per turn, clockwise -->
  <g fill="none" stroke="#0ea5e9" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#arrSky)">
    <path d="M560 204 A126 126 0 0 1 599 274">
      <animate attributeName="stroke-dashoffset" values="0;-51" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M515 420 A126 126 0 0 1 437 420">
      <animate attributeName="stroke-dashoffset" values="0;-51" dur="2.6s" begin="-0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M353 274 A126 126 0 0 1 392 204">
      <animate attributeName="stroke-dashoffset" values="0;-51" dur="2.6s" begin="-1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- the step travelling around the loop -->
  <circle r="5" fill="#0284c7" fill-opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite" path="M476 174 A126 126 0 0 1 585 363 A126 126 0 0 1 367 363 A126 126 0 0 1 476 174"/>
  </circle>

  <!-- exit -->
  <path d="M476 121v7" stroke="#0891b2" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrSky)"/>
  <rect x="336" y="90" width="280" height="30" rx="15" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="476" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">final answer 或 MAX_STEPS → 退出</text>

  <!-- nodes -->
  <g filter="url(#sh2)">
    <rect x="408" y="137" width="136" height="74" rx="14" fill="url(#gTh)"/>
    <rect x="517" y="326" width="136" height="74" rx="14" fill="url(#gAc)"/>
    <rect x="299" y="326" width="136" height="74" rx="14" fill="url(#gOb)"/>
  </g>
  <g text-anchor="middle" font-weight="700">
    <text x="476" y="159" font-size="15" fill="#ffffff">Thought 思考</text>
    <text x="476" y="181" font-size="15" fill="#e0f2fe">还缺什么？</text>
    <text x="476" y="201" font-size="15" fill="#e0f2fe">要不要调工具</text>
    <text x="585" y="348" font-size="15" fill="#ffffff">Action 行动</text>
    <text x="585" y="370" font-size="15" fill="#fff7ed">生成并发起</text>
    <text x="585" y="390" font-size="15" fill="#fff7ed">一次工具调用</text>
    <text x="367" y="348" font-size="15" fill="#ffffff">Observation 观察</text>
    <text x="367" y="370" font-size="15" fill="#d1fae5">真实世界</text>
    <text x="367" y="390" font-size="15" fill="#d1fae5">返回的结果</text>
  </g>
  <g filter="url(#sh2s)">
    <circle cx="408" cy="137" r="13" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
    <circle cx="517" cy="326" r="13" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
    <circle cx="299" cy="326" r="13" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700">
    <text x="408" y="142" fill="#0284c7">1</text>
    <text x="517" y="331" fill="#d97706">2</text>
    <text x="299" y="331" fill="#059669">3</text>
  </g>

  <!-- hub -->
  <circle cx="476" cy="300" r="46" fill="#ffffff" stroke="#0284c7" stroke-width="2.4" filter="url(#sh2)"/>
  <text x="476" y="307" text-anchor="middle" font-size="22" font-weight="700" fill="#0c4a6a">LLM</text>
  <text x="476" y="466" text-anchor="middle" font-size="15" fill="#475569">同一条链上想与做 · 一次生成 = 一个节点</text>

  <!-- arc captions -->
  <text x="600" y="236" font-size="15" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">决定调用</text>
  <text x="600" y="236" font-size="15" fill="#075985">决定调用</text>
  <text x="476" y="440" text-anchor="middle" font-size="15" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">沙箱执行 → 返回观测</text>
  <text x="476" y="440" text-anchor="middle" font-size="15" fill="#92400e">沙箱执行 → 返回观测</text>
  <text x="296" y="236" font-size="15" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linejoin="round">结果写回上下文</text>
  <text x="296" y="236" font-size="15" fill="#065f46">结果写回上下文</text>

  <!-- ===== right card: a real trace ===== -->
  <g filter="url(#sh2)">
    <rect x="664" y="104" width="268" height="452" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#7dd3fc"/>
  </g>
  <text x="678" y="130" font-size="16" font-weight="700" fill="#0f172a">示例：一条 ReAct 轨迹</text>
  <text x="678" y="152" font-size="15" fill="#475569">问题：哪家游戏公司增长最快？</text>

  <rect x="678" y="164" width="240" height="64" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
  <rect x="678" y="164" width="4" height="64" rx="2" fill="#0284c7"/>
  <text x="692" y="186" font-size="15" font-weight="700" fill="#0284c7">Thought · 得先有公司名单</text>
  <text x="692" y="208" font-size="15" fill="#475569">缺口是事实不是推理 → 去查</text>

  <rect x="678" y="234" width="240" height="84" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="678" y="234" width="4" height="84" rx="2" fill="#d97706"/>
  <text x="692" y="256" font-size="15" font-weight="700" fill="#b45309">Action · 调用检索工具</text>
  <text x="692" y="278" font-size="15" fill="#475569">search(游戏公司 财报)</text>
  <text x="692" y="300" font-size="15" fill="#475569">参数由模型写，harness 执行</text>

  <rect x="678" y="324" width="240" height="84" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="678" y="324" width="4" height="84" rx="2" fill="#059669"/>
  <text x="692" y="346" font-size="15" font-weight="700" fill="#047857">Observation · 返回 3 条摘要</text>
  <text x="692" y="368" font-size="15" fill="#475569">带来源链接，追加进上下文</text>
  <text x="692" y="390" font-size="15" fill="#475569">+1.2k token</text>

  <rect x="678" y="414" width="240" height="44" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
  <path d="M692 430 a7 7 0 1 1 2 9" fill="none" stroke="#0284c7" stroke-width="1.8"/>
  <path d="M690 425 L696 430 L690 435" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round"/>
  <text x="712" y="432" font-size="15" fill="#075985">不够就回到 Thought</text>
  <text x="712" y="451" font-size="15" fill="#075985">step 2、3、4…</text>

  <rect x="678" y="464" width="240" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="692" y="486" font-size="15" font-weight="700" fill="#065f46">Final Answer · 3 家 + 增速</text>
  <text x="692" y="508" font-size="15" fill="#047857">+ 出处（可核查的来源链接）</text>
  <text x="692" y="530" font-size="15" fill="#047857">停止条件命中 → 退出循环</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sh2s)">
    <rect x="28" y="572" width="904" height="112" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
  </g>
  <text x="48" y="598" font-size="17" font-weight="700" fill="#0c4a6a">停止条件</text>
  <text x="126" y="598" font-size="15" fill="#075985">：模型输出 final answer，或触顶 MAX_STEPS</text>
  <text x="48" y="622" font-size="15" fill="#075985">（步数 / token / 墙钟时间），任一命中就退出并把控制权交还调用方。</text>
  <text x="48" y="648" font-size="15" fill="#475569">两种失败都要防：不收敛（一直转圈，靠 MAX_STEPS 兜底并告警）· 过早收敛（还没查就答，靠评测与 trace 抓回来）。</text>
  <text x="48" y="672" font-size="15" fill="#94a3b8">每轮观测都追加在上下文尾部：稳定前缀一字不改，缓存才留得住（见第 16 章前缀缓存）。</text>
</svg>
