<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 724" width="768" height="724" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="可观测性控制台窗口示意：顶部搜索框与状态耗时模型时间四个筛选器，左栏五条 trace 列表带状态点与耗时，中间选中 trace 的 span 树配彩色时间条并标出超时错误，底部检查器抽屉核对该 span 的状态、重试、token、成本与输出预览，可重放或加入评测">
  <defs>
    <linearGradient id="bgo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <pattern id="grido" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7c3aed" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="sho" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="shos" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="768" height="724" rx="18" fill="url(#bgo)"/>
  <rect width="768" height="724" rx="18" fill="url(#grido)"/>
  <rect x="0.5" y="0.5" width="767" height="723" rx="18" fill="none" stroke="#cbd5e1"/>

  <!-- ===== 页头 ===== -->
  <text x="28" y="38" font-size="19" font-weight="700" fill="#0f172a">可观测性控制台：从一屏 trace 跳到坏掉的那个 span</text>
  <text x="28" y="60" font-size="14" fill="#475569">搜索找回运行，筛选器锁住错误与慢请求，span 树看时序，底部检查器核对该 span 的输入输出与成本</text>
  <g filter="url(#shos)">
    <rect x="600" y="22" width="140" height="26" rx="13" fill="#f5f3ff" stroke="#ddd6fe"/>
  </g>
  <text x="670" y="39" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">第 11 章 · 可观测</text>

  <!-- ===== 窗口外壳 ===== -->
  <g filter="url(#sho)">
    <rect x="24" y="76" width="720" height="600" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <path d="M24 88 A12 12 0 0 1 36 76 H732 A12 12 0 0 1 744 88 V108 H24 Z" fill="#f3f0fa"/>
  <line x1="24" y1="108" x2="744" y2="108" stroke="#e9d5ff"/>
  <circle cx="44" cy="92" r="5.5" fill="#f87171"/>
  <circle cx="60" cy="92" r="5.5" fill="#fbbf24"/>
  <circle cx="76" cy="92" r="5.5" fill="#34d399"/>
  <text x="94" y="97" font-size="14" font-weight="700" fill="#334155">Agent 可观测性控制台 — Traces</text>
  <rect x="340" y="80" width="272" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <g fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round">
    <circle cx="358" cy="92" r="4.5"/>
    <path d="M361.5 95.5 L366 100"/>
  </g>
  <text x="374" y="97" font-size="13" fill="#94a3b8">按 trace id / 会话 / 关键词搜索</text>
  <rect x="628" y="81" width="96" height="22" rx="11" fill="#e9d5ff"/>
  <text x="676" y="97" text-anchor="middle" font-size="13" fill="#6d28d9">采样 100%</text>

  <!-- ===== 工具条：筛选器 ===== -->
  <rect x="40" y="120" width="88" height="32" rx="16" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="84" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">状态 · 错误</text>
  <rect x="140" y="120" width="104" height="32" rx="16" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="192" y="141" text-anchor="middle" font-size="13" fill="#7c3aed">耗时 · 大于 5 秒</text>
  <rect x="256" y="120" width="88" height="32" rx="16" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="300" y="141" text-anchor="middle" font-size="13" fill="#7c3aed">模型 · 全部</text>
  <rect x="356" y="120" width="100" height="32" rx="16" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="406" y="141" text-anchor="middle" font-size="13" fill="#7c3aed">时间 · 24 小时</text>
  <text x="728" y="141" text-anchor="end" font-size="13" fill="#94a3b8">命中 1,284 条</text>

  <!-- ===== 左栏：trace 列表 ===== -->
  <rect x="40" y="168" width="230" height="346" rx="10" fill="#fdfcff" stroke="#e9d5ff"/>
  <text x="54" y="190" font-size="14" font-weight="700" fill="#0f172a">Trace 列表</text>
  <text x="256" y="190" text-anchor="end" font-size="13" fill="#94a3b8">已筛出 5 条</text>

  <rect x="48" y="202" width="214" height="56" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <circle cx="62" cy="220" r="4.5" fill="#ef4444"/>
  <text x="74" y="225" font-size="13" font-weight="700" fill="#3b0764" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">7f3a…c02d</text>
  <text x="252" y="225" text-anchor="end" font-size="13" font-weight="700" fill="#4c1d95">8.2 s</text>
  <text x="74" y="245" font-size="13" fill="#7c3aed">14 spans · 收尾断言失败</text>

  <circle cx="62" cy="282" r="4.5" fill="#10b981"/>
  <text x="74" y="287" font-size="13" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">b21e…07fa</text>
  <text x="252" y="287" text-anchor="end" font-size="13" font-weight="700" fill="#334155">5.6 s</text>
  <text x="74" y="307" font-size="13" fill="#94a3b8">11 spans · 正常结束</text>

  <circle cx="62" cy="344" r="4.5" fill="#f59e0b"/>
  <text x="74" y="349" font-size="13" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">0cc8…4e19</text>
  <text x="252" y="349" text-anchor="end" font-size="13" font-weight="700" fill="#334155">12.4 s</text>
  <text x="74" y="369" font-size="13" fill="#94a3b8">22 spans · 步数触顶退出</text>

  <circle cx="62" cy="406" r="4.5" fill="#10b981"/>
  <text x="74" y="411" font-size="13" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">e930…b3d7</text>
  <text x="252" y="411" text-anchor="end" font-size="13" font-weight="700" fill="#334155">3.1 s</text>
  <text x="74" y="431" font-size="13" fill="#94a3b8">8 spans · 正常结束</text>

  <circle cx="62" cy="468" r="4.5" fill="#ef4444"/>
  <text x="74" y="473" font-size="13" fill="#334155" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">4d77…a6f2</text>
  <text x="252" y="473" text-anchor="end" font-size="13" font-weight="700" fill="#334155">6.9 s</text>
  <text x="74" y="493" font-size="13" fill="#94a3b8">9 spans · 工具调用超时</text>

  <!-- ===== 中间：span 树 + 彩色时间条 ===== -->
  <rect x="282" y="168" width="442" height="346" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="296" y="190" font-size="14" font-weight="700" fill="#0f172a">Trace 7f3a…c02d · 14 spans · 8.2 s</text>
  <g font-size="13" fill="#94a3b8" text-anchor="middle">
    <text x="400" y="210">0s</text><text x="477" y="210">2s</text><text x="554" y="210">4s</text>
    <text x="631" y="210">6s</text><text x="708" y="210">8s</text>
  </g>
  <line x1="400" y1="216" x2="708" y2="216" stroke="#e2e8f0"/>
  <g stroke="#f1f5f9">
    <line x1="477" y1="218" x2="477" y2="480"/><line x1="554" y1="218" x2="554" y2="480"/>
    <line x1="631" y1="218" x2="631" y2="480"/>
  </g>
  <g font-size="13" fill="#334155">
    <text x="296" y="232">agent 运行</text>
    <text x="296" y="262">组装提示</text>
    <text x="296" y="292" fill="#6d28d9">└ react 循环</text>
    <text x="310" y="322">├ 思考 1</text>
    <text x="310" y="352">├ 搜索网页</text>
    <text x="310" y="382">├ 思考 2</text>
    <text x="310" y="412" fill="#b91c1c" font-weight="700">├ 查财报 超时</text>
    <text x="310" y="442">├ 子代理制表</text>
    <text x="310" y="472">└ 输出守卫</text>
  </g>
  <rect x="400" y="223" width="290" height="11" rx="3" fill="#94a3b8"/>
  <rect x="400" y="253" width="14" height="11" rx="3" fill="#cbd5e1"/>
  <rect x="414" y="283" width="276" height="11" rx="3" fill="#a78bfa"/>
  <rect x="417" y="313" width="20" height="11" rx="3" fill="#e879f9"/>
  <rect x="437" y="343" width="38" height="11" rx="3" fill="#22d3ee"/>
  <rect x="475" y="373" width="16" height="11" rx="3" fill="#e879f9"/>
  <rect x="491" y="403" width="50" height="11" rx="3" fill="#22d3ee" stroke="#ef4444" stroke-width="1.6"/>
  <path d="M545 404 l8 8 M553 404 l-8 8" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <rect x="566" y="433" width="40" height="11" rx="3" fill="#c4b5fd"/>
  <rect x="660" y="463" width="12" height="11" rx="3" fill="#fbbf24"/>

  <!-- ===== 底部抽屉：span 详情检查器 ===== -->
  <rect x="40" y="530" width="680" height="136" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="54" y="552" font-size="14" font-weight="700" fill="#4c1d95">Span 详情</text>
  <text x="140" y="552" font-size="13" font-weight="700" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">fetch_financials</text>
  <rect x="278" y="538" width="112" height="22" rx="11" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="334" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">timeout · 5 s</text>
  <g font-size="13">
    <text x="54" y="582" fill="#64748b">状态</text><text x="200" y="582" text-anchor="end" font-weight="700" fill="#b91c1c">error</text>
    <text x="54" y="606" fill="#64748b">开始于</text><text x="200" y="606" text-anchor="end" fill="#0f172a">2.1 s</text>
    <text x="54" y="630" fill="#64748b">耗时</text><text x="200" y="630" text-anchor="end" fill="#0f172a">5.0 s</text>
    <text x="224" y="582" fill="#64748b">重试</text><text x="360" y="582" text-anchor="end" fill="#0f172a">1 次 · 换源</text>
    <text x="224" y="606" fill="#64748b">tokens</text><text x="360" y="606" text-anchor="end" fill="#0f172a">1.2k + 340</text>
    <text x="224" y="630" fill="#64748b">成本</text><text x="360" y="630" text-anchor="end" fill="#0f172a">¥0.021</text>
  </g>
  <line x1="392" y1="544" x2="392" y2="652" stroke="#e9d5ff"/>
  <text x="404" y="552" font-size="13" font-weight="700" fill="#4c1d95">输出预览</text>
  <rect x="400" y="560" width="200" height="84" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-size="13" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">
    <text x="410" y="580"><tspan fill="#64748b">{ </tspan><tspan fill="#0f766e">"error"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"TIMEOUT",</tspan></text>
    <text x="410" y="600"><tspan fill="#64748b">  </tspan><tspan fill="#0f766e">"after_retries"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#7c3aed">1</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="410" y="620"><tspan fill="#64748b">  </tspan><tspan fill="#0f766e">"next"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"换源重试"</tspan><tspan fill="#64748b"> }</tspan></text>
  </g>
  <rect x="612" y="546" width="76" height="26" rx="13" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="650" y="563" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">重放</text>
  <rect x="612" y="580" width="104" height="26" rx="13" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="664" y="597" text-anchor="middle" font-size="13" fill="#6d28d9">加评测集</text>

  <!-- ===== 底注 ===== -->
  <text x="28" y="700" font-size="13" fill="#64748b">三跳定位：搜索找回 trace → 筛选器缩到错误 → span 树里最长那根带红框的条；把失败样例一键沉淀为回归评测用例。</text>
</svg>
