  <text x="750" y="284" text-anchor="middle" fill="#475569" font-size="16">/workspace 文件</text>

  <line x1="200" y1="135" x2="280" y2="135" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="560" y1="160" x2="640" y2="160" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="560" y1="270" x2="640" y2="270" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="40" y="400" fill="#475569" font-size="16">关键点：harness 由 OpenAI 版本化维护；你投资工具、知识与验收标准。</text>
  <text x="40" y="422" fill="#64748b" font-size="15">开源对照：github.com/openai/codex · 发布：2026-09-10 公测</text>
