<svg width="920" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" role="img" aria-label="OpenAI Agents API 架构">
  <rect width="920" height="460" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="24" y="32" font-size="19" font-weight="700" fill="#0f172a">OpenAI Agents API：托管 harness 架构（2026-09）</text>
  <text x="24" y="56" fill="#64748b" font-size="16">一次 sessions.create：模型 + 循环 + 压缩 + 子 Agent + 沙箱</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="40" y="100" width="160" height="70" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="120" y="130" text-anchor="middle" font-weight="700" fill="#312e81">你的应用</text>
  <text x="120" y="150" text-anchor="middle" fill="#4338ca" font-size="16">任务 · 事件流</text>

  <rect x="280" y="80" width="280" height="280" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="420" y="108" text-anchor="middle" font-weight="700" fill="#064e3b">Agents API（托管）</text>

  <rect x="300" y="124" width="240" height="48" rx="8" fill="#fff" stroke="#34d399"/>
  <text x="420" y="153" text-anchor="middle" fill="#065f46">Codex harness 循环</text>

  <rect x="300" y="186" width="112" height="56" rx="8" fill="#fff" stroke="#6ee7b7"/>
  <text x="356" y="210" text-anchor="middle" fill="#047857" font-size="16">自动压缩</text>
  <text x="356" y="228" text-anchor="middle" fill="#047857" font-size="15">compaction</text>

  <rect x="428" y="186" width="112" height="56" rx="8" fill="#fff" stroke="#6ee7b7"/>
  <text x="484" y="210" text-anchor="middle" fill="#047857" font-size="16">Tool search</text>
  <text x="484" y="228" text-anchor="middle" fill="#047857" font-size="15">按需加载定义</text>

  <rect x="300" y="256" width="240" height="52" rx="8" fill="#fff" stroke="#a7f3d0"/>
  <text x="420" y="280" text-anchor="middle" fill="#065f46" font-size="16">子 Agent 并行</text>
  <text x="420" y="300" text-anchor="middle" fill="#047857" font-size="15">独立上下文 · 主 Agent 汇总</text>

  <rect x="300" y="318" width="240" height="28" rx="6" fill="#d1fae5" stroke="#10b981"/>
