  <rect x="640" y="100" width="220" height="100" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="750" y="132" text-anchor="middle" font-weight="700" fill="#9a3412">沙箱环境</text>
  <text x="750" y="154" text-anchor="middle" fill="#c2410c" font-size="16">OpenAI hosted</text>
  <text x="750" y="174" text-anchor="middle" fill="#c2410c" font-size="16">或 E2B/Modal/CF…</text>

  <rect x="640" y="230" width="220" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
