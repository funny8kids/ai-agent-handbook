<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="缩放点积注意力计算流程图">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="gQ" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="gK" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F472B6"/><stop offset="100%" stop-color="#DB2777"/></linearGradient>
    <linearGradient id="gV" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#bg3)"/>
  <text x="48" y="60" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0F172A">缩放点积注意力：一次矩阵乘法让所有词互看</text>
  <text x="48" y="88" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#64748B">Attention(Q, K, V) = softmax( QKᵀ / √dₖ ) · V</text>

  <!-- 输入 X -->
  <g filter="url(#sh3)"><rect x="48" y="150" width="120" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <text x="108" y="188" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1E293B">输入 X</text>
  <g fill="#CBD5E1">
    <rect x="70" y="212" width="76" height="10" rx="5"/>
    <rect x="70" y="232" width="76" height="10" rx="5"/>
    <rect x="70" y="252" width="76" height="10" rx="5"/>
    <rect x="70" y="272" width="76" height="10" rx="5"/>
    <rect x="70" y="292" width="76" height="10" rx="5"/>
    <rect x="70" y="312" width="76" height="10" rx="5"/>
  </g>
  <text x="108" y="352" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94A3B8">n 个 token</text>
  <text x="108" y="370" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94A3B8">维度 d</text>

  <!-- 三个投影 -->
  <path d="M172 270 L214 270" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g filter="url(#sh3)">
    <rect x="218" y="150" width="130" height="66" rx="14" fill="url(#gQ)"/>
    <rect x="218" y="237" width="130" height="66" rx="14" fill="url(#gK)"/>
    <rect x="218" y="324" width="130" height="66" rx="14" fill="url(#gV)"/>
  </g>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="283" y="180" font-size="16" font-weight="700">Q = X·W_Q</text>
    <text x="283" y="201" font-size="11.5" opacity="0.9">我在找什么</text>
    <text x="283" y="267" font-size="16" font-weight="700">K = X·W_K</text>
    <text x="283" y="288" font-size="11.5" opacity="0.9">我是什么</text>
    <text x="283" y="354" font-size="16" font-weight="700">V = X·W_V</text>
    <text x="283" y="375" font-size="11.5" opacity="0.9">我携带的信息</text>
  </g>

  <!-- QK^T -->
  <path d="M352 183 C 388 183, 392 240, 420 250" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <path d="M352 270 L 420 270" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g filter="url(#sh3)"><rect x="424" y="222" width="150" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <text x="499" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">QKᵀ</text>
  <g fill="#E2E8F0">
    <rect x="444" y="262" width="26" height="10" rx="3"/><rect x="474" y="262" width="26" height="10" rx="3"/><rect x="504" y="262" width="26" height="10" rx="3"/><rect x="534" y="262" width="26" height="10" rx="3"/>
    <rect x="444" y="278" width="26" height="10" rx="3"/><rect x="474" y="278" width="26" height="10" rx="3"/><rect x="504" y="278" width="26" height="10" rx="3"/><rect x="534" y="278" width="26" height="10" rx="3"/>
    <rect x="444" y="294" width="26" height="10" rx="3"/><rect x="474" y="294" width="26" height="10" rx="3"/><rect x="504" y="294" width="26" height="10" rx="3"/><rect x="534" y="294" width="26" height="10" rx="3"/>
  </g>
  <text x="499" y="212" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#64748B">每对词的匹配分</text>

  <!-- scale -->
  <path d="M578 270 L 612 270" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g filter="url(#sh3)"><circle cx="648" cy="270" r="34" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/></g>
  <text x="648" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#B45309">÷ √dₖ</text>
  <text x="648" y="283" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#B45309">防饱和</text>

  <!-- softmax -->
  <path d="M686 270 L 720 270" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g filter="url(#sh3)"><rect x="724" y="238" width="120" height="64" rx="14" fill="#818CF8"/></g>
  <text x="784" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">softmax</text>
  <text x="784" y="287" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#E0E7FF">每行权重和为 1</text>

  <!-- V 汇入 -->
  <path d="M348 357 C 420 357, 500 340, 560 320 L 700 320 L 744 300" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr3)"/>
  <text x="560" y="345" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#047857">加权求和 · V</text>

  <!-- 输出 -->
  <path d="M848 270 L 892 270" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g filter="url(#sh3)"><rect x="740" y="380" width="180" height="86" rx="14" fill="#0F172A"/></g>
  <text x="830" y="414" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">输出</text>
  <text x="830" y="438" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94A3B8">融合全文信息的新表示</text>
  <path d="M892 272 C 930 272, 930 420, 924 420" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>

  <text x="48" y="466" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">多头：并行做 h 组（各自一套 W_Q/W_K/W_V），拼接后经 W_O 输出 —— 同时关注语法、指代、位置等不同关系。</text>
  <text x="48" y="492" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">代价：注意力矩阵是 O(n²)，序列越长显存与算力越贵 —— 这是长上下文昂贵、需要 KV 缓存与压缩的根因。</text>
</svg>
