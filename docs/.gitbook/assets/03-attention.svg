<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="缩放点积注意力计算流程图">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="gQ" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="gK" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F472B6"/><stop offset="100%" stop-color="#DB2777"/></linearGradient>
    <linearGradient id="gV" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#94A3B8"/>
    </marker>
    <marker id="arr3g" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="600" rx="20" fill="url(#bg3)"/>
  <text x="48" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0F172A">缩放点积注意力：一次矩阵乘法让所有词互看</text>
  <text x="48" y="88" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748B">Attention(Q, K, V) = softmax( QKᵀ / √dₖ ) · V</text>

  <!-- 输入 X -->
  <g filter="url(#sh3)"><rect x="48" y="140" width="124" height="268" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <text x="110" y="180" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1E293B">输入 X</text>
  <g fill="#CBD5E1">
    <rect x="72" y="204" width="76" height="12" rx="6"/>
    <rect x="72" y="228" width="76" height="12" rx="6"/>
    <rect x="72" y="252" width="76" height="12" rx="6"/>
    <rect x="72" y="276" width="76" height="12" rx="6"/>
    <rect x="72" y="300" width="76" height="12" rx="6"/>
    <rect x="72" y="324" width="76" height="12" rx="6"/>
  </g>
  <text x="110" y="358" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#94A3B8">n 个 token</text>
  <text x="110" y="382" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#94A3B8">维度 d</text>

  <!-- 三个投影 -->
  <path d="M176 274 L 212 274" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g filter="url(#sh3)">
    <rect x="218" y="140" width="134" height="76" rx="14" fill="url(#gQ)"/>
    <rect x="218" y="236" width="134" height="76" rx="14" fill="url(#gK)"/>
    <rect x="218" y="332" width="134" height="76" rx="14" fill="url(#gV)"/>
  </g>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="285" y="172" font-size="17" font-weight="700">Q = X·W_Q</text>
    <text x="285" y="198" font-size="15" opacity="0.92">我在找什么</text>
    <text x="285" y="268" font-size="17" font-weight="700">K = X·W_K</text>
    <text x="285" y="294" font-size="15" opacity="0.92">我是什么</text>
    <text x="285" y="364" font-size="17" font-weight="700">V = X·W_V</text>
    <text x="285" y="390" font-size="15" opacity="0.92">我携带的信息</text>
  </g>

  <!-- QK^T -->
  <path d="M356 178 C 392 178, 396 240, 418 252" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <path d="M356 274 L 418 274" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <text x="499" y="212" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748B">每对词的匹配分</text>
  <g filter="url(#sh3)"><rect x="424" y="222" width="150" height="104" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <text x="499" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#334155">QKᵀ</text>
  <g fill="#E2E8F0">
    <rect x="444" y="262" width="26" height="12" rx="3"/><rect x="474" y="262" width="26" height="12" rx="3"/><rect x="504" y="262" width="26" height="12" rx="3"/><rect x="534" y="262" width="26" height="12" rx="3"/>
    <rect x="444" y="280" width="26" height="12" rx="3"/><rect x="474" y="280" width="26" height="12" rx="3"/><rect x="504" y="280" width="26" height="12" rx="3"/><rect x="534" y="280" width="26" height="12" rx="3"/>
    <rect x="444" y="298" width="26" height="12" rx="3"/><rect x="474" y="298" width="26" height="12" rx="3"/><rect x="504" y="298" width="26" height="12" rx="3"/><rect x="534" y="298" width="26" height="12" rx="3"/>
  </g>

  <!-- scale -->
  <path d="M578 274 L 604 274" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g filter="url(#sh3)"><circle cx="648" cy="274" r="38" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/></g>
  <text x="648" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#B45309">÷ √dₖ</text>
  <text x="648" y="292" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#B45309">防饱和</text>

  <!-- softmax -->
  <path d="M686 274 L 718 274" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g filter="url(#sh3)"><rect x="724" y="236" width="140" height="76" rx="14" fill="#818CF8"/></g>
  <text x="794" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">softmax</text>
  <text x="794" y="294" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#E0E7FF">每行权重和为 1</text>

  <!-- V 汇入：加权求和 -->
  <text x="470" y="386" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#047857">加权求和 · V</text>
  <path d="M356 370 C 430 370, 430 402, 470 402 L 694 402" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr3g)"/>

  <!-- 输出 -->
  <path d="M794 312 L 794 348" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g filter="url(#sh3)"><rect x="704" y="356" width="180" height="92" rx="14" fill="#0F172A"/></g>
  <text x="794" y="392" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">输出</text>
  <text x="794" y="420" text-anchor="middle" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#CBD5E1">融合全文信息的新表示</text>

  <text x="48" y="492" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#475569">多头：并行做 h 组（各自一套 W_Q/W_K/W_V），拼接后经 W_O 输出 —— 同时关注语法、指代、位置等不同关系。</text>
  <text x="48" y="520" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#475569">代价：注意力矩阵是 O(n²)，序列越长显存与算力越贵 —— 这是长上下文昂贵、需要 KV 缓存与压缩的根因。</text>
</svg>
