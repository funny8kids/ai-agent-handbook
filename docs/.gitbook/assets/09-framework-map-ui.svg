<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" width="960" height="624" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" role="img" aria-label="框架选型速查信息图：顶部怎么选决策节点向下串五个问题，是则左右分流到图状态机编排、角色对话编排、检索优先框架、提示程序化、事件驱动编排六张范式卡，全部答否则落到托管平台，每卡配一句适用场景">
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <pattern id="gridf" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4f46e5" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="gDec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gCardL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="gCardR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shf" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="shfs" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrInd" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrSl" markerWidth="9" markerHeight="9" refX="6.4" refY="3" orient="auto">
      <path d="M0,0 L6.4,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="960" height="624" rx="18" fill="url(#bgf)"/>
  <rect width="960" height="624" rx="18" fill="url(#gridf)"/>
  <rect x="0.5" y="0.5" width="959" height="623" rx="18" fill="none" stroke="#cbd5e1"/>

  <!-- ===== 页头 ===== -->
  <text x="32" y="36" font-size="19" font-weight="700" fill="#0f172a">框架选型速查：先选范式，再点名框架</text>
  <text x="32" y="58" font-size="16" fill="#475569">六种编排思路 × 一条五问决策链：先定控制流的形态，再谈具体选型</text>
  <g filter="url(#shfs)">
    <rect x="780" y="20" width="150" height="28" rx="14" fill="#e0e7ff" stroke="#c7d2fe"/>
  </g>
  <text x="855" y="39" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">第 9 章 · 框架与编排</text>

  <!-- ===== 决策链主干 ===== -->
  <g filter="url(#shf)">
    <rect x="352" y="72" width="256" height="40" rx="20" fill="url(#gDec)"/>
  </g>
  <text x="480" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">怎么选？按顺序回答五个问题</text>

  <line x1="480" y1="112" x2="480" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrSl)"/>
  <line x1="480" y1="174" x2="480" y2="218" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrSl)"/>
  <line x1="480" y1="262" x2="480" y2="306" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrSl)"/>
  <line x1="480" y1="350" x2="480" y2="394" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrSl)"/>
  <line x1="480" y1="438" x2="480" y2="482" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrSl)"/>
  <g font-size="15" fill="#94a3b8">
    <text x="492" y="202">否</text>
    <text x="492" y="290">否</text>
    <text x="492" y="378">否</text>
    <text x="492" y="466">否</text>
  </g>

  <!-- 五个问题胶囊 -->
  <g font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">
    <rect x="352" y="130" width="256" height="44" rx="22" fill="#ffffff" stroke="#a5b4fc" filter="url(#shfs)"/>
    <text x="480" y="158">要显式状态图、回环与断点恢复？</text>
    <rect x="352" y="218" width="256" height="44" rx="22" fill="#ffffff" stroke="#a5b4fc" filter="url(#shfs)"/>
    <text x="480" y="246">要多角色互相对话协作？</text>
    <rect x="352" y="306" width="256" height="44" rx="22" fill="#ffffff" stroke="#a5b4fc" filter="url(#shfs)"/>
    <text x="480" y="334">以知识检索问答为主？</text>
    <rect x="352" y="394" width="256" height="44" rx="22" fill="#ffffff" stroke="#a5b4fc" filter="url(#shfs)"/>
    <text x="480" y="422">想用数据自动调提示词？</text>
    <rect x="352" y="482" width="256" height="44" rx="22" fill="#ffffff" stroke="#a5b4fc" filter="url(#shfs)"/>
    <text x="480" y="510">要接高并发事件流与人审？</text>
  </g>

  <!-- 是分支箭头与标签 -->
  <g stroke="#4f46e5" stroke-width="1.8">
    <line x1="352" y1="152" x2="336" y2="152" marker-end="url(#arrInd)"/>
    <line x1="608" y1="240" x2="624" y2="240" marker-end="url(#arrInd)"/>
    <line x1="352" y1="328" x2="336" y2="328" marker-end="url(#arrInd)"/>
    <line x1="608" y1="416" x2="624" y2="416" marker-end="url(#arrInd)"/>
    <line x1="352" y1="504" x2="336" y2="504" marker-end="url(#arrInd)"/>
    <line x1="608" y1="504" x2="624" y2="504" marker-end="url(#arrInd)"/>
  </g>
  <g font-size="15" font-weight="700" fill="#059669" text-anchor="middle">
    <text x="341" y="144">是</text>
    <text x="619" y="232">是</text>
    <text x="341" y="320">是</text>
    <text x="619" y="408">是</text>
    <text x="341" y="496">是</text>
  </g>
  <text x="619" y="496" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">否</text>

  <!-- ===== 六张范式卡 ===== -->
  <!-- A 图状态机（左 1） -->
  <g filter="url(#shf)">
    <rect x="40" y="112" width="290" height="80" rx="12" fill="url(#gCardL)" stroke="#c7d2fe"/>
  </g>
  <g transform="translate(0,10)">
    <rect x="52" y="124" width="36" height="36" rx="9" fill="#e0e7ff"/>
    <g stroke="#4338ca" stroke-width="1.8" fill="none">
      <circle cx="64" cy="136" r="3.2"/><circle cx="79" cy="133" r="3.2"/><circle cx="68" cy="150" r="3.2"/>
      <path d="M66.5 138 L66.8 147 M67 136 L76 133.6 M70.5 148.6 L77 136"/>
    </g>
  </g>
  <text x="102" y="146" font-size="16" font-weight="700" fill="#0f172a">图状态机编排</text>
  <text x="102" y="168" fill="#475569">分支回环多，</text>
  <text x="102" y="186" fill="#475569">要断点恢复与回放</text>

  <!-- B 角色对话（右 2） -->
  <g filter="url(#shf)">
    <rect x="630" y="200" width="290" height="80" rx="12" fill="url(#gCardR)" stroke="#c7d2fe"/>
  </g>
  <g transform="translate(10,28)">
    <rect x="632" y="194" width="36" height="36" rx="9" fill="#e0e7ff"/>
    <g stroke="#4338ca" stroke-width="1.8" fill="none">
      <rect x="638" y="202" width="17" height="12" rx="3.5"/>
      <rect x="647" y="210" width="16" height="11" rx="3.5" fill="#e0e7ff"/>
    </g>
  </g>
  <text x="692" y="234" font-size="16" font-weight="700" fill="#0f172a">角色对话编排</text>
  <text x="692" y="256" fill="#475569">把团队分工写进提示，</text>
  <text x="692" y="274" fill="#475569">轮流议事</text>

  <!-- C 检索优先（左 3） -->
  <g filter="url(#shf)">
    <rect x="40" y="288" width="290" height="80" rx="12" fill="url(#gCardL)" stroke="#c7d2fe"/>
  </g>
  <g transform="translate(0,46)">
    <rect x="52" y="264" width="36" height="36" rx="9" fill="#e0e7ff"/>
    <g stroke="#4338ca" stroke-width="1.8" fill="none" stroke-linecap="round">
      <circle cx="67" cy="279" r="5.5"/>
      <path d="M71.5 283.5 L77 289 M78 271 L83 271"/>
    </g>
  </g>
  <text x="102" y="322" font-size="16" font-weight="700" fill="#0f172a">检索优先框架</text>
  <text x="102" y="344" fill="#475569">知识问答是主线，</text>
  <text x="102" y="362" fill="#475569">工具围着检索转</text>

  <!-- D 提示程序化（右 4） -->
  <g filter="url(#shf)">
    <rect x="630" y="376" width="290" height="80" rx="12" fill="url(#gCardR)" stroke="#c7d2fe"/>
  </g>
  <g transform="translate(10,64)">
    <rect x="632" y="334" width="36" height="36" rx="9" fill="#e0e7ff"/>
    <g stroke="#4338ca" stroke-width="1.8" stroke-linecap="round">
      <path d="M639 346 L661 346 M639 358 L661 358"/>
      <circle cx="653" cy="346" r="3" fill="#ffffff"/>
      <circle cx="646" cy="358" r="3" fill="#ffffff"/>
    </g>
  </g>
  <text x="692" y="410" font-size="16" font-weight="700" fill="#0f172a">提示程序化</text>
  <text x="692" y="432" fill="#475569">提示词当参数，</text>
  <text x="692" y="450" fill="#475569">用数据调整条流水线</text>

  <!-- E 事件驱动（左 5） -->
  <g filter="url(#shf)">
    <rect x="40" y="464" width="290" height="80" rx="12" fill="url(#gCardL)" stroke="#c7d2fe"/>
  </g>
  <g transform="translate(0,82)">
    <path d="M73 409 L61 426 L68 426 L65 437 L78 419 L70 419 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="102" y="498" font-size="16" font-weight="700" fill="#0f172a">事件驱动编排</text>
  <text x="102" y="520" fill="#475569">消息触发、人审插队，</text>
  <text x="102" y="538" fill="#475569">随时可暂停</text>

  <!-- F 托管平台（右 5，兜底） -->
  <g filter="url(#shf)">
    <rect x="630" y="464" width="290" height="80" rx="12" fill="url(#gCardR)" stroke="#fcd34d"/>
  </g>
  <g transform="translate(10,82)">
    <rect x="632" y="404" width="36" height="36" rx="9" fill="#fef3c7"/>
    <g stroke="#b45309" stroke-width="1.8" fill="none">
      <path d="M641 426 A5.5 5.5 0 1 1 643.5 416 A7 7 0 0 1 657 415.5 A5.5 5.5 0 1 1 659 426 Z"/>
    </g>
  </g>
  <text x="692" y="498" font-size="16" font-weight="700" fill="#0f172a">托管平台</text>
  <text x="692" y="520" fill="#475569">都不强求就不自建，</text>
  <text x="692" y="538" fill="#475569">合规换时间</text>

  <!-- ===== 底注 ===== -->
  <text x="40" y="580" font-size="16" fill="#475569">决策口诀：<tspan font-weight="700" fill="#4338ca">控制流越复杂越靠图，协作越像开会越靠角色，流量越大越靠事件，越不想运维越靠托管。</tspan></text>
  <text x="40" y="606" font-size="15" fill="#94a3b8">范式比名字重要：换框架换不掉坏架构，先选对控制流形态，再看生态、可观测与锁定成本。</text>
</svg>
