<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="一次 Agent 运行的 trace 瀑布图：左侧 span 树、右侧 0 到 8 秒时间轴，条形按时序生长动画">
  <defs>
    <linearGradient id="bgw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFAFF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
    <linearGradient id="gRun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#86198F"/><stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="gLLM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E879F9"/><stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="gTool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="gSub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="gridw" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#E9D5F5" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <filter id="shw" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#4A044E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#bgw)"/>
  <rect width="960" height="540" rx="20" fill="url(#gridw)"/>

  <text x="24" y="28" font-size="16" font-weight="700" fill="#0f172a">一次 Agent 运行的 Trace 瀑布：每个 span 都要记录四件事</text>

  <!-- 四件事 chips -->
  <g font-size="11.5" font-weight="700">
    <rect x="24" y="42" width="70" height="24" rx="12" fill="#FDF4FF" stroke="#C026D3"/><text x="59" y="58" text-anchor="middle" fill="#A21CAF">① 延迟</text>
    <rect x="102" y="42" width="80" height="24" rx="12" fill="#FDF4FF" stroke="#C026D3"/><text x="142" y="58" text-anchor="middle" fill="#A21CAF">② token 量</text>
    <rect x="190" y="42" width="68" height="24" rx="12" fill="#FDF4FF" stroke="#C026D3"/><text x="224" y="58" text-anchor="middle" fill="#A21CAF">③ 成本</text>
    <rect x="266" y="42" width="68" height="24" rx="12" fill="#FDF4FF" stroke="#C026D3"/><text x="300" y="58" text-anchor="middle" fill="#A21CAF">④ 重试</text>
  </g>

  <!-- 图例 -->
  <g font-size="11.5" fill="#475569">
    <rect x="640" y="46" width="26" height="12" rx="3" fill="url(#gLLM)"/><text x="672" y="57">LLM 调用</text>
    <rect x="748" y="46" width="26" height="12" rx="3" fill="url(#gTool)"/><text x="780" y="57">工具</text>
    <rect x="826" y="46" width="26" height="12" rx="3" fill="url(#gSub)"/><text x="858" y="57">子 Agent</text>
  </g>

  <!-- 标签区底色 -->
  <rect x="24" y="98" width="316" height="374" rx="8" fill="#FDF4FF" opacity="0.5" stroke="#F0D9F7"/>
  <!-- 图表区 -->
  <rect x="348" y="98" width="576" height="374" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#E2E8F0"/>
  <!-- 时间网格 0-9s，X(t)=348+64t -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="348" y1="98" x2="348" y2="472"/><line x1="412" y1="98" x2="412" y2="472"/>
    <line x1="476" y1="98" x2="476" y2="472"/><line x1="540" y1="98" x2="540" y2="472"/>
    <line x1="604" y1="98" x2="604" y2="472"/><line x1="668" y1="98" x2="668" y2="472"/>
    <line x1="732" y1="98" x2="732" y2="472"/><line x1="796" y1="98" x2="796" y2="472"/>
    <line x1="860" y1="98" x2="860" y2="472"/><line x1="924" y1="98" x2="924" y2="472"/>
  </g>
  <g font-size="10.5" fill="#94A3B8" text-anchor="middle">
    <text x="348" y="92">0s</text><text x="412" y="92">1s</text><text x="476" y="92">2s</text>
    <text x="540" y="92">3s</text><text x="604" y="92">4s</text><text x="668" y="92">5s</text>
    <text x="732" y="92">6s</text><text x="796" y="92">7s</text><text x="860" y="92">8s</text>
  </g>

  <!-- 扫描线：回放本次运行 -->
  <line y1="100" y2="470" stroke="#C026D3" stroke-width="1.6" opacity="0.45">
    <animate attributeName="x1" values="348;924;924" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="348;924;924" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- ===== 行 1 agent.run 0→8.2s ===== -->
  <text x="40" y="122" font-size="12.5" font-weight="700" fill="#0f172a">agent.run</text>
  <rect x="348" y="110" width="524.8" height="16" rx="4" fill="url(#gRun)" filter="url(#shw)">
  </rect>
  <text x="866" y="122" text-anchor="end" font-size="10.5" font-weight="700" fill="#FFFFFF">端到端 8.2 s
  </text>

  <!-- ===== 行 2 llm.call #1 0→1.1 ===== -->
  <text x="58" y="152" font-size="11.5" fill="#334155">├─ llm.call #1</text>
  <rect x="348" y="140" width="70.4" height="16" rx="4" fill="url(#gLLM)">
  </rect>
  <text x="424" y="152" font-size="10.5" fill="#A21CAF">1.1 s · in 12k / out 320 tok · $0.04
  </text>

  <!-- ===== 行 3 tool.search 1.1→2.3 ===== -->
  <text x="58" y="182" font-size="11.5" fill="#334155">├─ tool.search</text>
  <rect x="418.4" y="170" width="76.8" height="16" rx="4" fill="url(#gTool)">
  </rect>
  <text x="501" y="182" font-size="10.5" fill="#0E7490">1.2 s
  </text>

  <!-- ===== 行 4 llm.call #2 2.3→3.2 ===== -->
  <text x="58" y="212" font-size="11.5" fill="#334155">├─ llm.call #2</text>
  <rect x="495.2" y="200" width="57.6" height="16" rx="4" fill="url(#gLLM)">
  </rect>
  <text x="559" y="212" font-size="10.5" fill="#A21CAF">0.9 s
  </text>

  <!-- ===== 行 5 subagent.research 3.2→6.6 ===== -->
  <text x="58" y="242" font-size="11.5" font-weight="700" fill="#5B21B6">├─ subagent.research</text>
  <rect x="552.8" y="230" width="217.6" height="16" rx="4" fill="url(#gSub)">
  </rect>
  <text x="777" y="242" font-size="10.5" font-weight="700" fill="#5B21B6">3.4 s
  </text>

  <!-- ===== 行 6 llm.call #3 3.2→3.7 ===== -->
  <text x="76" y="272" font-size="11" fill="#475569">│　├─ llm.call #3</text>
  <rect x="552.8" y="260" width="32" height="16" rx="4" fill="url(#gLLM)">
  </rect>
  <text x="591" y="272" font-size="10.5" fill="#A21CAF">0.5 s · 拆子任务
  </text>

  <!-- ===== 行 7 tool.crawler 3.7→5.9 ===== -->
  <text x="76" y="302" font-size="11" fill="#475569">│　├─ tool.crawler</text>
  <rect x="584.8" y="290" width="140.8" height="16" rx="4" fill="url(#gTool)">
  </rect>
  <text x="732" y="302" font-size="10.5" fill="#0E7490">2.2 s · 3 页
  </text>

  <!-- ===== 行 8 http.get #1 3.7→4.4 ===== -->
  <text x="94" y="332" font-size="10.5" fill="#64748B">│　│　├─ http.get #1</text>
  <rect x="584.8" y="320" width="44.8" height="16" rx="4" fill="url(#gTool)" opacity="0.85">
  </rect>
  <text x="636" y="332" font-size="10" fill="#0E7490">0.7 s
  </text>

  <!-- ===== 行 9 http.get #2 4.5→5.2（重试） ===== -->
  <text x="94" y="362" font-size="10.5" fill="#64748B">│　│　├─ http.get #2</text>
  <rect x="636" y="350" width="44.8" height="16" rx="4" fill="url(#gTool)" opacity="0.85" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="3 2">
  </rect>
  <text x="687" y="362" font-size="10" fill="#DC2626">0.7 s · 上次超时，重试 1
  </text>

  <!-- ===== 行 10 http.get #3 5.2→5.9 ===== -->
  <text x="94" y="392" font-size="10.5" fill="#64748B">│　│　└─ http.get #3</text>
  <rect x="681.2" y="380" width="44.8" height="16" rx="4" fill="url(#gTool)" opacity="0.85">
  </rect>
  <text x="733" y="392" font-size="10" fill="#0E7490">0.7 s
  </text>

  <!-- ===== 行 11 llm.call #4 5.9→6.6 ===== -->
  <text x="76" y="422" font-size="11" fill="#475569">│　└─ llm.call #4</text>
  <rect x="725.6" y="410" width="44.8" height="16" rx="4" fill="url(#gLLM)">
  </rect>
  <text x="777" y="422" font-size="10.5" fill="#A21CAF">0.7 s · 汇总结论
  </text>

  <!-- ===== 行 12 llm.call #5 6.6→7.6 ===== -->
  <text x="58" y="452" font-size="11.5" fill="#334155">└─ llm.call #5</text>
  <rect x="770.4" y="440" width="64" height="16" rx="4" fill="url(#gLLM)">
  </rect>
  <text x="841" y="452" font-size="10.5" fill="#A21CAF">1.0 s · 综合作答
  </text>

  <!-- 底部注 -->
  <text x="24" y="498" font-size="11.5" fill="#475569">校验规则：子 span 时长之和 ≤ 父 span（差值是排队与序列化开销）。本例：1.1+1.2+0.9+3.4+1.0 = 7.6 ≤ 8.2；子 Agent 内 0.5+2.2+0.7 = 3.4。</text>
  <text x="24" y="520" font-size="11.5" fill="#A21CAF">本次运行合计：LLM in ≈ 40k / out ≈ 1.3k token · 成本 ≈ $0.19 · 重试 1 次——没有瀑布图，8.2 秒就是一笔糊涂账。</text>
</svg>
