<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 776" width="960" height="776" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" role="img" aria-label="Plan-and-Execute 与 ReAct 两种执行形态对比：上泳道一次产出五步计划并含重规划回跳，下泳道思考行动观察交替小步链，底部权衡条">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/><stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <linearGradient id="gPlanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrAmber" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#b45309"/>
    </marker>
    <marker id="arrSlate" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#a8a29e" stroke-width="0.7" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="960" height="776" rx="20" fill="url(#bg)"/>
  <rect width="960" height="776" rx="20" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="959" height="775" rx="20" fill="none" stroke="#d6d3d1"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">Plan-and-Execute 与 ReAct：两条执行泳道</text>
  <text x="40" y="76" font-size="16" fill="#475569">同一任务、两种走法：先谋后动 vs 边想边做</text>
  <rect x="520" y="26" width="412" height="34" rx="17" fill="#fef3c7" stroke="#ca8a04"/>
  <text x="726" y="49" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">示例任务：调研三家竞品，输出一份对比报告</text>

  <!-- ============ 上泳道：Plan-and-Execute ============ -->
  <g>
    <rect x="24" y="92" width="912" height="216" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="40" y="120" font-size="17" font-weight="700" fill="#78350f">Plan-and-Execute：先谋后动</text>

    <rect x="40" y="140" width="160" height="84" rx="10" fill="url(#gPlanner)" filter="url(#sh)"/>
    <text x="120" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">规划器</text>
    <text x="120" y="208" text-anchor="middle" font-size="15" fill="#fef3c7">一次调用出计划</text>

    <rect x="224" y="136" width="528" height="98" rx="10" fill="none" stroke="#ca8a04" stroke-dasharray="5 4"/>
    <text x="272" y="120" font-size="15" fill="#a16207">一次性产出的 5 步计划（快照）</text>

    <path d="M204 182 L 218 182" stroke="#b45309" stroke-width="2.2" fill="none" marker-end="url(#arrAmber)"/>
    <g filter="url(#sh)">
      <rect x="234" y="150" width="90" height="70" rx="9" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="338" y="150" width="90" height="70" rx="9" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="442" y="150" width="90" height="70" rx="9" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="546" y="150" width="90" height="70" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
      <rect x="650" y="150" width="90" height="70" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
    </g>
    <g stroke="#b45309" stroke-width="2" fill="none">
      <path d="M326 185 L 334 185" marker-end="url(#arrAmber)"/>
      <path d="M430 185 L 438 185" marker-end="url(#arrAmber)"/>
      <path d="M534 185 L 542 185" marker-end="url(#arrAmber)"/>
      <path d="M638 185 L 646 185" marker-end="url(#arrAmber)"/>
    </g>
    <g text-anchor="middle">
      <text x="279" y="182" font-size="15" font-weight="700" fill="#14532d">1 搜竞品 A</text>
      <text x="279" y="208" font-size="15" fill="#15803d">已完成</text>
      <text x="383" y="182" font-size="15" font-weight="700" fill="#14532d">2 搜竞品 B</text>
      <text x="383" y="208" font-size="15" fill="#15803d">已完成</text>
      <text x="487" y="182" font-size="15" font-weight="700" fill="#14532d">3 搜竞品 C</text>
      <text x="487" y="208" font-size="15" fill="#15803d">已完成</text>
      <text x="591" y="182" font-size="15" font-weight="700" fill="#7f1d1d">4 拉财报</text>
      <text x="591" y="208" font-size="15" fill="#b91c1c">接口已变更</text>
      <text x="695" y="182" font-size="15" font-weight="700" fill="#475569">5 出报告</text>
      <text x="695" y="208" font-size="15" fill="#64748b">待执行</text>
    </g>
    <path d="M618 156 L 630 168 M630 156 L 618 168" stroke="#dc2626" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <path d="M591 224 C 520 268, 200 270, 124 230" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrAmber)">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <text x="360" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">第 4 步失败 → 带观察回到规划器，重排剩余步骤（重规划）</text>

    <rect x="764" y="136" width="148" height="130" rx="10" fill="#ffffff" stroke="#fcd34d"/>
    <g font-size="15" fill="#854d0e">
      <text x="778" y="162" font-weight="700">执行器按图施工</text>
      <text x="778" y="186">可用规则或小模型；</text>
      <text x="778" y="210">只在规划与重规划</text>
      <text x="778" y="234">时才调用大模型，</text>
      <text x="778" y="258">所以更省 token</text>
    </g>
  </g>

  <!-- ============ 下泳道：ReAct ============ -->
  <g>
    <rect x="24" y="320" width="912" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="348" font-size="17" font-weight="700" fill="#334155">ReAct：边想边做，Thought / Action / Observation 交替推进</text>

    <g filter="url(#sh)">
      <rect x="40" y="362" width="204" height="80" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
      <rect x="264" y="362" width="204" height="80" rx="9" fill="#fef3c7" stroke="#ca8a04"/>
      <rect x="488" y="362" width="204" height="80" rx="9" fill="#e0f2fe" stroke="#0284c7"/>
      <rect x="712" y="362" width="204" height="80" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
      <rect x="40" y="506" width="204" height="80" rx="9" fill="#fef3c7" stroke="#ca8a04"/>
      <rect x="264" y="506" width="204" height="80" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
      <rect x="488" y="506" width="204" height="80" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
      <rect x="712" y="506" width="204" height="80" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
    </g>
    <g stroke="#64748b" stroke-width="2" fill="none">
      <path d="M246 402 L 258 402" marker-end="url(#arrSlate)"/>
      <path d="M470 402 L 482 402" marker-end="url(#arrSlate)"/>
      <path d="M694 402 L 706 402" marker-end="url(#arrSlate)"/>
      <path d="M246 546 L 258 546" marker-end="url(#arrSlate)"/>
      <path d="M470 546 L 482 546" marker-end="url(#arrSlate)"/>
      <path d="M694 546 L 706 546" marker-end="url(#arrSlate)"/>
    </g>
    <path d="M814 448 C 700 494, 280 458, 146 500" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrSlate)">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="3s" repeatCount="indefinite"/>
    </path>
    <text x="470" y="488" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309" stroke="#f8fafc" stroke-width="4" paint-order="stroke">环境突变 → 下一拍就地换策略，不必推倒重来</text>

    <g text-anchor="middle">
      <text x="142" y="392" font-size="15" font-weight="700" fill="#5b21b6">Thought 思考</text>
      <text x="142" y="418" font-size="15" fill="#6d28d9">先查竞品 A 定价</text>
      <text x="366" y="392" font-size="15" font-weight="700" fill="#854d0e">Action 行动</text>
      <text x="366" y="418" font-size="15" fill="#a16207">search(竞品 A)</text>
      <text x="590" y="392" font-size="15" font-weight="700" fill="#075985">Observation 观察</text>
      <text x="590" y="418" font-size="15" fill="#0369a1">拿到定价与评测</text>
      <text x="814" y="392" font-size="15" font-weight="700" fill="#5b21b6">Thought 思考</text>
      <text x="814" y="418" font-size="15" fill="#6d28d9">接着查竞品 B</text>
      <text x="142" y="536" font-size="15" font-weight="700" fill="#854d0e">Action 行动</text>
      <text x="142" y="562" font-size="15" fill="#a16207">browser 打开 B</text>
      <text x="366" y="536" font-size="15" font-weight="700" fill="#7f1d1d">Observation 观察</text>
      <text x="366" y="562" font-size="15" fill="#b91c1c">页面改版，需登录</text>
      <text x="590" y="536" font-size="15" font-weight="700" fill="#5b21b6">Thought 思考</text>
      <text x="590" y="562" font-size="15" fill="#6d28d9">改用新闻稿检索</text>
      <text x="814" y="536" font-size="15" font-weight="700" fill="#475569">继续 T-A-O</text>
      <text x="814" y="562" font-size="15" fill="#64748b">直到出报告</text>
    </g>
    <rect x="264" y="506" width="204" height="80" rx="9" fill="#ef4444" opacity="0">
      <animate attributeName="opacity" values="0;0.18;0" keyTimes="0;0.45;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ============ 底部权衡条 ============ -->
  <g>
    <rect x="24" y="616" width="444" height="132" rx="12" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.6" filter="url(#sh)"/>
    <text x="40" y="644" font-size="17" font-weight="700" fill="#78350f">Plan-and-Execute 的账</text>
    <path d="M42 666 L47 672 L56 661" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round"/>
    <text x="66" y="673" font-size="15" fill="#475569">长任务稳：目标先想清楚，不易跑偏</text>
    <path d="M42 692 L47 698 L56 687" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round"/>
    <text x="66" y="699" font-size="15" fill="#475569">省 token：执行期不必每步请大模型</text>
    <path d="M42 716 L54 728 M54 716 L42 728" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
    <text x="66" y="727" font-size="15" fill="#475569">代价：环境一变计划易失效，重规划贵</text>

    <rect x="492" y="616" width="444" height="132" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="508" y="644" font-size="17" font-weight="700" fill="#1e293b">ReAct 的账</text>
    <path d="M510 666 L515 672 L524 661" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round"/>
    <text x="534" y="673" font-size="15" fill="#475569">适应强：每一步都基于最新观察纠错</text>
    <path d="M510 692 L522 704 M522 692 L510 704" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
    <text x="534" y="703" font-size="15" fill="#475569">风险：轨迹易漂移，走着走着忘了目标</text>
    <path d="M510 716 L522 728 M522 716 L510 728" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
    <text x="534" y="727" font-size="15" fill="#475569">代价：每步都调用模型，更贵、更慢</text>
  </g>
</svg>
