<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="Plan-and-Execute 与 ReAct 两种执行形态对比：上泳道一次产出五步计划并含重规划回跳，下泳道思考行动观察交替小步链，底部权衡条">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/><stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <linearGradient id="gPlanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrAmber" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#b45309"/>
    </marker>
    <marker id="arrSlate" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#a8a29e" stroke-width="0.7" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#bg)"/>
  <rect width="960" height="540" rx="20" fill="url(#grid)"/>

  <text x="40" y="32" font-size="17" font-weight="700" fill="#0f172a">Plan-and-Execute 与 ReAct：两条执行泳道</text>
  <text x="40" y="52" font-size="12" fill="#475569">同一任务、两种走法：先谋后动 vs 边想边做</text>
  <rect x="556" y="42" width="380" height="26" rx="13" fill="#fef3c7" stroke="#ca8a04"/>
  <text x="746" y="59" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">示例任务：调研三家竞品，输出一份对比报告</text>

  <!-- ============ 上泳道：Plan-and-Execute ============ -->
  <g>
    <rect x="24" y="80" width="912" height="176" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="40" y="104" font-size="14" font-weight="700" fill="#78350f">Plan-and-Execute：先谋后动</text>

    <rect x="40" y="126" width="128" height="72" rx="10" fill="url(#gPlanner)" filter="url(#sh)"/>
    <text x="104" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">规划器</text>
    <text x="104" y="176" text-anchor="middle" font-size="10.5" fill="#fef3c7">一次 LLM 调用出计划</text>

    <rect x="204" y="124" width="534" height="88" rx="10" fill="none" stroke="#ca8a04" stroke-dasharray="5 4"/>
    <text x="210" y="118" font-size="10.5" fill="#a16207">一次性产出的 5 步计划（快照）</text>

    <path d="M168 162 L 200 167" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrAmber)"/>
    <g filter="url(#sh)">
      <rect x="216" y="140" width="88" height="58" rx="9" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="322" y="140" width="88" height="58" rx="9" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="428" y="140" width="88" height="58" rx="9" fill="#dcfce7" stroke="#16a34a"/>
      <rect x="534" y="140" width="88" height="58" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
      <rect x="640" y="140" width="88" height="58" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
    </g>
    <g stroke="#b45309" stroke-width="1.8" fill="none">
      <path d="M304 169 L 318 169" marker-end="url(#arrAmber)"/>
      <path d="M410 169 L 424 169" marker-end="url(#arrAmber)"/>
      <path d="M516 169 L 530 169" marker-end="url(#arrAmber)"/>
      <path d="M622 169 L 636 169" marker-end="url(#arrAmber)"/>
    </g>
    <g text-anchor="middle">
      <text x="260" y="164" font-size="11.5" font-weight="700" fill="#14532d">1 搜竞品 A</text>
      <text x="260" y="184" font-size="10" fill="#15803d">已完成</text>
      <text x="366" y="164" font-size="11.5" font-weight="700" fill="#14532d">2 搜竞品 B</text>
      <text x="366" y="184" font-size="10" fill="#15803d">已完成</text>
      <text x="472" y="164" font-size="11.5" font-weight="700" fill="#14532d">3 搜竞品 C</text>
      <text x="472" y="184" font-size="10" fill="#15803d">已完成</text>
      <text x="578" y="164" font-size="11.5" font-weight="700" fill="#7f1d1d">4 拉财报数据</text>
      <text x="578" y="184" font-size="10" fill="#b91c1c">接口已变更</text>
      <text x="684" y="164" font-size="11.5" font-weight="700" fill="#475569">5 生成报告</text>
      <text x="684" y="184" font-size="10" fill="#64748b">待执行</text>
    </g>
    <path d="M610 145 L 618 153 M618 145 L 610 153" stroke="#dc2626" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <path d="M578 198 C 520 244, 170 244, 104 204" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrAmber)">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <text x="342" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">第 4 步失败 → 带观察回到规划器，重排剩余步骤（重规划）</text>

    <rect x="756" y="126" width="164" height="88" rx="10" fill="#ffffff" stroke="#fcd34d"/>
    <g font-size="10.5" fill="#854d0e">
      <text x="770" y="148">执行器按图施工：</text>
      <text x="770" y="166">可用规则或小模型；</text>
      <text x="770" y="184">仅规划与重规划时</text>
      <text x="770" y="202">调用大模型，省 token</text>
    </g>
  </g>

  <!-- ============ 下泳道：ReAct ============ -->
  <g>
    <rect x="24" y="272" width="912" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="296" font-size="14" font-weight="700" fill="#334155">ReAct：边想边做，Thought / Action / Observation 交替推进</text>

    <g filter="url(#sh)">
      <rect x="40" y="310" width="100" height="60" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
      <rect x="152" y="310" width="100" height="60" rx="9" fill="#fef3c7" stroke="#ca8a04"/>
      <rect x="264" y="310" width="100" height="60" rx="9" fill="#e0f2fe" stroke="#0284c7"/>
      <rect x="376" y="310" width="100" height="60" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
      <rect x="488" y="310" width="100" height="60" rx="9" fill="#fef3c7" stroke="#ca8a04"/>
      <rect x="600" y="310" width="100" height="60" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
      <rect x="712" y="310" width="100" height="60" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    </g>
    <g stroke="#64748b" stroke-width="1.8" fill="none">
      <path d="M140 340 L 148 340" marker-end="url(#arrSlate)"/>
      <path d="M252 340 L 260 340" marker-end="url(#arrSlate)"/>
      <path d="M364 340 L 372 340" marker-end="url(#arrSlate)"/>
      <path d="M476 340 L 484 340" marker-end="url(#arrSlate)"/>
      <path d="M588 340 L 596 340" marker-end="url(#arrSlate)"/>
      <path d="M700 340 L 708 340" marker-end="url(#arrSlate)"/>
    </g>
    <g text-anchor="middle">
      <text x="90" y="331" font-size="10.5" font-weight="700" fill="#5b21b6">Thought 思考</text>
      <text x="90" y="351" font-size="9.5" fill="#6d28d9">先查竞品 A 定价</text>
      <text x="202" y="331" font-size="10.5" font-weight="700" fill="#854d0e">Action 行动</text>
      <text x="202" y="351" font-size="9.5" fill="#a16207">search(竞品 A)</text>
      <text x="314" y="331" font-size="10.5" font-weight="700" fill="#075985">Observation 观察</text>
      <text x="314" y="351" font-size="9.5" fill="#0369a1">拿到定价与评测</text>
      <text x="426" y="331" font-size="10.5" font-weight="700" fill="#5b21b6">Thought 思考</text>
      <text x="426" y="351" font-size="9.5" fill="#6d28d9">接着查竞品 B</text>
      <text x="538" y="331" font-size="10.5" font-weight="700" fill="#854d0e">Action 行动</text>
      <text x="538" y="351" font-size="9.5" fill="#a16207">browser 打开 B</text>
      <text x="650" y="331" font-size="10.5" font-weight="700" fill="#7f1d1d">Observation 观察</text>
      <text x="650" y="351" font-size="9.5" fill="#b91c1c">页面改版，需登录</text>
      <text x="762" y="331" font-size="10.5" font-weight="700" fill="#5b21b6">Thought 思考</text>
      <text x="762" y="351" font-size="9.5" fill="#6d28d9">改用新闻稿检索</text>
    </g>
    <rect x="824" y="310" width="88" height="60" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="868" y="334" text-anchor="middle" font-size="10.5" fill="#475569">继续 T-A-O</text>
    <text x="868" y="352" text-anchor="middle" font-size="10.5" fill="#475569">直到出报告</text>

    <text x="652" y="392" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">环境突变 → 下一拍就地换策略，不必推倒重来</text>

    <rect x="40" y="310" width="100" height="60" rx="9" fill="#ca8a04" opacity="0.2">
      <animate attributeName="x" values="40;152;264;376;488;600;712" calcMode="discrete" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.2;0" keyTimes="0;0.9;1" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ============ 底部权衡条 ============ -->
  <g>
    <rect x="24" y="424" width="444" height="92" rx="12" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.6" filter="url(#sh)"/>
    <text x="40" y="448" font-size="13" font-weight="700" fill="#78350f">Plan-and-Execute 的账</text>
    <path d="M42 464 L46 469 L54 460" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round"/>
    <text x="62" y="470" font-size="11.5" fill="#475569">长任务稳：目标先想清楚，不易跑偏</text>
    <path d="M42 484 L46 489 L54 480" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round"/>
    <text x="62" y="490" font-size="11.5" fill="#475569">省 token：执行期不必每步请大模型</text>
    <path d="M42 502 L54 514 M54 502 L42 514" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
    <text x="62" y="512" font-size="11.5" fill="#475569">代价：环境一变计划易失效，重规划贵</text>

    <rect x="492" y="424" width="444" height="92" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
    <text x="508" y="448" font-size="13" font-weight="700" fill="#1e293b">ReAct 的账</text>
    <path d="M510 464 L514 469 L522 460" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round"/>
    <text x="530" y="470" font-size="11.5" fill="#475569">适应强：每一步都基于最新观察纠错</text>
    <path d="M510 502 L522 514 M522 502 L510 514" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
    <text x="530" y="512" font-size="11.5" fill="#475569">代价：每步都调用模型，更贵、更慢</text>
    <path d="M510 484 L522 496 M522 484 L510 496" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
    <text x="530" y="494" font-size="11.5" fill="#475569">风险：轨迹易漂移，走着走着忘了目标</text>
  </g>
</svg>
