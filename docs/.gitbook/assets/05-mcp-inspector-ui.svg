<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 724" width="768" height="724" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="MCP 调试台窗口示意：标题栏三圆点与 stdio 标签，下方是工具、资源、提示词三个标签页；左栏是带搜索框的 Server 列表（含连接状态圆点与图例）和添加按钮，右栏当前选中 read_file，展示三种原语标签下的工具选择行、函数说明、运行测试按钮，以及逐行展开的 JSON Schema 卡片；底部绿色 connected 状态条显示协议版本、能力、握手与心跳延迟">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <pattern id="gridm" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d9488" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="gBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="shms" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="768" height="724" rx="18" fill="url(#bgm)"/>
  <rect width="768" height="724" rx="18" fill="url(#gridm)"/>
  <rect x="0.5" y="0.5" width="767" height="723" rx="18" fill="none" stroke="#cbd5e1"/>

  <!-- ===== 页头 ===== -->
  <text x="24" y="36" font-size="19" font-weight="700" fill="#0f172a">MCP 调试台：接入 Agent 之前，先把 Server 看一遍</text>
  <text x="24" y="58" font-size="13" fill="#475569">左选 Server、中切三种原语、右查 JSON Schema 并试运行；底部状态条确认握手与心跳</text>
  <g filter="url(#shms)">
    <rect x="636" y="20" width="108" height="26" rx="13" fill="#ccfbf1" stroke="#5eead4"/>
  </g>
  <text x="690" y="37" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">第 5 章 · 工具协议</text>

  <!-- ===== 窗口外壳 ===== -->
  <g filter="url(#shm)">
    <rect x="24" y="76" width="720" height="578" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <path d="M24 88 A12 12 0 0 1 36 76 H732 A12 12 0 0 1 744 88 V106 H24 Z" fill="#eef2f7"/>
  <line x1="24" y1="106" x2="744" y2="106" stroke="#e2e8f0"/>
  <circle cx="40" cy="91" r="5.5" fill="#f87171"/>
  <circle cx="56" cy="91" r="5.5" fill="#fbbf24"/>
  <circle cx="72" cy="91" r="5.5" fill="#34d399"/>
  <text x="90" y="96" font-size="14" font-weight="700" fill="#334155">MCP 调试台 — Server Inspector</text>
  <rect x="672" y="80" width="56" height="22" rx="11" fill="#e2e8f0"/>
  <text x="700" y="95" text-anchor="middle" font-size="12.5" fill="#475569">stdio</text>

  <!-- ===== 标签页 ===== -->
  <text x="40" y="128" font-size="13.5" font-weight="700" fill="#0f766e">工具 Tools</text>
  <rect x="40" y="134" width="78" height="3.5" rx="2" fill="#0d9488"/>
  <text x="146" y="128" font-size="13.5" fill="#64748b">资源 Resources</text>
  <text x="283" y="128" font-size="13.5" fill="#64748b">提示词 Prompts</text>
  <line x1="40" y1="140" x2="728" y2="140" stroke="#e2e8f0"/>

  <!-- ===== 左栏：Server 列表 ===== -->
  <rect x="40" y="156" width="204" height="434" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="178" font-size="13" font-weight="700" fill="#0f172a">已连接 Servers</text>
  <text x="232" y="178" text-anchor="end" font-size="12.5" fill="#94a3b8">共 4 个</text>
  <rect x="52" y="188" width="180" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
  <g fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round">
    <circle cx="66" cy="199" r="4.5"/>
    <path d="M69.5 202.5 L74 207"/>
  </g>
  <text x="80" y="204" font-size="12.5" fill="#94a3b8">搜索 server</text>

  <!-- 选中项 -->
  <rect x="48" y="226" width="188" height="52" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <circle cx="62" cy="245" r="4" fill="#059669"/>
  <text x="74" y="246" font-size="12.5" font-weight="700" fill="#0f766e">filesystem 本地</text>
  <text x="74" y="266" font-size="12" fill="#0d9488">3 工具 · 2 资源 · stdio</text>
  <!-- 其余项 -->
  <circle cx="62" cy="309" r="4" fill="#059669"/>
  <text x="74" y="314" font-size="12.5" fill="#334155">数据库查询</text>
  <text x="74" y="332" font-size="12" fill="#94a3b8">5 工具 · 只读模式</text>
  <circle cx="62" cy="369" r="4" fill="#f59e0b"/>
  <text x="74" y="374" font-size="12.5" fill="#334155">网页抓取</text>
  <text x="74" y="392" font-size="12" fill="#94a3b8">1 工具 · 响应偏慢</text>
  <circle cx="62" cy="429" r="4" fill="#ef4444"/>
  <text x="74" y="434" font-size="12.5" fill="#334155">地图检索</text>
  <text x="74" y="452" font-size="12" fill="#b91c1c">连接失败 · 已断开</text>
  <!-- 添加按钮 -->
  <rect x="48" y="478" width="188" height="36" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="142" y="501" text-anchor="middle" font-size="12.5" fill="#475569">+ 添加 Server</text>
  <!-- 状态图例 -->
  <line x1="52" y1="536" x2="232" y2="536" stroke="#e2e8f0"/>
  <circle cx="62" cy="556" r="4" fill="#059669"/>
  <text x="74" y="560" font-size="12" fill="#64748b">正常</text>
  <circle cx="126" cy="556" r="4" fill="#f59e0b"/>
  <text x="138" y="560" font-size="12" fill="#64748b">响应慢</text>
  <circle cx="204" cy="556" r="4" fill="#ef4444"/>
  <text x="216" y="560" font-size="12" fill="#64748b">断开</text>

  <!-- ===== 右栏：工具选择行 ===== -->
  <rect x="256" y="156" width="104" height="30" rx="15" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="308" y="175" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">read_file</text>
  <rect x="368" y="156" width="118" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="427" y="175" text-anchor="middle" font-size="12.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">search_files</text>
  <rect x="494" y="156" width="104" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="546" y="175" text-anchor="middle" font-size="12.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">write_file</text>
  <rect x="606" y="160" width="64" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="638" y="175" text-anchor="middle" font-size="12" fill="#92400e">需确认</text>

  <!-- 详情头 -->
  <text x="256" y="214" font-size="15" font-weight="700" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">read_file</text>
  <text x="348" y="214" font-size="12.5" fill="#475569">读取指定路径的文本文件，返回带行号的纯文本</text>
  <g filter="url(#shms)">
    <rect x="640" y="196" width="88" height="28" rx="10" fill="url(#gBtn)"/>
  </g>
  <text x="684" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">运行测试</text>

  <!-- JSON Schema 卡片 -->
  <rect x="256" y="238" width="472" height="352" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="270" y="260" font-size="12" fill="#64748b">tools/list 返回 · inputSchema 决定模型怎么填参数</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="12.5">
    <text x="270" y="282" fill="#64748b">{</text>
    <text x="285" y="299"><tspan fill="#0f766e">"name"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"read_file",</tspan></text>
    <text x="285" y="316"><tspan fill="#0f766e">"description"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"读取文本文件（只读工具）",</tspan></text>
    <text x="285" y="333"><tspan fill="#0f766e">"inputSchema"</tspan><tspan fill="#64748b">: {</tspan></text>
    <text x="300" y="350"><tspan fill="#0f766e">"type"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"object",</tspan></text>
    <text x="300" y="367"><tspan fill="#0f766e">"properties"</tspan><tspan fill="#64748b">: {</tspan></text>
    <text x="315" y="384"><tspan fill="#0f766e">"path"</tspan><tspan fill="#64748b">: {</tspan></text>
    <text x="330" y="401"><tspan fill="#0f766e">"type"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"string",</tspan></text>
    <text x="330" y="418"><tspan fill="#0f766e">"description"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"绝对路径"</tspan></text>
    <text x="315" y="435" fill="#64748b">},</text>
    <text x="315" y="452"><tspan fill="#0f766e">"max_lines"</tspan><tspan fill="#64748b">: {</tspan></text>
    <text x="330" y="469"><tspan fill="#0f766e">"type"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"integer",</tspan></text>
    <text x="330" y="486"><tspan fill="#0f766e">"default"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#7c3aed">200</tspan></text>
    <text x="315" y="503" fill="#64748b">}</text>
    <text x="300" y="520" fill="#64748b">},</text>
    <text x="300" y="537"><tspan fill="#0f766e">"required"</tspan><tspan fill="#64748b">: [ </tspan><tspan fill="#b45309">"path"</tspan><tspan fill="#64748b"> ]</tspan></text>
    <text x="285" y="554" fill="#64748b">}</text>
    <text x="270" y="571" fill="#64748b">}</text>
  </g>

  <!-- ===== 底部状态条（两行：握手/心跳 与 能力/最近调用） ===== -->
  <line x1="24" y1="598" x2="744" y2="598" stroke="#6ee7b7"/>
  <path d="M24 598 H744 V640 A12 12 0 0 1 732 652 H36 A12 12 0 0 1 24 640 Z" fill="#ecfdf5"/>
  <circle cx="46" cy="614" r="8" fill="none" stroke="#10b981" stroke-width="1.4" opacity="0.45"/>
  <circle cx="46" cy="614" r="4.5" fill="#10b981"/>
  <text x="62" y="618" font-size="12.5" font-weight="700" fill="#047857">connected — 协议版本 2025-06-18</text>
  <text x="728" y="618" text-anchor="end" font-size="12.5" fill="#059669">握手 12 ms · 心跳正常</text>
  <text x="62" y="640" font-size="12.5" fill="#059669">能力：tools / resources / prompts</text>
  <text x="728" y="640" text-anchor="end" font-size="12.5" fill="#059669">最近调用 42 ms</text>

  <!-- ===== 底注 ===== -->
  <text x="24" y="680" font-size="13" fill="#64748b">调试纪律：先看 description 有没有写清参数约束，再手改一轮入参试调用，</text>
  <text x="24" y="702" font-size="13" fill="#64748b">确认返回结构与错误码之后才接进 Agent。Schema 是模型唯一的填参依据。</text>
</svg>
