<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="MCP 调试台窗口示意：标题栏三圆点，左栏是带搜索框的 Server 列表与连接状态点，右栏是工具、资源、提示词三个标签页，当前展示 read_file 的 JSON Schema 与运行测试按钮，底部绿色 connected 状态条显示协议版本与心跳延迟">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <pattern id="gridm" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d9488" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="gBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="shms" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="960" height="560" rx="18" fill="url(#bgm)"/>
  <rect width="960" height="560" rx="18" fill="url(#gridm)"/>
  <rect x="0.5" y="0.5" width="959" height="559" rx="18" fill="none" stroke="#cbd5e1"/>

  <!-- ===== 页头 ===== -->
  <text x="32" y="36" font-size="18" font-weight="700" fill="#0f172a">MCP 调试台：接入 Agent 之前，先把 Server 看一遍</text>
  <text x="32" y="56" font-size="12.5" fill="#475569">左选 Server、中切三种原语、右查 JSON Schema 并试运行；底部状态条确认握手与心跳</text>
  <g filter="url(#shms)">
    <rect x="812" y="20" width="118" height="26" rx="13" fill="#ccfbf1" stroke="#5eead4"/>
  </g>
  <text x="871" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">第 5 章 · 工具协议</text>

  <!-- ===== 窗口外壳 ===== -->
  <g filter="url(#shm)">
    <rect x="32" y="68" width="896" height="460" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <path d="M32 80 A12 12 0 0 1 44 68 H916 A12 12 0 0 1 928 80 V104 H32 Z" fill="#eef2f7"/>
  <line x1="32" y1="104" x2="928" y2="104" stroke="#e2e8f0"/>
  <circle cx="54" cy="86" r="5.5" fill="#f87171"/>
  <circle cx="70" cy="86" r="5.5" fill="#fbbf24"/>
  <circle cx="86" cy="86" r="5.5" fill="#34d399"/>
  <text x="106" y="91" font-size="13" font-weight="700" fill="#334155">MCP 调试台 — Server Inspector</text>
  <rect x="848" y="76" width="64" height="20" rx="10" fill="#e2e8f0"/>
  <text x="880" y="90" text-anchor="middle" font-size="12" fill="#475569">stdio</text>

  <!-- ===== 左栏：Server 列表 ===== -->
  <rect x="48" y="118" width="212" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="62" y="140" font-size="13" font-weight="700" fill="#0f172a">已连接 Servers</text>
  <rect x="62" y="150" width="184" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
  <g fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round">
    <circle cx="76" cy="161" r="4.5"/>
    <path d="M79.5 164.5 L84 169"/>
  </g>
  <text x="92" y="167" font-size="12" fill="#94a3b8">搜索 server</text>

  <!-- 选中项 -->
  <rect x="56" y="188" width="196" height="40" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <circle cx="70" cy="204" r="4" fill="#059669"/>
  <text x="82" y="205" font-size="12.5" font-weight="700" fill="#0f766e">filesystem 本地</text>
  <text x="82" y="220" font-size="12" fill="#0d9488">3 工具 · 2 资源 · stdio</text>
  <!-- 其余项 -->
  <circle cx="70" cy="256" r="4" fill="#059669"/>
  <text x="82" y="253" font-size="12.5" fill="#334155">数据库查询</text>
  <text x="82" y="269" font-size="12" fill="#94a3b8">5 工具 · 只读模式</text>
  <circle cx="70" cy="304" r="4" fill="#f59e0b"/>
  <text x="82" y="301" font-size="12.5" fill="#334155">网页抓取</text>
  <text x="82" y="317" font-size="12" fill="#94a3b8">1 工具 · 响应偏慢</text>
  <circle cx="70" cy="352" r="4" fill="#ef4444"/>
  <text x="82" y="349" font-size="12.5" fill="#334155">地图检索</text>
  <text x="82" y="365" font-size="12" fill="#b91c1c">连接失败 · 已断开</text>
  <!-- 添加按钮 -->
  <rect x="56" y="392" width="196" height="36" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="154" y="415" text-anchor="middle" font-size="12.5" fill="#475569">+ 添加 Server</text>

  <!-- ===== 右栏：标签页 ===== -->
  <line x1="284" y1="148" x2="912" y2="148" stroke="#e2e8f0"/>
  <text x="296" y="140" font-size="13" font-weight="700" fill="#0f766e">工具 Tools</text>
  <rect x="292" y="145" width="90" height="3.5" rx="2" fill="#0d9488"/>
  <text x="404" y="140" font-size="13" fill="#64748b">资源 Resources</text>
  <text x="536" y="140" font-size="13" fill="#64748b">提示词 Prompts</text>

  <!-- 工具选择行 -->
  <rect x="284" y="162" width="120" height="30" rx="15" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="344" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">read_file</text>
  <rect x="414" y="162" width="136" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="482" y="181" text-anchor="middle" font-size="12.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">search_files</text>
  <rect x="560" y="162" width="120" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="620" y="181" text-anchor="middle" font-size="12.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">write_file</text>
  <rect x="692" y="166" width="60" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="722" y="181" text-anchor="middle" font-size="12" fill="#92400e">需确认</text>

  <!-- 详情头 -->
  <text x="284" y="220" font-size="15" font-weight="700" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace">read_file</text>
  <text x="384" y="220" font-size="12.5" fill="#475569">读取指定路径的文本文件，返回带行号的纯文本</text>
  <g filter="url(#shms)">
    <rect x="812" y="200" width="88" height="30" rx="10" fill="url(#gBtn)"/>
  </g>
  <text x="856" y="219" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">运行测试</text>

  <!-- JSON Schema 卡片 -->
  <rect x="284" y="238" width="616" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="300" y="260" font-size="12" fill="#64748b">tools/list 返回 · inputSchema 决定模型怎么填参数</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="12.5">
    <text x="304" y="282" fill="#64748b">{</text>
    <text x="319" y="299"><tspan fill="#0f766e">"name"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"read_file",</tspan></text>
    <text x="319" y="316"><tspan fill="#0f766e">"description"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"读取文本文件（只读工具）",</tspan></text>
    <text x="319" y="333"><tspan fill="#0f766e">"inputSchema"</tspan><tspan fill="#64748b">: {</tspan></text>
    <text x="334" y="350"><tspan fill="#0f766e">"type"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"object",</tspan></text>
    <text x="334" y="367"><tspan fill="#0f766e">"properties"</tspan><tspan fill="#64748b">: {</tspan></text>
    <text x="349" y="384"><tspan fill="#0f766e">"path"</tspan><tspan fill="#64748b">: { </tspan><tspan fill="#0f766e">"type"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"string", </tspan><tspan fill="#0f766e">"description"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"绝对路径"</tspan><tspan fill="#64748b"> },</tspan></text>
    <text x="349" y="401"><tspan fill="#0f766e">"max_lines"</tspan><tspan fill="#64748b">: { </tspan><tspan fill="#0f766e">"type"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#b45309">"integer", </tspan><tspan fill="#0f766e">"default"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#7c3aed">200</tspan><tspan fill="#64748b"> }</tspan></text>
    <text x="334" y="418" fill="#64748b">},</text>
    <text x="334" y="435"><tspan fill="#0f766e">"required"</tspan><tspan fill="#64748b">: [ </tspan><tspan fill="#b45309">"path"</tspan><tspan fill="#64748b"> ]</tspan></text>
    <text x="319" y="452" fill="#64748b">}</text>
    <text x="304" y="469" fill="#64748b">}</text>
  </g>

  <!-- ===== 底部状态条 ===== -->
  <line x1="32" y1="492" x2="928" y2="492" stroke="#6ee7b7"/>
  <path d="M32 492 H928 V516 A12 12 0 0 1 916 528 H44 A12 12 0 0 1 32 516 Z" fill="#ecfdf5"/>
  <circle cx="54" cy="510" r="8" fill="none" stroke="#10b981" stroke-width="1.4" opacity="0.45"/>
  <circle cx="54" cy="510" r="4.5" fill="#10b981"/>
  <text x="70" y="515" font-size="12.5" font-weight="700" fill="#047857">connected — 协议版本 2025-06-18 · 能力：tools / resources / prompts</text>
  <text x="908" y="515" text-anchor="end" font-size="12.5" fill="#059669">握手 12 ms · 心跳正常 · 最近调用 42 ms</text>

  <!-- ===== 底注 ===== -->
  <text x="32" y="550" font-size="12" fill="#64748b">调试纪律：先看 description 有没有写清参数约束，再手改一轮入参试调用，确认返回结构与错误码之后才接进 Agent。</text>
</svg>
