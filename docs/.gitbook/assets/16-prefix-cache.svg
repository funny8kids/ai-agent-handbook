<svg width="960" height="530" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" role="img" aria-label="前缀缓存命中与整段失效对比动画">
  <rect x="0" y="0" width="960" height="530" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="20" y="26" font-size="19" font-weight="700" fill="#0f172a">前缀缓存（prefix / prompt caching）：谁能复用，谁被白算</text>

  <!-- ============ case A: stable prefix ============ -->
  <text x="20" y="60" fill="#475569" font-weight="700">A. 稳定前缀 + 只追加尾部 → 命中</text>
  <g>
    <!-- cached blocks -->
    <rect x="20" y="78" width="176" height="96" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="34" y="104" fill="#14532d">system prompt</text>
    <text x="34" y="130" fill="#15803d">2.4k tok ·</text>
    <text x="34" y="152" fill="#15803d">KV 已缓存</text>

    <rect x="208" y="78" width="176" height="96" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="222" y="104" fill="#14532d">工具 schema ×12</text>
    <text x="222" y="130" fill="#15803d">1.1k tok ·</text>
    <text x="222" y="152" fill="#15803d">稳定排序</text>

    <rect x="396" y="78" width="176" height="96" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="410" y="104" fill="#14532d">历史消息（追加）</text>
    <text x="410" y="130" fill="#15803d">8.9k tok ·</text>
    <text x="410" y="152" fill="#15803d">未改写</text>

    <rect x="584" y="78" width="176" height="96" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="598" y="104" fill="#713f12">RAG 片段</text>
    <text x="598" y="130" fill="#a16207">排序不稳定</text>
    <text x="598" y="152" fill="#a16207">→ 半命中</text>

    <rect x="772" y="78" width="176" height="96" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="786" y="104" fill="#7c2d12">本轮新内容</text>
    <text x="786" y="130" fill="#9a3412">用户输入</text>
    <text x="786" y="152" fill="#9a3412">+ 工具返回</text>

    <!-- recompute wave on new blocks only -->
    <rect x="772" y="78" width="176" height="96" rx="6" fill="#fb923c" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- hit sweep over cached region -->
    <rect x="20" y="74" width="140" height="104" rx="6" fill="#3b82f6" opacity="0.16">
      <animate attributeName="x" values="20;618;20" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.28;0.28;0;0" keyTimes="0;0.1;0.5;0.6;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="20" y="204" fill="#475569">本轮需真正 prefill 的 token</text>
  <rect x="272" y="190" width="668" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="272" y="190" width="150" height="18" rx="9" fill="#16a34a">
    <animate attributeName="width" values="140;150;140" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="440" y="204" fill="#065f46">≈ 2.4k / 13.5k · 命中率高 → 便宜且首字快</text>

  <!-- ============ case B: polluted prefix ============ -->
  <text x="20" y="240" fill="#475569" font-weight="700">B. 前缀被污染（system 里加了时间戳 / 工具顺序变了 / 历史被改写）→ 整段失效</text>
  <g>
    <rect x="20" y="258" width="176" height="96" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="34" y="284" fill="#7f1d1d">system + 时间戳</text>
    <text x="34" y="310" fill="#b91c1c">第 1 个 token</text>
    <text x="34" y="332" fill="#b91c1c">之后全变</text>

    <rect x="208" y="258" width="176" height="96" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="222" y="284" fill="#7f1d1d">工具 schema ×12</text>
    <text x="222" y="310" fill="#b91c1c">顺序按连接先后拼</text>
    <text x="222" y="332" fill="#b91c1c">→ 抖动</text>

    <rect x="396" y="258" width="176" height="96" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="410" y="284" fill="#7f1d1d">历史被摘要重写</text>
    <text x="410" y="310" fill="#b91c1c">改写 = 失效</text>

    <rect x="584" y="258" width="176" height="96" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="598" y="284" fill="#7f1d1d">RAG 片段</text>
    <text x="598" y="310" fill="#b91c1c">连带失效</text>

    <rect x="772" y="258" width="176" height="96" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="786" y="284" fill="#7f1d1d">本轮新内容</text>
    <text x="786" y="310" fill="#b91c1c">一起重算</text>

    <!-- whole-row recompute wave -->
    <rect x="20" y="258" width="928" height="96" rx="6" fill="#ef4444" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0.05;0.4;0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="20" y="384" fill="#475569">本轮需真正 prefill 的 token</text>
  <rect x="272" y="370" width="668" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="272" y="370" width="668" height="18" rx="9" fill="#dc2626">
    <animate attributeName="width" values="660;668;660" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="470" y="384" fill="#ffffff">≈ 13.5k / 13.5k · 每轮全量重算</text>

  <!-- ============ takeaway ============ -->
  <rect x="20" y="406" width="920" height="100" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="34" y="430" fill="#1e3a8a" font-weight="700">结论</text>
  <text x="78" y="430" fill="#1e40af">缓存是「前缀逐 token 相同」的复用，不是「内容差不多」的复用。</text>
  <text x="34" y="456" fill="#1e40af">纪律：① 不变的东西放前面，且真的别动它；② 会变的（时间、ID、AB 标记）一律追加到尾部；</text>
  <text x="34" y="482" fill="#1e40af">③ 历史只追加、要瘦身就追加摘要；④ 把 cached_tokens 命中率做成看板指标，稳态目标 70% 以上。</text>
</svg>
