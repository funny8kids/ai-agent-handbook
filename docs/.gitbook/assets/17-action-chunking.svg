<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="动作分块与异步执行时间线动画">
  <rect x="0" y="0" width="980" height="400" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#0f172a">Action Chunking：5Hz 推理如何驱动 50Hz 控制</text>

  <!-- timeline axis -->
  <line x1="150" y1="330" x2="950" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <g fill="#64748b" font-size="11">
    <text x="150" y="348">0ms</text><text x="350" y="348">400ms</text><text x="550" y="348">800ms</text>
    <text x="750" y="348">1200ms</text><text x="900" y="348">1600ms</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="350" y1="60" x2="350" y2="330"/><line x1="550" y1="60" x2="550" y2="330"/>
    <line x1="750" y1="60" x2="750" y2="330"/><line x1="950" y1="60" x2="950" y2="330"/>
  </g>

  <!-- lane 1: inference -->
  <text x="20" y="82" fill="#0f172a" font-weight="700">慢系统推理</text>
  <text x="20" y="99" fill="#64748b" font-size="11">每 200ms 一次</text>
  <g>
    <rect x="150" y="66" width="70" height="34" rx="5" fill="#fbbf24"/>
    <rect x="350" y="66" width="70" height="34" rx="5" fill="#fbbf24" opacity="0.85"/>
    <rect x="550" y="66" width="70" height="34" rx="5" fill="#fbbf24" opacity="0.85"/>
    <rect x="750" y="66" width="70" height="34" rx="5" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- lane 2: chunks -->
  <text x="20" y="152" fill="#0f172a" font-weight="700">动作块 a₁…a₅₀</text>
  <text x="20" y="169" fill="#64748b" font-size="11">一次预测约 1 秒</text>
  <g>
    <rect x="220" y="136" width="380" height="34" rx="5" fill="#86efac"/>
    <rect x="420" y="136" width="380" height="34" rx="5" fill="#bbf7d0" opacity="0.9"/>
    <rect x="620" y="136" width="330" height="34" rx="5" fill="#dcfce7" opacity="0.95"/>
    <text x="236" y="158" fill="#14532d" font-size="12">chunk A（重叠段做时间集成 → 边界不跳变）</text>
    <text x="536" y="158" fill="#166534" font-size="12">chunk B</text>
    <text x="742" y="158" fill="#15803d" font-size="12">chunk C</text>
  </g>
  <!-- advancing execution head -->
  <rect x="220" y="130" width="4" height="46" fill="#0f172a">
    <animate attributeName="x" values="220;900" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- lane 3: execution at 50Hz -->
  <text x="20" y="222" fill="#0f172a" font-weight="700">执行 50Hz</text>
  <text x="20" y="239" fill="#64748b" font-size="11">每 20ms 一步</text>
  <g fill="#3b82f6">
    <rect x="220" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="252" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.1s" repeatCount="indefinite"/></rect>
    <rect x="284" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="316" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="348" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="380" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="412" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="444" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.7s" repeatCount="indefinite"/></rect>
    <rect x="476" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="508" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.9s" repeatCount="indefinite"/></rect>
    <rect x="540" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="1.0s" repeatCount="indefinite"/></rect>
    <rect x="572" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="1.1s" repeatCount="indefinite"/></rect>
    <rect x="604" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="636" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="1.3s" repeatCount="indefinite"/></rect>
    <rect x="668" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="1.4s" repeatCount="indefinite"/></rect>
    <rect x="700" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.05s" repeatCount="indefinite"/></rect>
    <rect x="732" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.15s" repeatCount="indefinite"/></rect>
    <rect x="764" y="206" width="8" height="30" rx="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.5s" begin="0.25s" repeatCount="indefinite"/></rect>
  </g>

  <!-- lane 4: reactive replan -->
  <text x="20" y="292" fill="#0f172a" font-weight="700">事件触发重算</text>
  <text x="20" y="309" fill="#64748b" font-size="11">力超限 / 物体被碰走</text>
  <g>
    <rect x="560" y="272" width="150" height="30" rx="6" fill="#fecaca" stroke="#dc2626"/>
    <text x="572" y="292" fill="#7f1d1d" font-size="12">丢弃剩余动作 → 立刻重推</text>
    <animate attributeName="opacity" values="0.15;1;0.15" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- compare note -->
  <rect x="20" y="356" width="940" height="34" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="34" y="378" fill="#7c2d12">权衡：chunk 越长越流畅（惯性、无断流）但越迟钝；越短越灵敏但越抖、算力越吃紧。准静态搬运 1–2 秒，接触密集任务 0.2–0.4 秒。</text>
</svg>
