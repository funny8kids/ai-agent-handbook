<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 674" width="768" height="674" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="Agent 评测看板窗口示意：顶部通过率、回归数、成本三张分数卡，中部左侧新旧版本 pass@1 逐套件柱状对比、右侧发布门禁判定卡，下方五行用例表列出期望、实际与判定勾叉，底注强调回归必须人工复核">
  <defs>
    <linearGradient id="bge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <pattern id="gridr" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e11d48" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="gNew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="gOld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="she" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="shes" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="768" height="674" rx="18" fill="url(#bge)"/>
  <rect width="768" height="674" rx="18" fill="url(#gridr)"/>
  <rect x="0.5" y="0.5" width="767" height="673" rx="18" fill="none" stroke="#cbd5e1"/>

  <!-- ===== 页头 ===== -->
  <text x="24" y="36" font-size="19" font-weight="700" fill="#0f172a">Agent 评测看板：这版能不能发，看这块屏</text>
  <text x="24" y="58" font-size="13" fill="#475569">通过率是入场券，回归才是刹车片：分数卡、版本对比、用例明细一屏看全</text>
  <g filter="url(#shes)">
    <rect x="596" y="20" width="148" height="26" rx="13" fill="#ffe4e6" stroke="#fda4af"/>
  </g>
  <text x="670" y="37" text-anchor="middle" font-size="12.5" font-weight="700" fill="#be123c">第 10 章 · 评估与安全</text>

  <!-- ===== 窗口外壳 ===== -->
  <g filter="url(#she)">
    <rect x="24" y="76" width="720" height="530" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <path d="M24 88 A12 12 0 0 1 36 76 H732 A12 12 0 0 1 744 88 V106 H24 Z" fill="#fdeef0"/>
  <line x1="24" y1="106" x2="744" y2="106" stroke="#fbcfd5"/>
  <circle cx="40" cy="91" r="5.5" fill="#f87171"/>
  <circle cx="56" cy="91" r="5.5" fill="#fbbf24"/>
  <circle cx="72" cy="91" r="5.5" fill="#34d399"/>
  <text x="90" y="96" font-size="14" font-weight="700" fill="#334155">Agent 评测看板 — 发布门禁</text>
  <rect x="652" y="80" width="76" height="22" rx="11" fill="#f8d7dd"/>
  <text x="690" y="95" text-anchor="middle" font-size="12.5" fill="#9f1239">运行 #482</text>

  <!-- ===== 三张分数卡 ===== -->
  <g filter="url(#shes)">
    <rect x="40" y="118" width="224" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="272" y="118" width="224" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="504" y="118" width="224" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="48" y="130" width="5" height="80" rx="2.5" fill="#e11d48"/>
  <rect x="280" y="130" width="5" height="80" rx="2.5" fill="#f59e0b"/>
  <rect x="512" y="130" width="5" height="80" rx="2.5" fill="#059669"/>

  <text x="68" y="142" font-size="12.5" fill="#475569">总通过率</text>
  <text x="68" y="180" font-size="28" font-weight="800" fill="#0f172a">82.4%</text>
  <rect x="160" y="158" width="70" height="22" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="195" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">+3.1 pt</text>
  <text x="68" y="208" font-size="12" fill="#64748b">对比 v3.2 · 128 用例</text>

  <text x="300" y="142" font-size="12.5" fill="#475569">回归用例数</text>
  <text x="300" y="158" font-size="12" fill="#64748b">（原本通过转失败）</text>
  <text x="300" y="192" font-size="28" font-weight="800" fill="#0f172a">5</text>
  <rect x="316" y="170" width="82" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="357" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">需人工复核</text>
  <text x="300" y="214" font-size="12" fill="#64748b">近 30 天均值 2.3 例</text>

  <text x="532" y="142" font-size="12.5" fill="#475569">单次运行成本</text>
  <text x="532" y="180" font-size="28" font-weight="800" fill="#0f172a">¥0.13</text>
  <rect x="616" y="158" width="58" height="22" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="645" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">-18%</text>
  <text x="532" y="208" font-size="12" fill="#64748b">预算 ≤¥0.15 · 在预算内</text>

  <!-- ===== 柱状对比 ===== -->
  <rect x="40" y="238" width="440" height="176" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="260" font-size="13" font-weight="700" fill="#0f172a">pass@1 逐套件对比</text>
  <rect x="340" y="250" width="14" height="10" rx="2" fill="url(#gOld)"/>
  <text x="358" y="259" font-size="12" fill="#64748b">v3.2</text>
  <rect x="392" y="250" width="14" height="10" rx="2" fill="url(#gNew)"/>
  <text x="410" y="259" font-size="12" fill="#be123c">v4.0</text>

  <line x1="72" y1="384" x2="456" y2="384" stroke="#cbd5e1"/>
  <!-- 组 1 代码修复 72→78 -->
  <rect x="95" y="305" width="22" height="79" rx="3" fill="url(#gOld)"/>
  <rect x="123" y="298" width="22" height="86" rx="3" fill="url(#gNew)"/>
  <text x="106" y="299" text-anchor="middle" font-size="12" fill="#64748b">72</text>
  <text x="134" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c">78</text>
  <!-- 组 2 网页任务 55→61 -->
  <rect x="191" y="324" width="22" height="60" rx="3" fill="url(#gOld)"/>
  <rect x="219" y="317" width="22" height="67" rx="3" fill="url(#gNew)"/>
  <text x="202" y="318" text-anchor="middle" font-size="12" fill="#64748b">55</text>
  <text x="230" y="311" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c">61</text>
  <!-- 组 3 工具调用 88→92 -->
  <rect x="287" y="287" width="22" height="97" rx="3" fill="url(#gOld)"/>
  <rect x="315" y="283" width="22" height="101" rx="3" fill="url(#gNew)"/>
  <text x="298" y="281" text-anchor="middle" font-size="12" fill="#64748b">88</text>
  <text x="326" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c">92</text>
  <!-- 组 4 长文问答 64→57（回归） -->
  <rect x="383" y="314" width="22" height="70" rx="3" fill="url(#gOld)"/>
  <rect x="411" y="321" width="22" height="63" rx="3" fill="url(#gNew)"/>
  <text x="394" y="308" text-anchor="middle" font-size="12" fill="#64748b">64</text>
  <text x="422" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">57</text>
  <g font-size="12" text-anchor="middle" fill="#475569">
    <text x="120" y="402">代码修复</text>
    <text x="216" y="402">网页任务</text>
    <text x="312" y="402">工具调用</text>
    <text x="408" y="402" fill="#be123c" font-weight="700">长文问答·跌</text>
  </g>

  <!-- ===== 门禁判定卡 ===== -->
  <rect x="500" y="238" width="228" height="176" rx="12" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="516" y="262" font-size="13.5" font-weight="700" fill="#881337">发布门禁判定</text>
  <circle cx="520" cy="288" r="4" fill="#059669"/>
  <text x="532" y="292" font-size="12.5" fill="#334155">新增通过 9 例</text>
  <circle cx="520" cy="312" r="4" fill="#e11d48"/>
  <text x="532" y="316" font-size="12.5" fill="#334155">回归失败 5 例 · 超阈值 2</text>
  <circle cx="520" cy="336" r="4" fill="#94a3b8"/>
  <text x="532" y="340" font-size="12.5" fill="#334155">结果持平 114 例</text>
  <rect x="512" y="366" width="204" height="28" rx="14" fill="#fee2e2" stroke="#ef4444"/>
  <text x="614" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">结论：暂缓发布，先查回归</text>

  <!-- ===== 用例表 ===== -->
  <rect x="40" y="430" width="688" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-size="12" font-weight="700" fill="#64748b">
    <text x="56" y="452">用例</text>
    <text x="214" y="452">期望</text>
    <text x="404" y="452">实际</text>
    <text x="648" y="452">判定</text>
  </g>
  <line x1="52" y1="458" x2="716" y2="458" stroke="#e2e8f0"/>
  <rect x="48" y="466" width="672" height="22" rx="6" fill="#f8fafc"/>
  <rect x="48" y="514" width="672" height="22" rx="6" fill="#fff1f2"/>
  <rect x="48" y="538" width="672" height="22" rx="6" fill="#fff1f2"/>

  <g font-size="12.5">
    <text x="56" y="480" font-weight="600" fill="#0f172a">修复空指针崩溃</text>
    <text x="214" y="480" fill="#334155">测试全绿 · 改 2 文件</text>
    <text x="404" y="480" fill="#334155">测试全绿 · 改 2 文件</text>
    <text x="648" y="481" font-size="15" font-weight="700" fill="#047857">✓</text>
    <text x="666" y="480" font-size="12" fill="#047857">通过</text>

    <text x="56" y="504" font-weight="600" fill="#0f172a">三站比价聚合</text>
    <text x="214" y="504" fill="#334155">3 家报价 · 带来源链接</text>
    <text x="404" y="504" fill="#334155">3 家报价 · 带来源链接</text>
    <text x="648" y="505" font-size="15" font-weight="700" fill="#047857">✓</text>
    <text x="666" y="504" font-size="12" fill="#047857">通过</text>

    <text x="56" y="528" font-weight="600" fill="#0f172a">合同要点抽取</text>
    <text x="214" y="528" fill="#334155">8 项要点 · 含付款条款</text>
    <text x="404" y="528" fill="#b91c1c">只抽到 6 项 · 漏付款条款</text>
    <text x="648" y="529" font-size="15" font-weight="700" fill="#be123c">✗</text>
    <text x="666" y="528" font-size="12" font-weight="700" fill="#be123c">回归</text>

    <text x="56" y="552" font-weight="600" fill="#0f172a">预订含取消</text>
    <text x="214" y="552" fill="#334155">取消后清空订单状态</text>
    <text x="404" y="552" fill="#b91c1c">取消成功 · 订单状态未清</text>
    <text x="648" y="553" font-size="15" font-weight="700" fill="#be123c">✗</text>
    <text x="666" y="552" font-size="12" font-weight="700" fill="#be123c">回归</text>

    <text x="56" y="576" font-weight="600" fill="#0f172a">工具参数容错</text>
    <text x="214" y="576" fill="#334155">缺 date 时默认今天</text>
    <text x="404" y="576" fill="#334155">重试 1 次后成功</text>
    <text x="648" y="577" font-size="15" font-weight="700" fill="#047857">✓</text>
    <text x="666" y="576" font-size="12" fill="#92400e">带重试</text>
  </g>

  <!-- ===== 底注 ===== -->
  <text x="24" y="622" font-size="13" fill="#475569">发布纪律：回归必须逐例人工复核并归类（模型波动 / 提示变更 / 评测集噪声），</text>
  <text x="24" y="644" font-size="13" fill="#475569">每一例给出解释并完成成本核算才允许放行。</text>
</svg>
