<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" role="img" aria-label="MCP 架构图：Host 应用内嵌两个 MCP Client，经 stdio 与 Streamable HTTP 一对一连接两个 MCP Server，Server 暴露 Tools、Resources、Prompts 三种原语；顶部对比无 MCP 时 M 乘 N 与有 MCP 时 M 加 N">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="gHost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="gClient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="gBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrTeal" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#0d9488"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#94a3b8" stroke-width="0.7" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="960" height="680" rx="20" fill="url(#bg)"/>
  <rect width="960" height="680" rx="20" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="959" height="679" rx="20" fill="none" stroke="#cbd5e1"/>

  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">MCP 架构：Host 内嵌 Client，一对一连接 Server</text>
  <text x="40" y="72" font-size="16" fill="#475569">传输层两种：本地进程走 stdio，远程服务走 Streamable HTTP；消息层是双向 JSON-RPC</text>

  <!-- ============ 顶部对比：M×N vs M+N ============ -->
  <g>
    <rect x="40" y="92" width="424" height="176" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="58" y="118" font-size="16" font-weight="700" fill="#475569">无 MCP：M 个应用 × N 个工具，逐一写集成</text>
    <g fill="#f1f5f9" stroke="#94a3b8">
      <rect x="56" y="132" width="88" height="30" rx="7"/>
      <rect x="56" y="170" width="88" height="30" rx="7"/>
      <rect x="56" y="208" width="88" height="30" rx="7"/>
      <rect x="360" y="132" width="88" height="30" rx="7"/>
      <rect x="360" y="170" width="88" height="30" rx="7"/>
      <rect x="360" y="208" width="88" height="30" rx="7"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.1" fill="none" opacity="0.8">
      <path d="M144 147 C 214 141, 292 139, 360 145"/>
      <path d="M144 147 C 218 160, 288 172, 360 183"/>
      <path d="M144 147 C 210 172, 294 198, 360 221"/>
      <path d="M144 185 C 214 172, 292 152, 360 147"/>
      <path d="M144 185 L 360 185"/>
      <path d="M144 185 C 214 196, 292 208, 360 219"/>
      <path d="M144 223 C 214 210, 292 192, 360 187"/>
      <path d="M144 223 C 210 200, 294 160, 360 149"/>
      <path d="M144 223 L 360 225"/>
    </g>
    <g font-size="15" fill="#475569" text-anchor="middle">
      <text x="100" y="152">应用 A</text>
      <text x="100" y="190">应用 B</text>
      <text x="100" y="228">应用 C</text>
      <text x="404" y="152">工具 1</text>
      <text x="404" y="190">工具 2</text>
      <text x="404" y="228">工具 3</text>
    </g>
    <text x="252" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">M × N = 9 条定制集成，换一端全部重来</text>
  </g>

  <g>
    <rect x="496" y="92" width="424" height="176" rx="12" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" filter="url(#sh)"/>
    <text x="514" y="118" font-size="16" font-weight="700" fill="#0f766e">有 MCP：应用实现一次 Client，工具发布一次 Server</text>
    <g fill="#f0fdfa" stroke="#0d9488">
      <rect x="512" y="132" width="88" height="30" rx="7"/>
      <rect x="512" y="170" width="88" height="30" rx="7"/>
      <rect x="512" y="208" width="88" height="30" rx="7"/>
      <rect x="820" y="132" width="88" height="30" rx="7"/>
      <rect x="820" y="170" width="88" height="30" rx="7"/>
      <rect x="820" y="208" width="88" height="30" rx="7"/>
    </g>
    <rect x="666" y="132" width="118" height="106" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
    <g stroke="#0d9488" stroke-width="1.5" fill="none">
      <path d="M600 147 L 660 158" marker-end="url(#arrTeal)"/>
      <path d="M600 185 L 660 185" marker-end="url(#arrTeal)"/>
      <path d="M600 223 L 660 212" marker-end="url(#arrTeal)"/>
      <path d="M784 158 L 814 147" marker-end="url(#arrTeal)"/>
      <path d="M784 185 L 814 185" marker-end="url(#arrTeal)"/>
      <path d="M784 212 L 814 223" marker-end="url(#arrTeal)"/>
    </g>
    <g font-size="15" fill="#134e4a" text-anchor="middle">
      <text x="556" y="152">应用 A</text>
      <text x="556" y="190">应用 B</text>
      <text x="556" y="228">应用 C</text>
      <text x="864" y="152">工具 1</text>
      <text x="864" y="190">工具 2</text>
      <text x="864" y="228">工具 3</text>
      <text x="725" y="180" font-size="20" font-weight="700" fill="#0f766e">MCP</text>
      <text x="725" y="206">统一协议</text>
    </g>
    <text x="708" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">M + N = 6 个标准接口，全部复用</text>
  </g>

  <!-- ============ 主体：Host 与两台 Server ============ -->
  <g>
    <rect x="28" y="286" width="272" height="310" rx="14" fill="url(#gHost)" stroke="#0d9488" stroke-width="2" filter="url(#sh)"/>
    <text x="46" y="316" font-size="18" font-weight="700" fill="#0f172a">Host 应用</text>
    <text x="46" y="340" font-size="15" fill="#475569">AI 应用 / Agent 运行时</text>
    <text x="46" y="360" font-size="15" fill="#475569">内嵌多个 MCP Client</text>

    <g filter="url(#sh)">
      <rect x="44" y="386" width="240" height="80" rx="10" fill="url(#gClient)"/>
      <rect x="44" y="486" width="240" height="80" rx="10" fill="url(#gClient)"/>
    </g>
    <text x="60" y="412" font-size="16" font-weight="700" fill="#ffffff">MCP Client 1</text>
    <text x="60" y="434" font-size="15" fill="#ccfbf1">与 filesystem Server</text>
    <text x="60" y="454" font-size="15" fill="#ccfbf1">1:1 独占会话</text>
    <text x="60" y="512" font-size="16" font-weight="700" fill="#ffffff">MCP Client 2</text>
    <text x="60" y="534" font-size="15" fill="#ccfbf1">与 search Server</text>
    <text x="60" y="554" font-size="15" fill="#ccfbf1">1:1 独占会话</text>
  </g>

  <!-- Server A：本地 stdio -->
  <g>
    <rect x="490" y="286" width="442" height="148" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" filter="url(#sh)"/>
    <text x="506" y="312" font-size="16" font-weight="700" fill="#0f172a">MCP Server · filesystem</text>
    <rect x="826" y="294" width="90" height="26" rx="13" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="871" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">本地进程</text>

    <g filter="url(#sh)">
      <rect x="506" y="326" width="130" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
      <rect x="646" y="326" width="130" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
      <rect x="786" y="326" width="130" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    </g>
    <circle cx="571" cy="346" r="13" fill="#0d9488"/>
    <g transform="translate(571,346)">
      <circle r="5.5" fill="none" stroke="#ffffff" stroke-width="2.4"/>
      <g fill="#ffffff">
        <rect x="-1.5" y="-11" width="3" height="4" rx="1"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(45)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(90)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(135)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(180)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(225)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(270)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(315)"/>
      </g>
    </g>
    <circle cx="711" cy="346" r="13" fill="#0d9488"/>
    <g transform="translate(711,346)">
      <rect x="-8" y="-9" width="11" height="14" rx="1.8" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <rect x="-3.5" y="-5.5" width="11" height="14" rx="1.8" fill="#ffffff"/>
    </g>
    <circle cx="851" cy="346" r="13" fill="#0d9488"/>
    <g transform="translate(851,346)">
      <rect x="-9" y="-8" width="18" height="12" rx="3" fill="#ffffff"/>
      <path d="M-4,4 L-6.5,9 L0.5,4 Z" fill="#ffffff"/>
      <circle cx="-4.5" cy="-2" r="1.4" fill="#0d9488"/>
      <circle cx="0" cy="-2" r="1.4" fill="#0d9488"/>
      <circle cx="4.5" cy="-2" r="1.4" fill="#0d9488"/>
    </g>
    <g text-anchor="middle">
      <text x="571" y="376" font-size="15" font-weight="700" fill="#134e4a">Tools</text>
      <text x="571" y="396" font-size="15" fill="#475569">可执行动作</text>
      <text x="571" y="416" font-size="15" fill="#64748b">read_file·search</text>
      <text x="711" y="376" font-size="15" font-weight="700" fill="#134e4a">Resources</text>
      <text x="711" y="396" font-size="15" fill="#475569">可读上下文</text>
      <text x="711" y="416" font-size="15" fill="#64748b">file://·db://</text>
      <text x="851" y="376" font-size="15" font-weight="700" fill="#134e4a">Prompts</text>
      <text x="851" y="396" font-size="15" fill="#475569">模板化指令</text>
      <text x="851" y="416" font-size="15" fill="#64748b">summarize(…)</text>
    </g>
  </g>

  <!-- Server B：远程 Streamable HTTP -->
  <g>
    <rect x="490" y="448" width="442" height="148" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" filter="url(#sh)"/>
    <text x="506" y="474" font-size="16" font-weight="700" fill="#0f172a">MCP Server · search</text>
    <rect x="826" y="456" width="90" height="26" rx="13" fill="#eef2ff" stroke="#6366f1"/>
    <text x="871" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">远程服务</text>

    <g filter="url(#sh)">
      <rect x="506" y="488" width="130" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
      <rect x="646" y="488" width="130" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
      <rect x="786" y="488" width="130" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    </g>
    <circle cx="571" cy="508" r="13" fill="#0d9488"/>
    <g transform="translate(571,508)">
      <circle r="5.5" fill="none" stroke="#ffffff" stroke-width="2.4"/>
      <g fill="#ffffff">
        <rect x="-1.5" y="-11" width="3" height="4" rx="1"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(45)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(90)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(135)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(180)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(225)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(270)"/>
        <rect x="-1.5" y="-11" width="3" height="4" rx="1" transform="rotate(315)"/>
      </g>
    </g>
    <circle cx="711" cy="508" r="13" fill="#0d9488"/>
    <g transform="translate(711,508)">
      <rect x="-8" y="-9" width="11" height="14" rx="1.8" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <rect x="-3.5" y="-5.5" width="11" height="14" rx="1.8" fill="#ffffff"/>
    </g>
    <circle cx="851" cy="508" r="13" fill="#0d9488"/>
    <g transform="translate(851,508)">
      <rect x="-9" y="-8" width="18" height="12" rx="3" fill="#ffffff"/>
      <path d="M-4,4 L-6.5,9 L0.5,4 Z" fill="#ffffff"/>
      <circle cx="-4.5" cy="-2" r="1.4" fill="#0d9488"/>
      <circle cx="0" cy="-2" r="1.4" fill="#0d9488"/>
      <circle cx="4.5" cy="-2" r="1.4" fill="#0d9488"/>
    </g>
    <g text-anchor="middle">
      <text x="571" y="538" font-size="15" font-weight="700" fill="#134e4a">Tools</text>
      <text x="571" y="558" font-size="15" fill="#475569">可执行动作</text>
      <text x="571" y="578" font-size="15" fill="#64748b">web_search·fetch</text>
      <text x="711" y="538" font-size="15" font-weight="700" fill="#134e4a">Resources</text>
      <text x="711" y="558" font-size="15" fill="#475569">可读上下文</text>
      <text x="711" y="578" font-size="15" fill="#64748b">index://·doc://</text>
      <text x="851" y="538" font-size="15" font-weight="700" fill="#134e4a">Prompts</text>
      <text x="851" y="558" font-size="15" fill="#475569">模板化指令</text>
      <text x="851" y="578" font-size="15" fill="#64748b">compare(…)</text>
    </g>
  </g>

  <!-- ============ 连接：1:1 实线 + 传输层标签 ============ -->
  <path id="connA" d="M300 410 C 396 410, 396 348, 484 348" fill="none" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrTeal)"/>
  <path id="connB" d="M300 510 L 484 510" fill="none" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrTeal)"/>

  <rect x="324" y="364" width="140" height="30" rx="15" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
  <text x="394" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">stdio · 本地进程</text>
  <rect x="328" y="495" width="136" height="30" rx="15" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
  <text x="396" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Streamable HTTP</text>

  <circle r="4.5" fill="#14b8a6">
    <animateMotion dur="3s" repeatCount="indefinite" path="M300 410 C 396 410, 396 348, 484 348"/>
  </circle>
  <circle r="4.5" fill="#14b8a6">
    <animateMotion dur="4s" begin="1s" repeatCount="indefinite" path="M484 510 L 300 510"/>
  </circle>

  <!-- ============ 底部金句 ============ -->
  <rect x="28" y="614" width="904" height="42" rx="21" fill="url(#gBanner)"/>
  <text x="480" y="641" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">一句话：MCP 是「AI 应用的 USB-C」——一种接口，接所有工具与数据源</text>
</svg>
