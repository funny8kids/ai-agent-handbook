<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="MCP 架构图：Host 应用内嵌两个 MCP Client，经 stdio 与 Streamable HTTP 一对一连接两个 MCP Server，Server 暴露 Tools、Resources、Prompts 三种原语；顶部对比无 MCP 时 M 乘 N 与有 MCP 时 M 加 N">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="gHost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="gClient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="gBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrTeal" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#0d9488"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#94a3b8" stroke-width="0.7" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#bg)"/>
  <rect width="960" height="540" rx="20" fill="url(#grid)"/>

  <text x="40" y="34" font-size="17" font-weight="700" fill="#0f172a">MCP 架构：Host 内嵌 Client，一对一连接 Server，Server 暴露三种原语</text>
  <text x="40" y="54" font-size="12" fill="#475569">传输层两种：本地进程走 stdio，远程服务走 Streamable HTTP；消息层是双向 JSON-RPC</text>

  <!-- ============ 顶部对比：M×N vs M+N ============ -->
  <g>
    <rect x="40" y="66" width="424" height="136" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="60" y="88" font-size="13" font-weight="700" fill="#475569">无 MCP：M 个应用 × N 个工具，逐一写集成</text>
    <g fill="#f1f5f9" stroke="#94a3b8">
      <rect x="62" y="98" width="72" height="20" rx="5"/>
      <rect x="62" y="128" width="72" height="20" rx="5"/>
      <rect x="62" y="158" width="72" height="20" rx="5"/>
      <rect x="366" y="98" width="76" height="20" rx="5"/>
      <rect x="366" y="128" width="76" height="20" rx="5"/>
      <rect x="366" y="158" width="76" height="20" rx="5"/>
    </g>
    <g font-size="10.5" fill="#475569">
      <text x="98" y="112" text-anchor="middle">应用 A</text>
      <text x="98" y="142" text-anchor="middle">应用 B</text>
      <text x="98" y="172" text-anchor="middle">应用 C</text>
      <text x="404" y="112" text-anchor="middle">工具 1</text>
      <text x="404" y="142" text-anchor="middle">工具 2</text>
      <text x="404" y="172" text-anchor="middle">工具 3</text>
    </g>
    <g stroke="#94a3b8" stroke-width="1.1" fill="none" opacity="0.8">
      <path d="M134 108 C 206 100, 292 96, 366 105"/>
      <path d="M134 108 C 210 118, 286 130, 366 136"/>
      <path d="M134 108 C 200 132, 296 156, 366 165"/>
      <path d="M134 138 C 206 118, 292 106, 366 107"/>
      <path d="M134 138 L 366 138"/>
      <path d="M134 138 C 206 150, 292 158, 366 164"/>
      <path d="M134 168 C 206 178, 292 152, 366 140"/>
      <path d="M134 168 C 206 158, 292 118, 366 109"/>
      <path d="M134 168 L 366 169"/>
    </g>
    <text x="252" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748b">M × N = 9 条定制集成，换一端全部重来</text>
  </g>

  <g>
    <rect x="496" y="66" width="424" height="136" rx="12" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" filter="url(#sh)"/>
    <text x="516" y="88" font-size="13" font-weight="700" fill="#0f766e">有 MCP：应用只实现一次 Client，工具只发布一次 Server</text>
    <g fill="#f0fdfa" stroke="#0d9488">
      <rect x="518" y="98" width="72" height="20" rx="5"/>
      <rect x="518" y="128" width="72" height="20" rx="5"/>
      <rect x="518" y="158" width="72" height="20" rx="5"/>
      <rect x="842" y="98" width="76" height="20" rx="5"/>
      <rect x="842" y="128" width="76" height="20" rx="5"/>
      <rect x="842" y="158" width="76" height="20" rx="5"/>
    </g>
    <g font-size="10.5" fill="#134e4a">
      <text x="554" y="112" text-anchor="middle">应用 A</text>
      <text x="554" y="142" text-anchor="middle">应用 B</text>
      <text x="554" y="172" text-anchor="middle">应用 C</text>
      <text x="880" y="112" text-anchor="middle">工具 1</text>
      <text x="880" y="142" text-anchor="middle">工具 2</text>
      <text x="880" y="172" text-anchor="middle">工具 3</text>
    </g>
    <rect x="676" y="98" width="76" height="80" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="714" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">MCP</text>
    <text x="714" y="152" text-anchor="middle" font-size="10.5" fill="#115e59">统一协议</text>
    <g stroke="#0d9488" stroke-width="1.4" fill="none">
      <path d="M590 108 L 676 126" marker-end="url(#arrTeal)"/>
      <path d="M590 138 L 676 138" marker-end="url(#arrTeal)"/>
      <path d="M590 168 L 676 150" marker-end="url(#arrTeal)"/>
      <path d="M752 126 L 842 108" marker-end="url(#arrTeal)"/>
      <path d="M752 138 L 842 138" marker-end="url(#arrTeal)"/>
      <path d="M752 150 L 842 168" marker-end="url(#arrTeal)"/>
    </g>
    <text x="714" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">M + N = 6 个标准接口，全部复用</text>
  </g>

  <!-- ============ 主体：Host 与两台 Server ============ -->
  <g>
    <rect x="40" y="240" width="340" height="248" rx="14" fill="url(#gHost)" stroke="#0d9488" stroke-width="2" filter="url(#sh)"/>
    <text x="60" y="270" font-size="15" font-weight="700" fill="#0f172a">Host 应用</text>
    <text x="60" y="290" font-size="11" fill="#475569">AI 应用 / Agent 运行时，内嵌多个 MCP Client</text>

    <g filter="url(#sh)">
      <rect x="64" y="304" width="292" height="64" rx="10" fill="url(#gClient)"/>
      <rect x="64" y="396" width="292" height="64" rx="10" fill="url(#gClient)"/>
    </g>
    <text x="80" y="330" font-size="13.5" font-weight="700" fill="#ffffff">MCP Client 1</text>
    <text x="80" y="350" font-size="11" fill="#ccfbf1">与 filesystem Server 1:1 会话</text>
    <text x="80" y="422" font-size="13.5" font-weight="700" fill="#ffffff">MCP Client 2</text>
    <text x="80" y="442" font-size="11" fill="#ccfbf1">与 search Server 1:1 会话</text>
  </g>

  <!-- Server A：本地 stdio -->
  <g>
    <rect x="584" y="240" width="352" height="116" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" filter="url(#sh)"/>
    <text x="600" y="266" font-size="14" font-weight="700" fill="#0f172a">MCP Server · filesystem</text>
    <rect x="854" y="250" width="66" height="20" rx="10" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="887" y="264" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e">本地进程</text>

    <g filter="url(#sh)">
      <rect x="598" y="282" width="102" height="62" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <rect x="709" y="282" width="102" height="62" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <rect x="820" y="282" width="102" height="62" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
    </g>
    <circle cx="620" cy="305" r="12" fill="#0d9488"/>
    <g transform="translate(620,305)">
      <circle r="5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <g fill="#ffffff">
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(45)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(90)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(135)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(180)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(225)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(270)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(315)"/>
      </g>
    </g>
    <text x="638" y="301" font-size="11.5" font-weight="700" fill="#134e4a">Tools</text>
    <text x="638" y="317" font-size="10" fill="#475569">可执行动作</text>
    <text x="649" y="336" text-anchor="middle" font-size="9.5" fill="#64748b">read_file · search</text>

    <circle cx="731" cy="305" r="12" fill="#0d9488"/>
    <g transform="translate(731,305)">
      <rect x="-7.5" y="-8" width="10" height="13" rx="1.6" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <rect x="-3.5" y="-5" width="10" height="13" rx="1.6" fill="#ffffff"/>
    </g>
    <text x="749" y="301" font-size="11.5" font-weight="700" fill="#134e4a">Resources</text>
    <text x="749" y="317" font-size="10" fill="#475569">可读上下文</text>
    <text x="760" y="336" text-anchor="middle" font-size="9.5" fill="#64748b">file:// · db://</text>

    <circle cx="842" cy="305" r="12" fill="#0d9488"/>
    <g transform="translate(842,305)">
      <rect x="-8" y="-7" width="16" height="10.5" rx="2.5" fill="#ffffff"/>
      <path d="M-3.5,3.5 L-6,8 L0.5,3.5 Z" fill="#ffffff"/>
      <circle cx="-4" cy="-1.8" r="1.2" fill="#0d9488"/>
      <circle cx="0" cy="-1.8" r="1.2" fill="#0d9488"/>
      <circle cx="4" cy="-1.8" r="1.2" fill="#0d9488"/>
    </g>
    <text x="860" y="301" font-size="11.5" font-weight="700" fill="#134e4a">Prompts</text>
    <text x="860" y="317" font-size="10" fill="#475569">模板化指令</text>
    <text x="871" y="336" text-anchor="middle" font-size="9.5" fill="#64748b">summarize(…)</text>
  </g>

  <!-- Server B：远程 Streamable HTTP -->
  <g>
    <rect x="584" y="372" width="352" height="116" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" filter="url(#sh)"/>
    <text x="600" y="398" font-size="14" font-weight="700" fill="#0f172a">MCP Server · search</text>
    <rect x="854" y="382" width="66" height="20" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="887" y="396" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3730a3">远程服务</text>

    <g filter="url(#sh)">
      <rect x="598" y="414" width="102" height="62" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <rect x="709" y="414" width="102" height="62" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <rect x="820" y="414" width="102" height="62" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
    </g>
    <circle cx="620" cy="437" r="12" fill="#0d9488"/>
    <g transform="translate(620,437)">
      <circle r="5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <g fill="#ffffff">
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(45)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(90)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(135)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(180)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(225)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(270)"/>
        <rect x="-1.4" y="-10" width="2.8" height="3.6" rx="1" transform="rotate(315)"/>
      </g>
    </g>
    <text x="638" y="433" font-size="11.5" font-weight="700" fill="#134e4a">Tools</text>
    <text x="638" y="449" font-size="10" fill="#475569">可执行动作</text>
    <text x="649" y="468" text-anchor="middle" font-size="9.5" fill="#64748b">web_search · fetch</text>

    <circle cx="731" cy="437" r="12" fill="#0d9488"/>
    <g transform="translate(731,437)">
      <rect x="-7.5" y="-8" width="10" height="13" rx="1.6" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <rect x="-3.5" y="-5" width="10" height="13" rx="1.6" fill="#ffffff"/>
    </g>
    <text x="749" y="433" font-size="11.5" font-weight="700" fill="#134e4a">Resources</text>
    <text x="749" y="449" font-size="10" fill="#475569">可读上下文</text>
    <text x="760" y="468" text-anchor="middle" font-size="9.5" fill="#64748b">index:// · doc://</text>

    <circle cx="842" cy="437" r="12" fill="#0d9488"/>
    <g transform="translate(842,437)">
      <rect x="-8" y="-7" width="16" height="10.5" rx="2.5" fill="#ffffff"/>
      <path d="M-3.5,3.5 L-6,8 L0.5,3.5 Z" fill="#ffffff"/>
      <circle cx="-4" cy="-1.8" r="1.2" fill="#0d9488"/>
      <circle cx="0" cy="-1.8" r="1.2" fill="#0d9488"/>
      <circle cx="4" cy="-1.8" r="1.2" fill="#0d9488"/>
    </g>
    <text x="860" y="433" font-size="11.5" font-weight="700" fill="#134e4a">Prompts</text>
    <text x="860" y="449" font-size="10" fill="#475569">模板化指令</text>
    <text x="871" y="468" text-anchor="middle" font-size="9.5" fill="#64748b">compare(…)</text>
  </g>

  <!-- ============ 连接：1:1 实线 + 传输层标签 ============ -->
  <path id="connA" d="M356 336 C 470 336, 470 300, 578 300" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrTeal)"/>
  <path id="connB" d="M356 428 C 470 428, 470 440, 578 440" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrTeal)"/>

  <rect x="402" y="306" width="124" height="24" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
  <text x="464" y="322" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">stdio · 本地进程</text>
  <rect x="389" y="422" width="152" height="24" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
  <text x="465" y="438" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Streamable HTTP · 远程</text>

  <circle r="4" fill="#14b8a6">
    <animateMotion dur="3s" repeatCount="indefinite" path="M356 336 C 470 336, 470 300, 578 300"/>
  </circle>
  <circle r="4" fill="#14b8a6">
    <animateMotion dur="4s" begin="1s" repeatCount="indefinite" path="M578 440 C 470 440, 470 428, 356 428"/>
  </circle>

  <!-- ============ 底部金句 ============ -->
  <rect x="40" y="498" width="880" height="32" rx="16" fill="url(#gBanner)"/>
  <text x="480" y="519" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">一句话：MCP 是「AI 应用的 USB-C」——一种接口，接所有工具与数据源</text>
</svg>
