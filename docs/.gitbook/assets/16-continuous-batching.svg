<svg width="920" height="490" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" role="img" aria-label="静态批处理与连续批处理对比动画">
  <rect x="0" y="0" width="920" height="490" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="20" y="26" font-size="19" font-weight="700" fill="#0f172a">静态批处理 vs 连续批处理（continuous batching）</text>

  <!-- ===== section 1: static batching ===== -->
  <text x="20" y="56" fill="#475569" font-weight="700">① 静态批处理：整批一起做，短的那个也得等最长的</text>
  <line x1="160" y1="66" x2="160" y2="216" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <line x1="860" y1="66" x2="860" y2="216" stroke="#94a3b8" stroke-dasharray="3 3"/>

  <!-- lane A -->
  <text x="20" y="90" fill="#0f172a">req A · 60 tok</text>
  <rect x="160" y="76" width="200" height="22" rx="3" fill="#22c55e">
    <animate attributeName="width" values="0;200;200" keyTimes="0;0.32;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="360" y="76" width="500" height="22" rx="3" fill="url(#idle)">
    <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.32;0.36;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="510" y="91" fill="#991b1b" font-size="16">已完成，但仍在占着批次槽位（浪费）</text>

  <text x="20" y="126" fill="#0f172a">req B · 90 tok</text>
  <rect x="160" y="112" width="300" height="22" rx="3" fill="#22c55e">
    <animate attributeName="width" values="0;300;300" keyTimes="0;0.48;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="460" y="112" width="400" height="22" rx="3" fill="url(#idle)">
    <animate attributeName="opacity" values="0.25;0.25;1;1" keyTimes="0;0.48;0.52;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="20" y="162" fill="#0f172a">req C · 120 tok</text>
  <rect x="160" y="148" width="390" height="22" rx="3" fill="#22c55e">
    <animate attributeName="width" values="0;390;390" keyTimes="0;0.62;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="550" y="148" width="310" height="22" rx="3" fill="url(#idle)">
    <animate attributeName="opacity" values="0.2;0.2;1;1" keyTimes="0;0.62;0.66;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="20" y="198" fill="#0f172a">req D · 240 tok</text>
  <rect x="160" y="184" width="700" height="22" rx="3" fill="#60a5fa">
    <animate attributeName="width" values="0;700" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="740" y="199" fill="#172554" font-size="16">decode 到 EOS</text>

  <text x="20" y="236" fill="#475569">GPU 有效产出</text>
  <rect x="160" y="224" width="700" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="160" y="224" width="700" height="14" rx="7" fill="#f59e0b" opacity="0.55">
    <animate attributeName="width" values="700;220;700" keyTimes="0;0.86;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="860" y="218" text-anchor="end" fill="#b45309" font-size="16">批尾塌陷</text>

  <!-- ===== section 2: continuous batching ===== -->
  <text x="20" y="278" fill="#475569" font-weight="700">② 连续批处理：谁先结束谁退出，队列里的新请求立刻补位</text>
  <line x1="160" y1="288" x2="160" y2="420" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <line x1="860" y1="288" x2="860" y2="420" stroke="#94a3b8" stroke-dasharray="3 3"/>

  <!-- slot 1: A then A' -->
  <text x="20" y="312" fill="#0f172a">slot 1</text>
  <rect x="160" y="298" width="200" height="22" rx="3" fill="#22c55e">
    <animate attributeName="width" values="0;200;200" keyTimes="0;0.32;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="360" y="298" width="180" height="22" rx="3" fill="#a78bfa">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.36;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="372" y="313" fill="#2e1065" font-size="16">新请求补位</text>

  <text x="20" y="348" fill="#0f172a">slot 2</text>
  <rect x="160" y="334" width="300" height="22" rx="3" fill="#22c55e">
    <animate attributeName="width" values="0;300;300" keyTimes="0;0.48;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="460" y="334" width="260" height="22" rx="3" fill="#a78bfa">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.49;0.52;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="20" y="384" fill="#0f172a">slot 3</text>
  <rect x="160" y="370" width="390" height="22" rx="3" fill="#22c55e">
    <animate attributeName="width" values="0;390;390" keyTimes="0;0.62;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="550" y="370" width="170" height="22" rx="3" fill="#a78bfa">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.66;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="20" y="414" fill="#0f172a">slot 4</text>
  <rect x="160" y="400" width="700" height="22" rx="3" fill="#60a5fa">
    <animate attributeName="width" values="0;700" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="20" y="466" fill="#475569">GPU 有效产出</text>
  <rect x="160" y="452" width="700" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="160" y="452" width="700" height="14" rx="7" fill="#16a34a" opacity="0.75">
    <animate attributeName="opacity" values="0.75;0.68;0.75" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="860" y="444" text-anchor="end" fill="#166534" font-size="16">持续满载</text>

  <defs>
    <pattern id="idle" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fecaca"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="3"/>
    </pattern>
  </defs>
</svg>
