<svg width="980" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" role="img" aria-label="VLA 双系统感知决策行动回路动画">
  <rect x="0" y="0" width="980" height="600" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="20" y="26" font-size="19" font-weight="700" fill="#0f172a">具身闭环：两条时钟（慢脑 5–10Hz / 快脑 50–200Hz）如何对齐</text>

  <!-- world -->
  <rect x="20" y="56" width="212" height="190" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="34" y="78" fill="#312e81" font-weight="700">物理世界</text>
  <rect x="40" y="152" width="176" height="8" rx="2" fill="#c7d2fe"/>
  <!-- cup moving -->
  <g>
    <rect x="60" y="122" width="26" height="30" rx="4" fill="#38bdf8" stroke="#0284c7"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 40 0; 40 0; 0 0" keyTimes="0;0.35;0.7;1" dur="6s" repeatCount="indefinite"/>
  </g>
  <text x="34" y="228" fill="#4338ca">物体会动、会被挡、有摩擦</text>

  <!-- cameras -->
  <rect x="246" y="56" width="140" height="190" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="260" y="78" fill="#334155" font-weight="700">感知</text>
  <text x="260" y="106" fill="#475569">RGB-D 30fps</text>
  <text x="260" y="130" fill="#475569">本体感受 500Hz</text>
  <text x="260" y="154" fill="#475569">力 / 触觉</text>
  <!-- frame dots -->
  <circle cx="300" cy="190" r="5" fill="#0ea5e9">
    <animate attributeName="cy" values="180;228;180" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="326" cy="190" r="5" fill="#0ea5e9">
    <animate attributeName="cy" values="180;228;180" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- slow system -->
  <rect x="400" y="56" width="224" height="88" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="414" y="76" fill="#92400e" font-weight="700">慢系统 · VLM 骨干</text>
  <text x="414" y="94" fill="#854d0e">读指令 + 看场景 →</text>
  <text x="414" y="112" fill="#854d0e">出子目标/隐条件</text>
  <text x="414" y="130" fill="#b45309" font-weight="700">5–10 Hz · 几十 B–几 B 参数</text>
  <rect x="400" y="56" width="224" height="88" rx="10" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.2">
    <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.05s" repeatCount="indefinite"/>
  </rect>

  <!-- fast system -->
  <rect x="400" y="158" width="224" height="88" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="414" y="180" fill="#14532d" font-weight="700">快系统 · 动作专家</text>
  <text x="414" y="204" fill="#15803d">flow / diffusion 头 → 动作块</text>
  <text x="414" y="228" fill="#166534" font-weight="700">50–200 Hz · 几十 M–300M</text>
  <rect x="400" y="158" width="224" height="88" rx="10" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.85;0.1;0.85;0.1" dur="0.36s" repeatCount="indefinite"/>
  </rect>

  <!-- safety -->
  <rect x="638" y="158" width="112" height="88" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="650" y="184" fill="#7f1d1d" font-weight="700">安全层</text>
  <text x="650" y="210" fill="#b91c1c">限幅 · 软限位</text>
  <text x="650" y="234" fill="#b91c1c">急停 · 力上限</text>

  <!-- controller + motors -->
  <rect x="764" y="158" width="112" height="88" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="776" y="184" fill="#312e81" font-weight="700">伺服 / WBC</text>
  <text x="776" y="210" fill="#4338ca">500Hz–1kHz</text>
  <text x="776" y="234" fill="#4338ca">电流环 kHz</text>

  <!-- robot arm glyph -->
  <g transform="translate(888,120)" stroke="#334155" stroke-width="9" fill="none" stroke-linecap="round">
    <line x1="24" y1="100" x2="24" y2="60"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 24 60; -22 24 60; -6 24 60; -22 24 60; 0 24 60" keyTimes="0;0.3;0.55;0.8;1" dur="6s" repeatCount="indefinite"/>
      <line x1="24" y1="60" x2="58" y2="36"/>
      <circle cx="62" cy="34" r="8" fill="#0f172a" stroke="none"/>
    </g>
  </g>
  <rect x="888" y="220" width="76" height="14" rx="4" fill="#94a3b8"/>

  <!-- action chunk buffer -->
  <rect x="638" y="56" width="238" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="650" y="76" fill="#334155" font-weight="700">动作块缓冲（滚动重规划）</text>
  <g>
    <rect x="652" y="88" width="20" height="26" rx="3" fill="#86efac"><animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="676" y="88" width="20" height="26" rx="3" fill="#86efac"><animate attributeName="opacity" values="1;1;0.25;1" keyTimes="0;0.3;0.6;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="700" y="88" width="20" height="26" rx="3" fill="#86efac"><animate attributeName="opacity" values="1;1;0.25;1" keyTimes="0;0.3;0.6;1" dur="2.1s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="724" y="88" width="20" height="26" rx="3" fill="#bbf7d0"><animate attributeName="opacity" values="1;1;0.3;1" keyTimes="0;0.3;0.6;1" dur="2.1s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="748" y="88" width="20" height="26" rx="3" fill="#bbf7d0"><animate attributeName="opacity" values="1;1;0.3;1" keyTimes="0;0.3;0.6;1" dur="2.1s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="772" y="88" width="20" height="26" rx="3" fill="#dcfce7"/>
    <rect x="796" y="88" width="20" height="26" rx="3" fill="#dcfce7"/>
    <rect x="820" y="88" width="20" height="26" rx="3" fill="#dcfce7"/>
    <rect x="844" y="88" width="20" height="26" rx="3" fill="#dcfce7"/>
  </g>
  <text x="638" y="48" fill="#15803d">← 已执行的淡出，新的补进来（越靠右越旧）</text>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M232 151 H240"/>
    <path d="M386 100 H394"/>
    <path d="M512 144 V154"/>
    <path d="M624 202 H632"/>
    <path d="M750 202 H758"/>
    <path d="M700 158 V148"/>
    <path d="M628 180 H634 V100 H638"/>
    <path d="M926 246 V264 H95 V252"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="240,146 246,151 240,156"/>
    <polygon points="394,95 400,100 394,105"/>
    <polygon points="507,154 512,160 517,154"/>
    <polygon points="632,197 638,202 632,207"/>
    <polygon points="758,197 764,202 758,207"/>
    <polygon points="632,105 638,100 632,95"/>
    <polygon points="90,252 95,246 100,252"/>
  </g>

  <!-- feedback loop label -->
  <text x="20" y="298" fill="#475569" font-weight="700">一次「抓杯子」的时间线</text>
  <g>
    <line x1="20" y1="362" x2="960" y2="362" stroke="#cbd5e1"/>
    <text x="20" y="322" fill="#0369a1">t=0ms</text>
    <text x="20" y="344" fill="#0369a1">观测帧</text>
    <text x="170" y="322" fill="#b45309">t=140ms 慢系统给子目标</text>
    <text x="170" y="344" fill="#b45309">「先移到杯子正上方」</text>
    <text x="520" y="322" fill="#15803d">t=150ms 快系统出</text>
    <text x="520" y="344" fill="#15803d">50 步动作块</text>
    <text x="790" y="322" fill="#334155">t=1150ms</text>
    <text x="790" y="344" fill="#334155">重规划</text>
    <circle r="7" fill="#0f172a">
      <animate attributeName="cx" values="30;940;30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="362;362;362" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="20" y="386" width="940" height="190" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="34" y="410" fill="#1e3a8a" font-weight="700">要点</text>
  <text x="72" y="410" fill="#1e40af">慢系统只提供「意图/条件」，不负责逐帧控制；</text>
  <text x="72" y="434" fill="#1e40af">快系统持续被最新观测修正，否则就是「闭眼执行 1 秒前的计划」。</text>
  <text x="34" y="468" fill="#1e40af">失败常来自三处错位：① 观测与动作时间戳没对齐；② 推理延迟没在训练里建模；</text>
  <text x="34" y="492" fill="#1e40af">③ chunk 执行完才重算（迟钝）或每步都重算（抖）。</text>
  <text x="34" y="526" fill="#1e40af">工程解法：异步推理 + temporal ensembling + 触发式提前重算</text>
  <text x="34" y="550" fill="#1e40af">（力超限 / 物体大幅位移 → 丢剩余块重规划）。</text>
</svg>
