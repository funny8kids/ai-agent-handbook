<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Agent 工具调用穿过沙箱分层与出口白名单的动画">
  <rect x="0" y="0" width="960" height="700" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="20" y="30" font-size="19" font-weight="700" fill="#0f172a">一次「执行代码」的工具调用，穿过了哪些闸门</text>

  <!-- ===== row A: the pipeline ===== -->
  <rect x="16" y="52" width="195" height="118" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="32" y="78" fill="#312e81" font-size="17" font-weight="700">Agent</text>
  <text x="32" y="100" fill="#4338ca">想跑 python 脚本</text>

  <rect x="237" y="52" width="215" height="118" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="253" y="78" fill="#92400e" font-size="17" font-weight="700">权限管道</text>
  <text x="253" y="100" fill="#a16207">风险级 · 审批 · 超时</text>
  <text x="253" y="122" fill="#a16207">预算 · 幂等键</text>

  <rect x="478" y="52" width="245" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="494" y="78" fill="#334155" font-size="17" font-weight="700">沙箱内：一次性会话</text>
  <text x="494" y="100" fill="#64748b">无密钥 env · tmpfs 可写</text>
  <text x="494" y="122" fill="#64748b">TTL 60s</text>

  <rect x="749" y="52" width="151" height="118" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="765" y="78" fill="#7f1d1d" font-size="17" font-weight="700">出口闸门</text>
  <text x="765" y="100" fill="#b91c1c">allow:</text>
  <text x="765" y="122" fill="#b91c1c">pypi, github</text>
  <text x="765" y="144" fill="#b91c1c">其余 deny</text>

  <!-- forward arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M211 111 H233"/><path d="M452 111 H474"/><path d="M723 111 H745"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="233,106 243,111 233,116"/><polygon points="474,106 484,111 474,116"/>
    <polygon points="745,106 755,111 745,116"/>
  </g>

  <!-- allowed packet: straight through the pipeline -->
  <circle r="6" fill="#16a34a">
    <animateMotion path="M211 111 H895" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.6;0.8;0.85;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== row B: the three isolation tiers ===== -->
  <text x="100" y="200" fill="#334155" font-size="17" font-weight="700">隔离层（按威胁模型选档）</text>
  <rect x="100" y="208" width="800" height="132" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>

  <rect x="112" y="242" width="250" height="88" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="126" y="266" fill="#14532d" font-size="17" font-weight="700">加固容器</text>
  <text x="126" y="290" fill="#15803d">namespace/cgroup/seccomp</text>
  <text x="126" y="312" fill="#15803d">landlock · 只读根</text>

  <rect x="374" y="242" width="250" height="88" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="388" y="266" fill="#1e3a8a" font-size="17" font-weight="700">gVisor</text>
  <text x="388" y="290" fill="#1d4ed8">用户态内核拦截 syscall</text>
  <text x="388" y="312" fill="#1d4ed8">兼容性好，性能有起伏</text>

  <rect x="636" y="242" width="250" height="88" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="650" y="266" fill="#4c1d95" font-size="17" font-weight="700">microVM</text>
  <text x="650" y="290" fill="#6d28d9">Firecracker · 快照恢复</text>
  <text x="650" y="312" fill="#6d28d9">多租户任意代码</text>

  <!-- ===== row C: what comes back, what never leaves ===== -->
  <rect x="100" y="380" width="280" height="80" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="116" y="406" fill="#065f46" font-size="17" font-weight="700">结果回流</text>
  <text x="116" y="430" fill="#047857">截断 + 脱敏 + 审计</text>

  <rect x="620" y="380" width="280" height="80" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-dasharray="4 4"/>
  <text x="636" y="406" fill="#b91c1c" font-size="17" font-weight="700">外部网络 / 元数据服务</text>
  <text x="636" y="430" fill="#dc2626">169.254.169.254 · 内网 10.0.0.x</text>

  <!-- fit:strike-ok ✕ -->
  <!-- egress lane: the gate blocks everything that is not on the allow-list -->
  <path d="M900 111 H926 V420 H904" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="904,415 894,420 904,425" fill="#dc2626"/>
  <g>
    <text x="917" y="308" fill="#dc2626" font-size="18" font-weight="700">✕</text>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/>
  </g>
  <circle r="6" fill="#dc2626">
    <animateMotion path="M900 111 H926 V280" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.55;0.6;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- return lane: sandbox -> 结果回流, down the left gutter -->
  <path d="M500 170 V176 H50 V420 H96" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="96,415 106,420 96,425" fill="#7c3aed"/>
  <circle r="5" fill="#7c3aed">
    <animateMotion path="M500 170 V176 H50 V420 H96" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== audit strip ===== -->
  <rect x="16" y="480" width="914" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="30" y="504" fill="#334155">审计事件流（append-only）：run_id · 代码哈希 · 申请的 capability · 出口目标 · 退出码 · 输出字节数 · 墙钟耗时</text>

  <!-- ===== comparison table ===== -->
  <text x="16" y="546" fill="#475569" font-size="17" font-weight="700">档位速查</text>
  <rect x="16" y="556" width="914" height="134" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="16" y1="584" x2="930" y2="584" stroke="#e2e8f0"/>
  <line x1="320" y1="556" x2="320" y2="690" stroke="#e2e8f0"/>
  <line x1="540" y1="556" x2="540" y2="690" stroke="#e2e8f0"/>
  <text x="30" y="576" fill="#0f172a" font-size="17" font-weight="700">层</text>
  <text x="334" y="576" fill="#0f172a" font-size="17" font-weight="700">启动 / 成本</text>
  <text x="554" y="576" fill="#0f172a" font-size="17" font-weight="700">适用</text>

  <text x="30" y="608" fill="#15803d">加固容器（+landlock/seccomp）</text>
  <text x="334" y="608" fill="#334155">十毫秒级，最省</text>
  <text x="554" y="608" fill="#334155">跑自己写的工具代码、CI 型任务、内部脚本</text>

  <text x="30" y="640" fill="#1d4ed8">gVisor</text>
  <text x="334" y="640" fill="#334155">亚秒，syscall 有损耗</text>
  <text x="554" y="640" fill="#334155">不可信代码但需完整用户态（pip、测试框架）</text>

  <text x="30" y="672" fill="#6d28d9">microVM（Firecracker + 快照）</text>
  <text x="334" y="672" fill="#334155">快照后百毫秒级，运维最重</text>
  <text x="554" y="672" fill="#334155">多租户、任意代码、长会话、Computer Use</text>
</svg>
