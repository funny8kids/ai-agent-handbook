<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" role="img" aria-label="Agent 记忆三层图：工作记忆、情景记忆、语义记忆，压缩与蒸馏向下沉淀，检索回填向上虚线回环，右侧为遗忘曲线示意">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="gWork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="gEpi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="gSem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#94a3b8" stroke-width="0.7" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="960" height="580" rx="20" fill="url(#bg)"/>
  <rect width="960" height="580" rx="20" fill="url(#grid)"/>

  <text x="40" y="38" font-size="19" font-weight="700" fill="#0f172a">Agent 记忆三层：工作记忆 · 情景记忆 · 语义记忆</text>
  <text x="40" y="64" font-size="16" fill="#475569">上下文会被清空，记忆必须分层落盘：压缩向下沉淀，检索向上回填</text>

  <!-- ============ 三层卡片 ============ -->
  <!-- 工作记忆 -->
  <g>
    <rect x="150" y="84" width="470" height="120" rx="14" fill="url(#gWork)" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
    <rect x="156" y="98" width="5" height="92" rx="2.5" fill="#059669"/>
    <rect x="176" y="120" width="48" height="48" rx="12" fill="#d1fae5"/>
    <g transform="translate(200,144)" fill="none" stroke="#047857" stroke-width="1.8" stroke-linecap="round">
      <rect x="-9" y="-9" width="18" height="18" rx="3"/>
      <path d="M-4.5,-9 L-4.5,-13.5 M0,-9 L0,-13.5 M4.5,-9 L4.5,-13.5"/>
      <path d="M-4.5,9 L-4.5,13.5 M0,9 L0,13.5 M4.5,9 L4.5,13.5"/>
      <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#047857" stroke="none"/>
    </g>
    <text x="238" y="116" font-size="17" font-weight="700" fill="#0f172a">工作记忆（Work Memory）</text>
    <text x="238" y="142" font-size="16" fill="#475569">即上下文窗口：此刻正在推理的全部内容</text>
    <g stroke="#6ee7b7" fill="#ecfdf5">
      <rect x="238" y="158" width="70" height="26" rx="13"/>
      <rect x="316" y="158" width="56" height="26" rx="13"/>
      <rect x="380" y="158" width="94" height="26" rx="13"/>
    </g>
    <g font-size="15" fill="#047857">
      <text x="273" y="176" text-anchor="middle">会话内</text>
      <text x="344" y="176" text-anchor="middle">易失</text>
      <text x="427" y="176" text-anchor="middle">容量=窗口</text>
    </g>
  </g>

  <!-- 情景记忆 -->
  <g>
    <rect x="150" y="244" width="470" height="120" rx="14" fill="url(#gEpi)" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
    <rect x="156" y="258" width="5" height="92" rx="2.5" fill="#16a34a"/>
    <rect x="176" y="280" width="48" height="48" rx="12" fill="#dcfce7"/>
    <g transform="translate(200,304)">
      <rect x="-9" y="-10.5" width="18" height="21" rx="2.5" fill="none" stroke="#15803d" stroke-width="1.8"/>
      <path d="M-5,-5 L5,-5 M-5,0 L5,0 M-5,5 L2,5" stroke="#15803d" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="238" y="276" font-size="17" font-weight="700" fill="#0f172a">情景记忆（Episodic Memory）</text>
    <text x="238" y="300" font-size="16" fill="#475569">会话转录落盘：每轮消息与工具结果的</text>
    <text x="238" y="320" font-size="16" fill="#475569">原始记录（JSONL）</text>
    <g stroke="#86efac" fill="#f0fdf4">
      <rect x="238" y="328" width="106" height="26" rx="13"/>
      <rect x="352" y="328" width="70" height="26" rx="13"/>
      <rect x="430" y="328" width="86" height="26" rx="13"/>
    </g>
    <g font-size="15" fill="#15803d">
      <text x="291" y="346" text-anchor="middle">JSONL 追加</text>
      <text x="387" y="346" text-anchor="middle">可回放</text>
      <text x="473" y="346" text-anchor="middle">原始细节</text>
    </g>
  </g>

  <!-- 语义记忆 -->
  <g>
    <rect x="150" y="404" width="470" height="120" rx="14" fill="url(#gSem)" stroke="#047857" stroke-width="2" filter="url(#sh)"/>
    <rect x="156" y="418" width="5" height="92" rx="2.5" fill="#047857"/>
    <rect x="176" y="440" width="48" height="48" rx="12" fill="#a7f3d0"/>
    <g transform="translate(200,464)" fill="#065f46">
      <ellipse cx="0" cy="-7" rx="9.5" ry="3.4"/>
      <path d="M-9.5,-7 L-9.5,6 A9.5,3.4 0 0 0 9.5,6 L9.5,-7 A9.5,3.4 0 0 1 -9.5,-7 Z" opacity="0.8"/>
      <ellipse cx="0" cy="-1" rx="9.5" ry="3.4" fill="#a7f3d0"/>
    </g>
    <text x="238" y="436" font-size="17" font-weight="700" fill="#0f172a">语义记忆（Semantic Memory）</text>
    <text x="238" y="462" font-size="16" fill="#475569">蒸馏后的稳定事实与偏好，跨会话持久保存</text>
    <g stroke="#34d399" fill="#dcfce7">
      <rect x="238" y="478" width="130" height="26" rx="13"/>
      <rect x="376" y="478" width="86" height="26" rx="13"/>
      <rect x="470" y="478" width="86" height="26" rx="13"/>
    </g>
    <g font-size="15" fill="#065f46">
      <text x="303" y="496" text-anchor="middle">向量 / KV 存储</text>
      <text x="419" y="496" text-anchor="middle">蒸馏沉淀</text>
      <text x="513" y="496" text-anchor="middle">长期保留</text>
    </g>
  </g>

  <!-- ============ 向下：压缩与蒸馏 ============ -->
  <path d="M280 204 L280 240" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="296" y="230" font-size="15" font-weight="700" fill="#047857">压缩 / 摘要：窗口将满，旧轮次摘要后落盘</text>
  <path d="M280 364 L280 400" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="296" y="390" font-size="15" font-weight="700" fill="#047857">蒸馏 / 沉淀：从转录提炼事实与偏好</text>

  <!-- ============ 向左回环：检索回填 ============ -->
  <path d="M150 484 C 88 484, 88 124, 144 124" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrGreen)">
    <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2s" repeatCount="indefinite"/>
  </path>
  <text transform="translate(62,304) rotate(-90)" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">检索回填（top-k 注入当前上下文）</text>

  <!-- ============ 右侧：遗忘曲线 ============ -->
  <g>
    <rect x="660" y="84" width="276" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
    <text x="678" y="112" font-size="17" font-weight="700" fill="#0f172a">遗忘曲线（示意）</text>
    <text x="678" y="136" font-size="15" fill="#475569">记忆强度随时间指数衰减</text>

    <path d="M712 156 L712 278 L916 278" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M716 164 C 730 172, 736 214, 758 240 C 786 268, 850 272, 912 272 L 912 278 L 716 278 Z" fill="#059669" opacity="0.08"/>
    <path id="decay" d="M716 164 C 730 172, 736 214, 758 240 C 786 268, 850 272, 912 272" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <circle r="3.5" fill="#047857">
      <animateMotion dur="4s" repeatCount="indefinite" path="M716 164 C 730 172, 736 214, 758 240 C 786 268, 850 272, 912 272"/>
    </circle>
    <text x="770" y="206" font-size="15" font-weight="700" fill="#475569">不访问 → 衰减</text>
    <text x="814" y="298" text-anchor="middle" font-size="15" fill="#64748b">时间</text>
    <text transform="translate(696,220) rotate(-90)" text-anchor="middle" font-size="15" fill="#64748b">保留强度</text>
  </g>

  <!-- 对策卡 -->
  <g>
    <rect x="660" y="334" width="276" height="190" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="678" y="364" font-size="17" font-weight="700" fill="#14532d">对抗遗忘的三条路</text>
    <text x="678" y="394" font-size="15" fill="#166534">1. 反复访问 / 复习</text>
    <text x="698" y="416" font-size="15" fill="#166534">→ 衰减重置</text>
    <text x="678" y="446" font-size="15" fill="#166534">2. 压缩转写 → 存入情景层</text>
    <text x="678" y="476" font-size="15" fill="#166534">3. 蒸馏落盘 → 语义层最耐久</text>
    <text x="40" y="556" font-size="16" fill="#475569">分层直觉：窗口是草稿纸，转录是流水账，语义是笔记本——越往下越耐久。</text>
  </g>
</svg>
