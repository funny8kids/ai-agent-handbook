<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" role="img" aria-label="LLM 200k 上下文窗口的 token 预算分配：稳定前缀 8%、历史对话 45%、RAG 检索块 15%、工具观察 22%、预留输出 10%，并给出压缩后（历史折叠为摘要、观察截断）释放约 86k 余量的对比预算条">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f5f7ff"/>
      <stop offset="100%" stop-color="#e7ecff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4f46e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="gSys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gHist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/><stop offset="100%" stop-color="#8b9cf7"/>
    </linearGradient>
    <linearGradient id="gHistS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="gRag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gObs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#047857"/><stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="shSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <clipPath id="clipA"><rect x="56" y="140" width="848" height="64" rx="10"/></clipPath>
    <clipPath id="clipB"><rect x="56" y="408" width="848" height="64" rx="10"/></clipPath>
  </defs>

  <!-- ===== background: gradient + grid (second layer) ===== -->
  <rect width="960" height="700" rx="18" fill="url(#bg)"/>
  <rect width="960" height="700" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="959" height="699" rx="18" fill="none" stroke="#cbd5e1"/>

  <!-- ===== title row ===== -->
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">上下文预算：200k token 怎么分</text>
  <text x="40" y="74" font-size="16" fill="#475569">把窗口当预算管：稳定前缀 → 历史 → 检索 → 观察 → 预留输出，越靠后越是本轮才定的内容</text>
  <g filter="url(#shSoft)">
    <rect x="728" y="26" width="192" height="30" rx="15" fill="#eef2ff" stroke="#a5b4fc"/>
  </g>
  <text x="824" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">第 3 章 · 上下文工程</text>

  <!-- ===== panel A: assembled request ===== -->
  <g filter="url(#sh)">
    <rect x="40" y="96" width="880" height="252" rx="14" fill="#ffffff" fill-opacity="0.78" stroke="#c7d2fe"/>
  </g>
  <text x="56" y="126" font-size="17" font-weight="700" fill="#3730a3">装配顺序 · 缓存友好：稳定内容在前，追加只发生在尾部</text>
  <text x="904" y="126" text-anchor="end" font-size="15" fill="#64748b">总预算 200k（窗口顶）· 装配后已用满</text>

  <g clip-path="url(#clipA)">
    <rect x="56" y="140" width="68" height="64" fill="url(#gSys)"/>
    <rect x="124" y="140" width="382" height="64" fill="url(#gHist)"/>
    <rect x="506" y="140" width="127" height="64" fill="url(#gRag)"/>
    <rect x="633" y="140" width="186" height="64" fill="url(#gObs)"/>
    <rect x="819" y="140" width="85" height="64" fill="url(#gOut)"/>
    <g stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9">
      <path d="M124 140V204"/><path d="M506 140V204"/><path d="M633 140V204"/><path d="M819 140V204"/>
    </g>
    <!-- appended-this-turn pulse (growth happens only at the tail) -->
    <rect x="633" y="140" width="186" height="64" fill="#fef3c7" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" keyTimes="0;0.4;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g text-anchor="middle" font-weight="700">
    <text x="90" y="177" font-size="15" fill="#ffffff">前缀</text>
    <text x="315" y="166" font-size="17" fill="#1e1b4b">历史对话 · 逐轮追加</text>
    <text x="315" y="190" font-size="15" fill="#312e81">45% ≈90k</text>
    <text x="569" y="166" font-size="17" fill="#ffffff">RAG 检索块</text>
    <text x="569" y="190" font-size="15" fill="#cffafe">15% ≈30k</text>
    <text x="726" y="166" font-size="17" fill="#451a03">工具观察 / 草稿</text>
    <text x="726" y="190" font-size="15" fill="#451a03">22% ≈44k</text>
    <text x="861" y="177" font-size="15" fill="#ffffff">输出</text>
  </g>
  <!-- cumulative scale ticks -->
  <g stroke="#94a3b8" stroke-width="1" stroke-opacity="0.6">
    <path d="M124 204v7"/><path d="M506 204v7"/><path d="M633 204v7"/><path d="M819 204v7"/><path d="M903 204v7"/>
  </g>
  <g font-size="15" fill="#64748b">
    <text x="128" y="228">16k</text>
    <text x="510" y="228">106k</text>
    <text x="637" y="228">136k</text>
    <text x="815" y="228" text-anchor="end">180k</text>
    <text x="904" y="228" text-anchor="end">200k</text>
  </g>
  <!-- cache boundary hint (aligned with panel B) -->
  <g stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 3">
    <path d="M124 211v11"/>
  </g>

  <!-- budget legend cells -->
  <g>
    <g filter="url(#shSoft)">
      <rect x="56" y="244" width="168" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="226" y="244" width="168" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="396" y="244" width="168" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="566" y="244" width="168" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="736" y="244" width="168" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    </g>
    <rect x="68" y="256" width="12" height="12" rx="3" fill="url(#gSys)"/>
    <text x="88" y="267" font-size="16" font-weight="700" fill="#0f172a">稳定前缀</text>
    <text x="68" y="292" font-size="15" fill="#475569">8% ≈16k token</text>
    <text x="68" y="314" font-size="15" fill="#64748b">System 与工具定义</text>

    <rect x="238" y="256" width="12" height="12" rx="3" fill="url(#gHist)"/>
    <text x="258" y="267" font-size="16" font-weight="700" fill="#0f172a">历史对话</text>
    <text x="238" y="292" font-size="15" fill="#475569">45% ≈90k token</text>
    <text x="238" y="314" font-size="15" fill="#64748b">最大块，压缩主目标</text>

    <rect x="408" y="256" width="12" height="12" rx="3" fill="url(#gRag)"/>
    <text x="428" y="267" font-size="16" font-weight="700" fill="#0f172a">RAG 检索块</text>
    <text x="408" y="292" font-size="15" fill="#475569">15% ≈30k token</text>
    <text x="408" y="314" font-size="15" fill="#64748b">top-k 截断 + 去重</text>

    <rect x="578" y="256" width="12" height="12" rx="3" fill="url(#gObs)"/>
    <text x="598" y="267" font-size="16" font-weight="700" fill="#0f172a">工具观察</text>
    <text x="566" y="292" font-size="15" fill="#475569">22% ≈44k token</text>
    <text x="566" y="314" font-size="15" fill="#64748b">截断展示，原文落盘</text>

    <rect x="748" y="256" width="12" height="12" rx="3" fill="url(#gOut)"/>
    <text x="768" y="267" font-size="16" font-weight="700" fill="#0f172a">预留输出</text>
    <text x="736" y="292" font-size="15" fill="#475569">10% ≈20k token</text>
    <text x="736" y="314" font-size="15" fill="#64748b">答案与 tool call</text>
  </g>

  <!-- ===== panel B: after compression ===== -->
  <g filter="url(#sh)">
    <rect x="40" y="364" width="880" height="252" rx="14" fill="#ffffff" fill-opacity="0.78" stroke="#a5b4fc"/>
  </g>
  <text x="56" y="394" font-size="17" font-weight="700" fill="#312e81">压缩后：历史折叠成摘要、观察只留引用，稳定前缀一字不动 → 缓存继续命中</text>
  <text x="904" y="394" text-anchor="end" font-size="15" fill="#64748b">已用 114k · 释放 86k</text>

  <g clip-path="url(#clipB)">
    <rect x="56" y="408" width="68" height="64" fill="url(#gSys)"/>
    <rect x="124" y="408" width="102" height="64" fill="url(#gHistS)"/>
    <rect x="226" y="408" width="127" height="64" fill="url(#gRag)"/>
    <rect x="353" y="408" width="102" height="64" fill="url(#gObs)"/>
    <rect x="455" y="408" width="85" height="64" fill="url(#gOut)"/>
    <rect x="540" y="408" width="364" height="64" fill="#eef2ff"/>
    <g stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9">
      <path d="M124 408V472"/><path d="M226 408V472"/><path d="M353 408V472"/><path d="M455 408V472"/>
    </g>
    <!-- reclaimed headroom breathes: it can be filled again -->
    <rect x="540" y="408" width="364" height="64" fill="#4f46e5" opacity="0">
      <animate attributeName="opacity" values="0;0.2;0" keyTimes="0;0.45;1" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="541.5" y="409.5" width="361" height="61" rx="8" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="6 5"/>
  <g text-anchor="middle" font-weight="700">
    <text x="90" y="445" font-size="15" fill="#ffffff">前缀</text>
    <text x="175" y="434" font-size="16" fill="#1e1b4b">历史摘要</text>
    <text x="175" y="458" font-size="15" fill="#3730a3">12% ≈24k</text>
    <text x="289" y="434" font-size="16" fill="#ffffff">RAG 检索块</text>
    <text x="289" y="458" font-size="15" fill="#cffafe">15% ≈30k</text>
    <text x="404" y="434" font-size="16" fill="#451a03">观察截断</text>
    <text x="404" y="458" font-size="15" fill="#451a03">12% ≈24k</text>
    <text x="497" y="434" font-size="16" fill="#ffffff">预留输出</text>
    <text x="497" y="458" font-size="15" fill="#d1fae5">10% ≈20k</text>
    <text x="722" y="434" font-size="18" fill="#3730a3">腾出 86k · 约 43%</text>
    <text x="722" y="458" font-size="15" font-weight="400" fill="#4338ca">留给下一轮的新消息、检索与更长的推理草稿</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1" stroke-opacity="0.6">
    <path d="M124 472v7"/><path d="M226 472v7"/><path d="M353 472v7"/><path d="M455 472v7"/><path d="M540 472v7"/>
  </g>
  <g font-size="15" fill="#64748b">
    <text x="128" y="496">16k</text>
    <text x="230" y="496">40k</text>
    <text x="357" y="496">70k</text>
    <text x="459" y="496">94k</text>
    <text x="544" y="496">114k</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 3">
    <path d="M124 400v8"/>
  </g>

  <!-- compression play-by-play -->
  <g>
    <g filter="url(#shSoft)">
      <rect x="56" y="508" width="272" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="344" y="508" width="272" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="632" y="508" width="272" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    </g>
    <rect x="56" y="508" width="3" height="88" rx="1.5" fill="#6366f1"/>
    <text x="70" y="532" font-size="16" font-weight="700" fill="#0f172a">历史 90k → 摘要 24k</text>
    <text x="70" y="558" font-size="15" fill="#475569">折叠旧轮，保留决策、未竟事项</text>
    <text x="70" y="580" font-size="15" fill="#475569">关键 ID；摘要追加在尾部</text>

    <rect x="344" y="508" width="3" height="88" rx="1.5" fill="#d97706"/>
    <text x="358" y="532" font-size="16" font-weight="700" fill="#0f172a">观察截断 + 落盘引用</text>
    <text x="358" y="558" font-size="15" fill="#475569">只留头尾若干行与结论</text>
    <text x="358" y="580" font-size="15" fill="#475569">原文写进文件，用 path + 行号回读</text>

    <rect x="632" y="508" width="3" height="88" rx="1.5" fill="#16a34a"/>
    <text x="646" y="532" font-size="16" font-weight="700" fill="#0f172a">前缀保持逐字不变</text>
    <text x="646" y="558" font-size="15" fill="#475569">绿色虚线是缓存分界：压缩不碰这段</text>
    <text x="646" y="580" font-size="15" fill="#475569">prefix cache 才不会整段失效</text>
  </g>

  <!-- ===== takeaway ===== -->
  <g filter="url(#shSoft)">
    <rect x="40" y="632" width="880" height="48" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  </g>
  <text x="56" y="662" font-size="17" font-weight="700" fill="#3730a3">预算纪律：预留输出永远不让位；要瘦身只动历史与观察；稳定前缀不许改。</text>
  <text x="904" y="662" text-anchor="end" font-size="15" fill="#4338ca">使用率 &gt; 80% 就压缩，别等截断</text>
</svg>
