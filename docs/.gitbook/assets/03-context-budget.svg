<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="LLM 200k 上下文窗口的 token 预算分配：稳定前缀 8%、历史对话 45%、RAG 检索块 15%、工具观察 22%、预留输出 10%，并给出压缩后（历史折叠为摘要、观察截断）释放约 86k 余量的对比预算条">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f5f7ff"/>
      <stop offset="100%" stop-color="#e7ecff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4f46e5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="gSys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gHist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/><stop offset="100%" stop-color="#8b9cf7"/>
    </linearGradient>
    <linearGradient id="gHistS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="gRag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gObs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="shSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <clipPath id="clipA"><rect x="56" y="130" width="848" height="54" rx="10"/></clipPath>
    <clipPath id="clipB"><rect x="56" y="328" width="848" height="54" rx="10"/></clipPath>
  </defs>

  <!-- ===== background: gradient + grid (second layer) ===== -->
  <rect width="960" height="540" rx="18" fill="url(#bg)"/>
  <rect width="960" height="540" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="18" fill="none" stroke="#cbd5e1"/>

  <!-- ===== title row ===== -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#0f172a">上下文预算：200k token 怎么分</text>
  <text x="40" y="66" font-size="13" fill="#475569">把窗口当预算管：稳定前缀 → 历史 → 检索 → 观察 → 预留输出，越靠后越是本轮才定的内容</text>
  <g filter="url(#shSoft)">
    <rect x="744" y="24" width="176" height="26" rx="13" fill="#eef2ff" stroke="#a5b4fc"/>
  </g>
  <text x="832" y="41" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3730a3">第 3 章 · 上下文工程</text>

  <!-- ===== panel A: assembled request ===== -->
  <g filter="url(#sh)">
    <rect x="40" y="92" width="880" height="180" rx="14" fill="#ffffff" fill-opacity="0.78" stroke="#c7d2fe"/>
  </g>
  <text x="56" y="116" font-size="13.5" font-weight="700" fill="#3730a3">装配顺序 · 缓存友好：稳定内容在前，追加只发生在尾部</text>
  <text x="904" y="116" text-anchor="end" font-size="12" fill="#64748b">总预算 200k · 装配后已用满</text>

  <g clip-path="url(#clipA)">
    <rect x="56" y="130" width="68" height="54" fill="url(#gSys)"/>
    <rect x="124" y="130" width="382" height="54" fill="url(#gHist)"/>
    <rect x="506" y="130" width="127" height="54" fill="url(#gRag)"/>
    <rect x="633" y="130" width="186" height="54" fill="url(#gObs)"/>
    <rect x="819" y="130" width="85" height="54" fill="url(#gOut)"/>
    <g stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9">
      <path d="M124 130V184"/><path d="M506 130V184"/><path d="M633 130V184"/><path d="M819 130V184"/>
    </g>
    <!-- appended-this-turn pulse (growth happens only at the tail) -->
    <rect x="633" y="130" width="186" height="54" fill="#fef3c7" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" keyTimes="0;0.4;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g text-anchor="middle" font-weight="700">
    <text x="90" y="152" font-size="11" fill="#ffffff">稳定前缀</text>
    <text x="90" y="169" font-size="9.5" fill="#e0e7ff">8% ≈16k</text>
    <text x="315" y="152" font-size="12.5" fill="#1e1b4b">历史对话（逐轮追加）</text>
    <text x="315" y="170" font-size="11" fill="#312e81">45% ≈90k</text>
    <text x="569" y="152" font-size="12" fill="#ffffff">RAG 检索块</text>
    <text x="569" y="170" font-size="10.5" fill="#cffafe">15% ≈30k</text>
    <text x="726" y="152" font-size="12.5" fill="#ffffff">工具观察 / 草稿</text>
    <text x="726" y="170" font-size="11" fill="#fef3c7">22% ≈44k</text>
    <text x="861" y="152" font-size="12" fill="#ffffff">预留输出</text>
    <text x="861" y="169" font-size="10" fill="#d1fae5">10% ≈20k</text>
  </g>
  <!-- cumulative scale ticks -->
  <g stroke="#94a3b8" stroke-width="1" stroke-opacity="0.6">
    <path d="M124 184v6"/><path d="M506 184v6"/><path d="M633 184v6"/><path d="M819 184v6"/><path d="M903 184v6"/>
  </g>
  <g font-size="9.5" fill="#94a3b8">
    <text x="128" y="198">16k</text>
    <text x="510" y="198">106k</text>
    <text x="637" y="198">136k</text>
    <text x="815" y="198" text-anchor="end">180k</text>
    <text x="904" y="198" text-anchor="end">200k（窗口顶）</text>
  </g>
  <!-- cache boundary hint (aligned with panel B) -->
  <g stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 3">
    <path d="M124 190v10"/>
  </g>

  <!-- budget legend cells -->
  <g>
    <g filter="url(#shSoft)">
      <rect x="56" y="204" width="168" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="226" y="204" width="168" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="396" y="204" width="168" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="566" y="204" width="168" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="736" y="204" width="168" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    </g>
    <rect x="68" y="214" width="10" height="10" rx="3" fill="url(#gSys)"/>
    <text x="86" y="223" font-size="12" font-weight="700" fill="#0f172a">稳定前缀</text>
    <text x="68" y="240" font-size="11" fill="#475569">8% · 约 16k token</text>
    <text x="68" y="254" font-size="10" fill="#94a3b8">System + 工具 schema</text>

    <rect x="238" y="214" width="10" height="10" rx="3" fill="url(#gHist)"/>
    <text x="256" y="223" font-size="12" font-weight="700" fill="#0f172a">历史对话</text>
    <text x="238" y="240" font-size="11" fill="#475569">45% · 约 90k token</text>
    <text x="238" y="254" font-size="10" fill="#94a3b8">最大块，压缩的主目标</text>

    <rect x="408" y="214" width="10" height="10" rx="3" fill="url(#gRag)"/>
    <text x="426" y="223" font-size="12" font-weight="700" fill="#0f172a">RAG 检索块</text>
    <text x="408" y="240" font-size="11" fill="#475569">15% · 约 30k token</text>
    <text x="408" y="254" font-size="10" fill="#94a3b8">top-k 截断 + 去重</text>

    <rect x="578" y="214" width="10" height="10" rx="3" fill="url(#gObs)"/>
    <text x="596" y="223" font-size="12" font-weight="700" fill="#0f172a">工具观察 / 草稿</text>
    <text x="578" y="240" font-size="11" fill="#475569">22% · 约 44k token</text>
    <text x="578" y="254" font-size="10" fill="#94a3b8">截断展示，原文落盘</text>

    <rect x="748" y="214" width="10" height="10" rx="3" fill="url(#gOut)"/>
    <text x="766" y="223" font-size="12" font-weight="700" fill="#0f172a">预留输出</text>
    <text x="748" y="240" font-size="11" fill="#475569">10% · 约 20k token</text>
    <text x="748" y="254" font-size="10" fill="#94a3b8">给答案与 tool call</text>
  </g>

  <!-- ===== panel B: after compression ===== -->
  <g filter="url(#sh)">
    <rect x="40" y="290" width="880" height="180" rx="14" fill="#ffffff" fill-opacity="0.78" stroke="#a5b4fc"/>
  </g>
  <text x="56" y="314" font-size="13.5" font-weight="700" fill="#312e81">压缩后：历史折叠成摘要、观察只留引用，稳定前缀一字不动 → 缓存继续命中</text>
  <text x="904" y="314" text-anchor="end" font-size="12" fill="#64748b">已用 114k · 释放 86k</text>

  <g clip-path="url(#clipB)">
    <rect x="56" y="328" width="68" height="54" fill="url(#gSys)"/>
    <rect x="124" y="328" width="102" height="54" fill="url(#gHistS)"/>
    <rect x="226" y="328" width="127" height="54" fill="url(#gRag)"/>
    <rect x="353" y="328" width="102" height="54" fill="url(#gObs)"/>
    <rect x="455" y="328" width="85" height="54" fill="url(#gOut)"/>
    <rect x="540" y="328" width="364" height="54" fill="#eef2ff"/>
    <g stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9">
      <path d="M124 328V382"/><path d="M226 328V382"/><path d="M353 328V382"/><path d="M455 328V382"/>
    </g>
    <!-- reclaimed headroom breathes: it can be filled again -->
    <rect x="540" y="328" width="364" height="54" fill="#4f46e5" opacity="0">
      <animate attributeName="opacity" values="0;0.2;0" keyTimes="0;0.45;1" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="541.5" y="329.5" width="361" height="51" rx="8" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="6 5"/>
  <g text-anchor="middle" font-weight="700">
    <text x="90" y="350" font-size="11" fill="#ffffff">稳定前缀</text>
    <text x="90" y="367" font-size="9.5" fill="#e0e7ff">8% ≈16k</text>
    <text x="175" y="350" font-size="11.5" fill="#1e1b4b">历史摘要</text>
    <text x="175" y="367" font-size="10" fill="#3730a3">12% ≈24k</text>
    <text x="289" y="350" font-size="12" fill="#ffffff">RAG 检索块</text>
    <text x="289" y="367" font-size="10.5" fill="#cffafe">15% ≈30k</text>
    <text x="404" y="350" font-size="11.5" fill="#ffffff">观察截断</text>
    <text x="404" y="367" font-size="10" fill="#fef3c7">12% ≈24k</text>
    <text x="497" y="350" font-size="11.5" fill="#ffffff">预留输出</text>
    <text x="497" y="367" font-size="10" fill="#d1fae5">10% ≈20k</text>
    <text x="722" y="350" font-size="12.5" fill="#3730a3">腾出 86k · 约 43%</text>
    <text x="722" y="368" font-size="10.5" font-weight="400" fill="#4f46e5">留给下一轮的新消息、检索与更长的推理草稿</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1" stroke-opacity="0.6">
    <path d="M124 382v6"/><path d="M226 382v6"/><path d="M353 382v6"/><path d="M455 382v6"/><path d="M540 382v6"/>
  </g>
  <g font-size="9.5" fill="#94a3b8">
    <text x="128" y="396">16k</text>
    <text x="230" y="396">40k</text>
    <text x="357" y="396">70k</text>
    <text x="459" y="396">94k</text>
    <text x="544" y="396">114k</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 3">
    <path d="M124 320v8"/>
  </g>

  <!-- compression play-by-play -->
  <g>
    <g filter="url(#shSoft)">
      <rect x="56" y="400" width="272" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="344" y="400" width="272" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="632" y="400" width="272" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    </g>
    <rect x="56" y="400" width="3" height="56" rx="1.5" fill="#6366f1"/>
    <text x="70" y="420" font-size="12" font-weight="700" fill="#0f172a">历史 90k → 摘要 24k</text>
    <text x="70" y="437" font-size="10.5" fill="#475569">折叠旧轮，保留决策、未竟事项、</text>
    <text x="70" y="451" font-size="10.5" fill="#475569">关键 ID；摘要追加在尾部而非改写</text>

    <rect x="344" y="400" width="3" height="56" rx="1.5" fill="#d97706"/>
    <text x="358" y="420" font-size="12" font-weight="700" fill="#0f172a">观察截断 + 落盘引用</text>
    <text x="358" y="437" font-size="10.5" fill="#475569">只留头尾若干行与结论，原文写到</text>
    <text x="358" y="451" font-size="10.5" fill="#475569">文件里，用 path + 行号回读</text>

    <rect x="632" y="400" width="3" height="56" rx="1.5" fill="#16a34a"/>
    <text x="646" y="420" font-size="12" font-weight="700" fill="#0f172a">前缀保持逐字不变</text>
    <text x="646" y="437" font-size="10.5" fill="#475569">绿色虚线是缓存分界：压缩不碰这段，</text>
    <text x="646" y="451" font-size="10.5" fill="#475569">prefix cache 才不会整段失效</text>
  </g>

  <!-- ===== takeaway ===== -->
  <g filter="url(#shSoft)">
    <rect x="40" y="486" width="880" height="42" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  </g>
  <text x="56" y="512" font-size="12.5" font-weight="700" fill="#3730a3">预算纪律：预留输出永远不让位；要瘦身只动历史与观察；稳定前缀不许改。</text>
  <text x="904" y="512" text-anchor="end" font-size="12" fill="#4338ca">使用率 &gt; 80% 就压缩，别等截断</text>
</svg>
