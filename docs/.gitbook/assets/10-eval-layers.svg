<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Agent 评估四层指标体系图">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="l4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <filter id="sh6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#bg6)"/>
  <text x="48" y="60" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0F172A">Agent 评估四层指标</text>
  <text x="48" y="88" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#64748B">只看结果会漏掉「答对了但烧了 10 万 token、绕了 40 步」——四层都要测</text>

  <!-- 四层条 -->
  <g filter="url(#sh6)">
    <rect x="48" y="126" width="520" height="82" rx="14" fill="url(#l1)"/>
    <rect x="48" y="222" width="520" height="82" rx="14" fill="url(#l2)"/>
    <rect x="48" y="318" width="520" height="82" rx="14" fill="url(#l3)"/>
    <rect x="48" y="414" width="520" height="82" rx="14" fill="url(#l4)"/>
  </g>
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#FFFFFF">
    <text x="76" y="162" font-size="17" font-weight="700">结果层</text>
    <text x="76" y="186" font-size="12.5" opacity="0.92">任务成功率 · 部分完成度 · 答案质量</text>
    <text x="76" y="258" font-size="17" font-weight="700">轨迹层</text>
    <text x="76" y="282" font-size="12.5" opacity="0.92">步数冗余 · 工具选择正确率 · 错误恢复率</text>
    <text x="76" y="354" font-size="17" font-weight="700">效率层</text>
    <text x="76" y="378" font-size="12.5" opacity="0.92">token 成本 · 延迟 P50/P95 · 循环次数</text>
    <text x="76" y="450" font-size="17" font-weight="700">鲁棒层</text>
    <text x="76" y="474" font-size="12.5" opacity="0.92">抗注入率 · 歧义输入 · 超时与降级表现</text>
  </g>

  <!-- 右侧：怎么测 -->
  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="608" y="140" font-size="14.5" font-weight="700" fill="#475569">怎么测</text>
    <g filter="url(#sh6)"><rect x="608" y="154" width="304" height="66" rx="12" fill="#FFFFFF"/></g>
    <text x="628" y="180" font-size="13" font-weight="700" fill="#1E293B">能程序化验证就别用 LLM 评分</text>
    <text x="628" y="202" font-size="11.5" fill="#64748B">测试通过 / 字段匹配 / 格式合法</text>

    <g filter="url(#sh6)"><rect x="608" y="232" width="304" height="66" rx="12" fill="#FFFFFF"/></g>
    <text x="628" y="258" font-size="13" font-weight="700" fill="#1E293B">LLM judge 用成对比较</text>
    <text x="628" y="280" font-size="11.5" fill="#64748B">A vs B + 交换位置，报告 Cohen's κ</text>

    <g filter="url(#sh6)"><rect x="608" y="310" width="304" height="66" rx="12" fill="#FFFFFF"/></g>
    <text x="628" y="336" font-size="13" font-weight="700" fill="#1E293B">检索与生成分开测</text>
    <text x="628" y="358" font-size="11.5" fill="#64748B">Recall@k / MRR 与忠实度分开算</text>

    <g filter="url(#sh6)"><rect x="608" y="388" width="304" height="66" rx="12" fill="#FFFFFF"/></g>
    <text x="628" y="414" font-size="13" font-weight="700" fill="#1E293B">评估集进 CI，失败案例回流</text>
    <text x="628" y="436" font-size="11.5" fill="#64748B">每次改动跑回归，退化即报警</text>
  </g>

  <text x="48" y="524" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#64748B">pass@k 需同时报告 k 与采样数 n；跨报告比较要固定模型版本、harness 与预算。</text>
</svg>
